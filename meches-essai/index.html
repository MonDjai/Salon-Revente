      if(state.config.codeAccesOk) return;
      state.config.codeAccesOk = true;
      state.config.derniereValidationAcces = Date.now();
      state.config.moisAccesValide = finEssaiPourInstallation(parseDateStr(state.meta.creation) || new Date());
      saveState();
    },
    sauvegarder: function(){ exporterJson(); },
    surChangement: function(){ render(); },
    // Accès local d'avant le compte (essai ou code du mois déjà validé) :
    // valable tant que le serveur n'a pas donné de statut.
    accesLocal: function(){
      if(!state.config.codeAccesOk || !state.config.moisAccesValide) return null;
      var c = state.config.moisAccesValide;
      var fin = new Date(c.annee, c.mois, 0);
      return { fin: fin.getFullYear() + "-" + pad2(fin.getMonth() + 1) + "-" + pad2(fin.getDate()) };
    },
    surStatut: function(){ controleDemande = true; },
    verifierPinExistant: function(pin){ return !!(state.config.pinCode && pin === state.config.pinCode); },
    // Sauvegarde en ligne : le même contenu que le fichier « Sauvegarder mes données ».
    contenuSauvegarde: function(){ return etatPourFichier(); },
    restaurerContenu: function(contenu){ return restaurerEtat(contenu); },
    etatVide: function(){ return etatSansChiffres(state); },
    // Rappels, guide, notifications, comptages anonymes.
    derniereSaisie: function(){ return derniereSaisie(); },
    debutUsage: function(){ return state.meta && state.meta.creation ? String(state.meta.creation).slice(0, 10) : null; },
    derniereSauvegardeFichier: function(){ return state.meta && state.meta.derniereSauvegarde ? String(state.meta.derniereSauvegarde).slice(0, 10) : null; },
    ouvrirSaisie: function(){ ouvrirSaisieDepuisRappel(); },
    ouvrirSauvegarde: function(){ ouvrirReglagesSauvegarde(); },
    ouvrirEcran: function(e){ ouvrirEcranDemande(e); },
    ecranCourant: function(){ return nomEcranCourant(); },
    guide: function(){ return guideMeches(); },
    // Bloc v4 : code PIN du compte tapé sur « Bon retour » : Mèches est ouverte.
    deverrouiller: function(){ ui.locked = false; ui.pinLockInput = ""; ui.pinLockErreur = false; }
  };
  // Code PIN demandé à l'ouverture ? L'ancien code en clair, ou le code du
  // compte (un seul pour le compte : créé ici ou dans Coiffure).
  function pinRequis(){
    return !!(state.config.pinActif && state.config.pinCode) || MonDjaiCompte.pinDefini();
  }
  function pinCorrect(saisie){
    if(state.config.pinCode) return saisie === state.config.pinCode;
    return MonDjaiCompte.verifierPin(saisie);
  }
  // Contenu du fichier « Sauvegarder mes données » : l'état de Mèches, plus
  // un bloc « compte » (jamais la session).
  function etatPourFichier(){
    var copie = JSON.parse(JSON.stringify(state));
    copie.compte = MonDjaiCompte.pourSauvegarde();
    return copie;
  }
  // Rien de noté (aucun achat, vente, charge, mise de côté, objectif, produit ni fonds de départ).
  function etatSansChiffres(s){
    if(!s || typeof s !== "object") return true;
    var n = function(a){ return Array.isArray(a) ? a.length : 0; };
    var c = s.config && typeof s.config === "object" ? s.config : {};
    return !n(s.achats) && !n(s.ventes) && !n(s.autresCharges) && !n(s.misesDeCote) && !s.objectifEpargne &&
      !n(c.produits) && !(Number(c.fondsDepartCaisse) > 0);
  }
  // Restauration (fichier ou sauvegarde en ligne) : mêmes règles. Le bloc
  // « compte » ne rejoint jamais l'état de Mèches ; il est remis en place
  // seulement s'il manque sur ce téléphone.
  function restaurerEtat(parsed){
    if(!parsed || typeof parsed !== "object" || Array.isArray(parsed)) return false;
    var copie = JSON.parse(JSON.stringify(parsed));
    var compteDuFichier = copie.compte || null;
    delete copie.compte;
    state = normaliserEtatImporte(copie);
    saveState();
    MonDjaiCompte.restaurerDepuisSauvegarde(compteDuFichier);
    controleDemande = true;
    return true;
  }

  /* ----- Rappels, guide, comptages (avec le bloc) ----- */
  function jourDeTs(ts){ var d = new Date(ts); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  // Jour de la dernière saisie (création ou modification) : achat, vente,
  // charge commune, mise de côté.
  function derniereSaisie(){
    var max = null;
    function voir(liste){
      (Array.isArray(liste) ? liste : []).forEach(function(x){
        if(!x || typeof x !== "object") return;
        var j = typeof x.ts === "number" && x.ts > 0 ? jourDeTs(x.ts) : (typeof x.date === "string" ? x.date.slice(0, 10) : null);
        if(typeof x.modifieLe === "number" && x.modifieLe > 0){ var m = jourDeTs(x.modifieLe); if(!j || m > j) j = m; }
        if(j && (!max || j > max)) max = j;
      });
    }
    voir(state.achats); voir(state.ventes); voir(state.autresCharges); voir(state.misesDeCote);
    return max;
  }
  // « Rien noté depuis 2 jours · Noter » (et la notification) : une vente, comme le « + » de Ventes du jour.
  function ouvrirSaisieDepuisRappel(){
    if(!gardeEcriture("add-vente")) return;
    ui.tab = "aujourdhui"; ui.overlay = null; ui.modalReturnTo = null;
    MonDjaiCompte.debutSaisie();
    openModal("add-vente");
  }
  function ouvrirReglagesSauvegarde(){
    ui.modal = null; ui.modalReturnTo = null; ui.draft = {}; ui.errors = {};
    ouvrirOngletReglages("sauvegarde");
    render();
  }
  // Notification touchée : l'écran qu'elle annonce.
  function ouvrirEcranDemande(e){
    if(e === "abonnement"){ MonDjaiCompte.ouvrirAbonnement(); return; }
    if(e === "saisie"){ ouvrirSaisieDepuisRappel(); return; }
    if(e === "sauvegarde"){ ouvrirReglagesSauvegarde(); return; }
    if(ui.tab !== "aujourdhui" || ui.overlay){ ui.tab = "aujourdhui"; ui.overlay = null; render(); }
  }
  function nomEcranCourant(){
    if(!state.config.codeAccesOk) return "inscription";
    if(ui.locked) return "pin";
    return ui.overlay || ui.tab;
  }
  // Le guide en bulles de Mèches (cahier §5.7) : posé sur les vrais éléments
  // d'Aujourd'hui (D1) ; la démonstration ouvre le vrai formulaire de vente
  // sans rien enregistrer (le guide couvre l'écran), et fermer le guide le referme.
  var TEXTES_GUIDE = ["Vos ventes du jour, ici.", "Une vente ? Touchez ici.", "Tapez le montant…", "…puis Enregistrer. C’est noté !", "Votre argent : caisse, stock, épargne."];
  function demoOuverte(){ return !!(ui.modal && ui.modal.demo); }
  function ouvrirDemoGuide(){
    if(demoOuverte()) return;
    ui.tab = "aujourdhui"; ui.overlay = null; ui.modalReturnTo = null; ui.pendingAutofocus = false;
    openModal("add-vente", { demo: true });
  }
  function fermerDemoGuide(){
    if(!demoOuverte()) return;
    ui.modalReturnTo = null;
    closeModal();
  }
  function guideMeches(){
    var t = TEXTES_GUIDE;
    return {
      bulles: [
        { cible: '[data-test="case-ventes-jour"]', texte: t[0], avant: function(){
            fermerDemoGuide();
            if(ui.tab !== "aujourdhui" || ui.overlay || ui.modal){ ui.tab = "aujourdhui"; ui.overlay = null; ui.modal = null; ui.modalReturnTo = null; render(); }
          } },
        { cible: '[data-test="plus-ventes-jour"]', texte: t[1], avant: fermerDemoGuide },
        { cible: "#f-montant", texte: t[2], avant: ouvrirDemoGuide },
        { cible: '[data-action="enregistrer-vente"]', texte: t[3], avant: ouvrirDemoGuide },
        { cible: '[data-test="bouton-mon-djai"]', texte: t[4], avant: fermerDemoGuide }
      ],
      fin: fermerDemoGuide
    };
  }

  /* ----- Accès et lecture seule ----- */
  // L'accès appliqué ne change qu'aux moments de contrôle (ouverture, retour
  // au premier plan, restauration, statut reçu), jamais en pleine saisie :
  // une feuille ouverte à minuit reste ouverte, même si un statut arrive.
  var accesApplique = { saisieOuverte: true, valeur: null };
  var controleDemande = true;
  function enSaisie(){
    if(ui.modal || ui.overlay === "objectif") return true;
    var actif = document.activeElement;
    return !!(actif && actif.isConnected !== false && /^(INPUT|TEXTAREA|SELECT)$/.test(actif.tagName));
  }
  // Renvoie true si l'accès appliqué a changé.
  function controlerAccesSiPossible(){
    if(!controleDemande || enSaisie()) return false;
    controleDemande = false;
    var a = MonDjaiCompte.acces(), avant = accesApplique.saisieOuverte;
    accesApplique = { saisieOuverte: a.saisieOuverte !== false, valeur: a.valeur };
    return avant !== accesApplique.saisieOuverte;
  }
  function saisieOuverte(){ return accesApplique.saisieOuverte; }
  // Chaque geste qui écrit des chiffres (ou ouvre un formulaire qui en écrit).
  // Restent ouverts en lecture seule : thème, rubriques, code PIN,
  // Sauvegarder, Restaurer, « Code oublié », Mon Djai et les parties de Réglages.
  var ACTIONS_ECRITURE = {
    // achat, vente (les « + » des cases, celui d'Achat/Vente), modification, suppression
    "add-achat":1, "enregistrer-achat":1, "add-vente":1, "enregistrer-vente":1,
    "modifier-enregistrement":1, "enregistrer-modif-achat":1, "enregistrer-modif-vente":1,
    "demander-suppression":1, "confirmer-suppression":1,
    // charges communes
    "add-autre-charge":1, "enregistrer-autre-charge":1,
    // caisse : fonds de départ ; stock : seuil « Me prévenir »
    "enregistrer-fonds-depart":1, "set-seuil-reassort":1,
    // objectif
    "choisir-modele-objectif":1, "continuer-objectif-modele":1, "enregistrer-objectif":1, "ouvrir-modifier-objectif":1,
    "enregistrer-modif-objectif":1, "ouvrir-supprimer-objectif":1, "confirmer-suppr-objectif":1,
    // épargne libre (D1)
    "ouvrir-mettre-de-cote":1, "enregistrer-mise-de-cote":1, "modifier-mise-de-cote":1, "enregistrer-modif-mise-de-cote":1,
    "demander-suppr-mise-de-cote":1, "confirmer-suppr-mise-de-cote":1
  };
  // LA garde : toute écriture passe ici (banc « lecture seule »).
  function gardeEcriture(action){
    if(!ACTIONS_ECRITURE[action] || saisieOuverte()) return true;
    MonDjaiCompte.ouvrirLectureSeule();
    return false;
  }

  /* ================= Helpers ================= */

  function uid(prefix){
    return prefix + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8);
  }
  function pad2(n){ return n < 10 ? "0"+n : ""+n; }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
  }
  function formatDateFr(s){
    if(!s) return "";
    var parts = s.split("-");
    if(parts.length !== 3) return s;
    return parts[2] + "/" + parts[1] + "/" + parts[0];
  }
  function formatFCFA(n){
    var num = Math.round(Number(n) || 0);
    var neg = num < 0;
    num = Math.abs(num);
    var s = String(num).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    // Sprint Revente-E : vrai signe moins (U+2212) — avec les chiffres à chasse
    // fixe, le trait d'union « - » s'élargit et se détache du nombre.
    return (neg ? "−" : "") + s + " F";
  }
  function toNum(v){
    var n = parseFloat(String(v === undefined || v === null ? "" : v).replace(",", "."));
    return isNaN(n) ? 0 : n;
  }
  function esc(s){
    return String(s === undefined || s === null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function byId(id){ return document.getElementById(id); }

  /* ================= Données par défaut ================= */

  function seedRubriquesChargesDefaut(){
    return RUBRIQUES_CHARGES_DEFAUT.map(function(r){
      return { id:r.id, nom:r.nom, emoji:r.emoji, actif:r.actif, perso:false };
    });
  }
  var RUBRIQUES_CHARGES_DEFAUT = [
    { id:"loyer", nom:"Loyer / local de stockage", emoji:"🏠", actif:true },
    { id:"transport_general", nom:"Transport / déplacement", emoji:"🚚", actif:true },
    { id:"publicite", nom:"Publicité", emoji:"📣", actif:true },
    { id:"emballage", nom:"Emballage / conditionnement", emoji:"📦", actif:false },
    { id:"communication", nom:"Crédit téléphone / communication", emoji:"📱", actif:false },
    { id:"autre", nom:"Autre", emoji:"📝", actif:true }
  ];

  function defaultState(){
    return {
      version: 1,
      config: {
        produits: [],                 // { id, nom, dernierPrixAchat, dernierPrixVenteEstime, seuilReassort }
        rubriquesCharges: seedRubriquesChargesDefaut(),
        codeAccesOk: false,
        derniereValidationAcces: null,
        moisAccesValide: null,        // { mois, annee } — dernier mois civil couvert par l'accès (essai ou code mensuel)
        pinActif: false,
        pinCode: null,
        fondsDepartCaisse: 0          // Sprint Revente-D : argent déjà en caisse au départ (facultatif)
      },
      achats: [],                     // { …, sourcePaiement:"caisse"|"autre" } (Sprint Revente-D)
      ventes: [],
      autresCharges: [],
      objectifEpargne: null,          // { id, nom, emoji, type:'auto'|'manuel', pourcentage/montant, dateCreation }
      objectifsVerrouilles: [],       // emplacements grisés en annonce (jamais affichés en détail)
      meta: { creation: todayStr(), derniereSauvegarde: null }
    };
  }

  function merge(base, extra){
    var out = {};
    for(var k in base) out[k] = base[k];
    if(extra) for(var k2 in extra) if(extra[k2] !== undefined) out[k2] = extra[k2];
    return out;
  }

  var state;

  // Fusion défensive d'un état chargé (localStorage) ou importé (JSON) avec
  // l'état par défaut. Accepte aussi, en repli, une sauvegarde faite depuis
  // MonDjai/Salon F (mêmes champs achats/ventes/config.produits de base) —
  // toute donnée propre aux autres profils (prestations coiffure/pédicure)
  // est simplement ignorée, sans faire échouer tout l'import.
  function normaliserEtatImporte(parsed){
    var base = defaultState();
    if(!parsed || typeof parsed !== "object") return base;
    var out = merge(base, parsed);
    out.config = merge(base.config, parsed.config || {});
    if(!Array.isArray(out.config.produits)) out.config.produits = [];
    if(!Array.isArray(out.config.rubriquesCharges) || !out.config.rubriquesCharges.length) out.config.rubriquesCharges = base.config.rubriquesCharges;
    if(!Array.isArray(out.achats)) out.achats = [];
    if(!Array.isArray(out.ventes)) out.ventes = [];
    if(!Array.isArray(out.autresCharges)) out.autresCharges = [];
    if(!Array.isArray(out.objectifsVerrouilles)) out.objectifsVerrouilles = [];
    if(out.objectifEpargne && typeof out.objectifEpargne !== "object") out.objectifEpargne = null;
    out.meta = merge(base.meta, parsed.meta || {});
    migrerValidationAcces(out);
    migrerAccesCalendaire(out);
    migrerCaisse(out);
    return out;
  }

  // Sprint Revente-D — migration non destructive (rien n'est supprimé ni
  // réécrit, seuls des champs manquants sont ajoutés) :
  //  - un achat sans `sourcePaiement` (enregistré avant le Sprint D) devient
  //    « payé avec la caisse », le cas de loin le plus courant ;
  //  - `config.fondsDepartCaisse` absent ou illisible → 0.
  function migrerCaisse(out){
    out.achats = out.achats.map(function(a){
      if(!a || typeof a !== "object") return a;
      if(a.sourcePaiement === "caisse" || a.sourcePaiement === "autre") return a;
      return merge(a, { sourcePaiement: "caisse" });
    });
    var f = Number(out.config.fondsDepartCaisse);
    out.config.fondsDepartCaisse = (isFinite(f) && f > 0) ? f : 0;
  }

  // Amendement Sprint Revente-B (repris tel quel de Coiffure Sprint 4C/5B) : un
  // état déjà validé (codeAccesOk vrai) mais sans horodatage de dernière
  // validation vient forcément d'un état Sprint Revente-A — on lui accorde un
  // horodatage "maintenant" plutôt que de considérer l'accès expiré dès la
  // mise à jour de l'application.
  function migrerValidationAcces(out){
    if(out.config.codeAccesOk && !out.config.derniereValidationAcces){
      out.config.derniereValidationAcces = Date.now();
    }
  }

  // Sprint Revente-B : un état déjà validé (codeAccesOk vrai) qui n'a pas
  // encore de `moisAccesValide` vient forcément du Sprint Revente-A (accès
  // initial simple, sans accès mensuel calendaire). On calcule le mois d'essai
  // qui aurait dû s'appliquer à partir de la date d'installation réelle
  // (`meta.creation`, fixée dès le tout premier lancement et jamais réécrite) ;
  // si une validation plus récente existe déjà, on ne fait jamais reculer
  // l'accès déjà acquis — on couvre au moins son mois. Une migration technique
  // ne doit jamais bloquer immédiatement une utilisatrice déjà à jour.
  function migrerAccesCalendaire(out){
    if(!out.config.codeAccesOk) return;
    if(out.config.moisAccesValide) return;
    var installation = parseDateStr(out.meta.creation) || new Date();
    var couverture = finEssaiPourInstallation(installation);
    if(out.config.derniereValidationAcces){
      var dv = new Date(out.config.derniereValidationAcces);
      var moisValidation = { mois: dv.getMonth()+1, annee: dv.getFullYear() };
      if(compareMoisAnnee(moisValidation, couverture) > 0) couverture = moisValidation;
    }
    out.config.moisAccesValide = couverture;
  }

  function loadState(){
    var raw;
    try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){ raw = null; }
    if(!raw) return defaultState();
    var parsed;
    try{ parsed = JSON.parse(raw); }catch(e){ return defaultState(); }
    return normaliserEtatImporte(parsed);
  }
  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ /* stockage indisponible : on continue quand même */ }
    // Sprint Mèches-H : copie de secours IndexedDB (jamais un état vide).
    MonDjaiCompte.noterChangementDonnees();
  }

  /* ================= Sauvegarde / restauration JSON ================= */
  // Sprint Revente-B (repris à l'identique de Coiffure Sprint 5B, F11) : quand
  // le navigateur propose l'API File System Access (Chrome/Edge/Android), on
  // laisse l'utilisatrice choisir le dossier de destination. Sinon (notamment
  // Safari/iPhone), repli automatique et silencieux sur le téléchargement dans
  // le dossier par défaut — comportement du Sprint Revente-A, inchangé. Aucun
  // appel réseau dans les deux cas.

  function exporterJson(){
    var filename = "mondjai-revente-" + todayStr() + ".json";
    var contenu = JSON.stringify(etatPourFichier(), null, 2);   // Sprint Mèches-H : avec le bloc « compte »
    if(typeof window.showSaveFilePicker === "function"){
      exporterJsonAvecChoixDossier(contenu, filename);
    } else {
      exporterJsonTelechargementDirect(contenu, filename);
    }
  }
  function marquerSauvegardeReussie(message){
    state.meta.derniereSauvegarde = todayStr();
    saveState();
    MonDjaiCompte.compter("sauvegarde.fichier");
    ui.backupMsg = message;
    render();
  }
  function exporterJsonTelechargementDirect(contenu, filename){
    try{
      var blob = new Blob([contenu], { type:"application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      marquerSauvegardeReussie("Sauvegarde téléchargée.");
    }catch(e){
      ui.backupMsg = "Impossible de générer le fichier sur cet appareil.";
      render();
    }
  }
  function exporterJsonAvecChoixDossier(contenu, filename){
    window.showSaveFilePicker({
      suggestedName: filename,
      types: [{ description: "Sauvegarde MonDjai/Mèches", accept: { "application/json": [".json"] } }]
    }).then(function(handle){
      return handle.createWritable().then(function(writable){
        return writable.write(contenu).then(function(){ return writable.close(); });
      });
    }).then(function(){
      marquerSauvegardeReussie("Sauvegarde enregistrée.");
    }).catch(function(err){
      if(err && err.name === "AbortError"){
        // L'utilisatrice a annulé la boîte de dialogue : choix délibéré, on ne
        // force pas de second téléchargement et on ne signale pas d'erreur.
        return;
      }
      // Tout autre échec (permission refusée, navigateur capricieux…) : jamais
      // laisser l'utilisatrice sans sauvegarde — repli automatique et silencieux.
      exporterJsonTelechargementDirect(contenu, filename);
    });
  }

  function importerJsonDepuisFichier(file, callback){
    if(!file){ callback(false); return; }
    var reader = new FileReader();
    reader.onload = function(){
      var parsed;
      try{ parsed = JSON.parse(reader.result); }catch(e){ callback(false); return; }
      // Sprint Mèches-H : le bloc « compte » du fichier ne rejoint jamais
      // l'état de Mèches (même chemin que la sauvegarde en ligne).
      if(!parsed || typeof parsed !== "object" || Array.isArray(parsed)){
        state = normaliserEtatImporte(parsed);
        saveState();
        controleDemande = true;
        callback(true);
        return;
      }
      callback(restaurerEtat(parsed));
    };
    reader.onerror = function(){ callback(false); };
    reader.readAsText(file);
  }

  /* ================= UI (non persisté) ================= */

  var ui = {
    tab: "aujourdhui",
    overlay: null,       // null | 'reglages' | 'apropos' | 'objectif' | 'telecharger'
    modal: null,
    draft: {},
    errors: {},
    pendingAutofocus: false,
    locked: false,
    objDraft: null,
    etatPeriode: "jour",
    etatSemaineRef: null,
    etatMoisRef: null,
    etatSelSemaine: null,
    etatSelJour: null,
    habitudesPeriode: "jour",
    habitudesSemaineRef: null,
    habitudesMoisRef: null,
    telechargerPeriode: "jour",
    telechargerSemaineRef: null,

      dernierPrixAchat: (prixAchat===undefined?null:prixAchat),

  function majBandeauAujourdhui(){

  /* ================= Sprint 9C : redessin partiel (comme Salon H 7A) ================= */
  // render() construit le même HTML qu'avant, mais ne remplace plus tout #app :
  // appliquerRendu() compare l'écran affiché et le nouvel écran, puis ne touche
  // qu'aux éléments qui changent (texte, attribut, élément ajouté ou retiré).
  // Un champ en cours de saisie garde sa valeur, le curseur et le clavier ; une
  // feuille déjà ouverte reste en place (son animation ne joue qu'à
  // l'ouverture). Filet de sécurité : en cas d'erreur, redessin complet.
  function premiereClasse(n){
    var c = n.getAttribute("class");
    if(!c) return "";
    c = c.replace(/^\s+/, "");
    var i = c.indexOf(" ");
    return i === -1 ? c : c.slice(0, i);
  }
  // Deux nœuds « de même nature » sont mis à jour sur place ; sinon l'ancien est remplacé.
  function memeNature(a, b){
    if(a.nodeType !== b.nodeType) return false;
    if(a.nodeType !== 1) return true;
    if(a.tagName !== b.tagName) return false;
    if((a.getAttribute("id") || "") !== (b.getAttribute("id") || "")) return false;
    if(a.tagName === "INPUT" && (a.getAttribute("type") || "") !== (b.getAttribute("type") || "")) return false;
    if((a.getAttribute("data-modal") || "") !== (b.getAttribute("data-modal") || "")) return false;
    return premiereClasse(a) === premiereClasse(b);
  }
  // Classes posées après le rendu (en-tête sur deux lignes, animations) et
  // variables CSS mesurées (--bandeau-h) : gardées telles quelles, pour que
  // rien ne bouge à l'écran pendant la saisie.
  var CLASSES_APRES_RENDU = { "ligne-double": 1, "anim-ecran": 1, "anim-in": 1, "anim-swap": 1 };
  function classesAvecGardees(a, b){
    var garde = [], i, l = a.classList;
    for(i = 0; i < l.length; i++) if(CLASSES_APRES_RENDU[l[i]] && !b.classList.contains(l[i])) garde.push(l[i]);
    var v = b.getAttribute("class") || "";

  }
  function styleSeulementVariables(a){
    var s = a.style, i;
    if(!s || !s.length) return false;
    for(i = 0; i < s.length; i++) if(String(s[i]).indexOf("--") !== 0) return false;
    return true;
  }
  function synchroniserAttributs(a, b){
    var i, at, v;
    for(i = a.attributes.length - 1; i >= 0; i--){
      at = a.attributes[i];
      if(b.hasAttribute(at.name)) continue;
      if(at.name === "style" && styleSeulementVariables(a)) continue;
      if(at.name === "class" && classesAvecGardees(a, b) === a.getAttribute("class")) continue;
      a.removeAttribute(at.name);
    }
    for(i = 0; i < b.attributes.length; i++){
      at = b.attributes[i];
      v = at.name === "class" ? classesAvecGardees(a, b) : at.value;

  function morphNoeud(a, b){
    if(a.nodeType !== 1){

    var valeurPrevueAvant = a.getAttribute("value");
    synchroniserAttributs(a, b);
    if(a.tagName === "INPUT"){
      var type = (a.getAttribute("type") || "text").toLowerCase();
      if(type === "checkbox" || type === "radio"){
        var coche = b.hasAttribute("checked");
        if(a.checked !== coche) a.checked = coche;
      } else if(type !== "file"){
        var v = b.getAttribute("value");
        if(v === null) v = "";
        // Champ en cours de saisie dont la valeur prévue n'a pas changé : on garde ce qui est tapé.
        if(a.value !== v && !(a === document.activeElement && (valeurPrevueAvant || "") === v)) a.value = v;
      }
      return;
    }
    if(a.tagName === "TEXTAREA"){
      if(a !== document.activeElement && a.value !== b.value) a.value = b.value;
      return;
    }
    if(a.tagName === "CANVAS") return;   // dessiné à part (Télécharger)

  // Met à jour les enfants de `parent` d'après ceux du modèle, entre deux bornes (exclues).
  // Un élément retiré (le « + » quand on quitte Aujourd'hui) ou ajouté ne fait
  // pas recréer ceux qui suivent (la barre du bas reste en place).
  function morphPlage(parent, ancien, finAncien, nouveau, finNouveau){
    while(nouveau && nouveau !== finNouveau){
      var suivantNouveau = nouveau.nextSibling;
      if(!ancien || ancien === finAncien){
        parent.insertBefore(nouveau, finAncien || null);
      } else if(memeNature(ancien, nouveau)){
        morphNoeud(ancien, nouveau);
        ancien = ancien.nextSibling;
      } else if(ancien.nextSibling && ancien.nextSibling !== finAncien && memeNature(ancien.nextSibling, nouveau)){
        var retire = ancien;
        ancien = ancien.nextSibling;
        parent.removeChild(retire);
        continue;   // le même « nouveau » est comparé à l'élément suivant
      } else if(suivantNouveau && suivantNouveau !== finNouveau && memeNature(ancien, suivantNouveau)){
        parent.insertBefore(nouveau, ancien);
      } else {
        var suivantAncien = ancien.nextSibling;
        parent.replaceChild(nouveau, ancien);
        ancien = suivantAncien;
      }
      nouveau = suivantNouveau;
    }
    while(ancien && ancien !== finAncien){

      parent.removeChild(ancien);
      ancien = s;
    }

  /* ================= Accès local d'avant le compte ================= */
  // Sprint Mèches-H : le code du mois (et son secret) est retiré : le statut
  // du serveur le remplace (bloc MONDJAI-COMPTE). Les champs codeAccesOk et
  // moisAccesValide restent lus : ils donnent l'accès local d'une installation
  // d'avant le compte, valable tant que le serveur n'a pas donné de statut.

  // Parse une date "YYYY-MM-DD" (format utilisé par todayStr/meta.creation) en
  // objet Date local — jamais via `new Date(chaine)`, qui peut être interprété
  // en UTC selon le moteur et décaler le jour d'une unité près de minuit.
  function parseDateStr(s){
    if(!s) return null;
    var parts = String(s).split("-");
    if(parts.length !== 3) return null;
    var y = parseInt(parts[0],10), m = parseInt(parts[1],10), d = parseInt(parts[2],10);
    if(!y || !m || !d) return null;
    return new Date(y, m-1, d);
  }
  function moisSuivant(mois, annee){
    mois = mois + 1;

  }
  // Compare deux { mois, annee } : négatif si a < b, positif si a > b, 0 si égal.
  function compareMoisAnnee(a, b){
    if(a.annee !== b.annee) return a.annee - b.annee;
    return a.mois - b.mois;
  }
  // Installation avant le 15 du mois → essai jusqu'à la fin de ce même mois
  // civil ; à partir du 15 → essai jusqu'à la fin du mois civil suivant
  // (garantit dans tous les cas au moins deux semaines pleines d'essai).
  function finEssaiPourInstallation(dateInstallation){
    var jour = dateInstallation.getDate();
    var mois = dateInstallation.getMonth()+1;
    var annee = dateInstallation.getFullYear();
    if(jour < 15) return { mois: mois, annee: annee };
    return moisSuivant(mois, annee);
  }

      var cur = ui.pinLockInput || "";

      render();

    }
    if(prefix === "setup"){
      if(val === "del"){ ui.pinSetupInput = (ui.pinSetupInput||"").slice(0,-1); render(); return; }
      var cur2 = ui.pinSetupInput || "";
      if(cur2.length >= 4) return;

  /* ================= Calculs de dates/périodes ================= */

  function sortByDateDesc(arr){
    return arr.slice().sort(function(a,b){
      if(a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.ts||0) - (a.ts||0);
    });
  }
  function dateFromStr(s){
    var p = s.split("-");
    return new Date(+p[0], +p[1]-1, +p[2]);
  }
  function dateKey(d){ return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()); }
  // Sprint Revente-C — correctif : ces deux définitions avaient été omises au
  // fork depuis Coiffure (ReferenceError sur tous les onglets « Mois »).
  var MOIS_NOMS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  function moisLabelFor(d){ return MOIS_NOMS[d.getMonth()] + " " + d.getFullYear(); }
  function moisLabelMaj(d){ var s = moisLabelFor(d); return s.charAt(0).toUpperCase() + s.slice(1); }

  function getDayRange(d){ var k = dateKey(d); return { start:k, end:k }; }
  function getWeekRange(d){
    var day = d.getDay();
    var diffLundi = (day === 0) ? -6 : (1 - day);
    var lundi = new Date(d); lundi.setDate(d.getDate() + diffLundi);
    var dimanche = new Date(lundi); dimanche.setDate(lundi.getDate() + 6);
    return { start: dateKey(lundi), end: dateKey(dimanche) };
  }
  function getMonthRange(d){
    var premier = new Date(d.getFullYear(), d.getMonth(), 1);
    var dernier = new Date(d.getFullYear(), d.getMonth()+1, 0);
    return { start: dateKey(premier), end: dateKey(dernier) };
  }
  function rangeForPeriode(periode, ref){
    if(periode === "semaine") return getWeekRange(ref);
    if(periode === "mois") return getMonthRange(ref);
    return getDayRange(ref);
  }
  function inRange(dateStr, range){ return !!dateStr && dateStr >= range.start && dateStr <= range.end; }
  function filterRange(arr, range){ return arr.filter(function(x){ return inRange(x.date, range); }); }
  function sumBy(arr, fn){ return arr.reduce(function(s,x){ return s + (Number(fn(x)) || 0); }, 0); }

  function allActivityDates(){
    var set = {};
    state.achats.forEach(function(a){ if(a.date) set[a.date] = 1; });
    state.ventes.forEach(function(v){ if(v.date) set[v.date] = 1; });
    state.autresCharges.forEach(function(c){ if(c.date) set[c.date] = 1; });
    return Object.keys(set).sort();
  }
  function earliestActivityWeekStart(){
    var dates = allActivityDates();
    if(!dates.length) return getWeekRange(new Date()).start;
    return getWeekRange(dateFromStr(dates[0])).start;
  }
  function earliestActivityMonthStart(){
    var dates = allActivityDates();
    if(!dates.length) return getMonthRange(new Date()).start;
    return getMonthRange(dateFromStr(dates[0])).start;
  }

  // ----- Navigation précédent / suivant, commune à tous les écrans à période -----
  // Sprint Revente-C : les références (ex. ui.etatMoisRef) peuvent être n'importe
  // quel jour de la période (au départ : aujourd'hui). Les bornes sont donc
  // toujours comparées sur le DÉBUT de la période — sinon le bouton « précédent »
  // restait actif sur la toute première période avec données et ne menait nulle
  // part. Bornes : la période de la toute première donnée enregistrée, et la
  // période en cours (jamais de navigation dans le futur).
  function debutPeriode(periode, refStr){
    var d = dateFromStr(refStr);
    return periode === "semaine" ? getWeekRange(d).start : getMonthRange(d).start;
  }
  function bornesPeriode(periode, refStr){
    var debut = debutPeriode(periode, refStr);
    var actuelle = periode === "semaine" ? getWeekRange(new Date()).start : getMonthRange(new Date()).start;
    var premiere = periode === "semaine" ? earliestActivityWeekStart() : earliestActivityMonthStart();
    return { estPremiere: debut <= premiere, estActuelle: debut >= actuelle };
  }
  function decalerPeriode(periode, refStr, delta){
    var d = dateFromStr(debutPeriode(periode, refStr));
    if(periode === "semaine") d.setDate(d.getDate() + 7*delta);
    else d.setMonth(d.getMonth() + delta);
    var nouveau = dateKey(d);
    var actuelle = periode === "semaine" ? getWeekRange(new Date()).start : getMonthRange(new Date()).start;
    var premiere = periode === "semaine" ? earliestActivityWeekStart() : earliestActivityMonthStart();
    if(nouveau > actuelle) nouveau = actuelle;
    if(nouveau < premiere) nouveau = premiere;
    return nouveau;
  }
  function libellePeriode(periode, refStr){
    if(periode === "semaine"){
      var r = getWeekRange(dateFromStr(refStr));
      return formatDateFr(r.start) + " – " + formatDateFr(r.end);
    }
    if(periode === "mois") return moisLabelMaj(dateFromStr(refStr));
    return formatDateFr(refStr);
  }
  // Barre ‹ libellé › — `action` reçoit data-sens (-1/1) et data-periode.
  function renderNavPeriode(action, periode, refStr){
    var b = bornesPeriode(periode, refStr);
    return (
      '<div class="etat-nav">' +
        '<button type="button" class="en-btn" data-action="' + action + '" data-sens="-1" data-periode="' + periode + '"' + (b.estPremiere?" disabled":"") + ' aria-label="Période précédente">‹</button>' +
        '<div class="en-label">' + esc(libellePeriode(periode, refStr)) + '</div>' +
        '<button type="button" class="en-btn" data-action="' + action + '" data-sens="1" data-periode="' + periode + '"' + (b.estActuelle?" disabled":"") + ' aria-label="Période suivante">›</button>' +
      '</div>'
    );
  }
  function formatQte(n){
    var r = Math.round((Number(n)||0) * 100) / 100;
    return String(r).replace(".", ",");
  }
  // Un jour est "actif" (pour le mode Manuel de l'épargne) dès qu'un achat ou
  // une vente y a été enregistré.
  function joursActifsDansPeriode(range){
    var set = {};
    state.achats.forEach(function(a){ if(inRange(a.date, range)) set[a.date] = 1; });
    state.ventes.forEach(function(v){ if(inRange(v.date, range)) set[v.date] = 1; });
    return Object.keys(set).length;
  }

  function chargesCommunesTotal(range){
    return sumBy(filterRange(state.autresCharges, range), function(c){ return c.montant; });
  }

  /* ================= F4 : Suivi de stock (repris de Salon F) ================= */

  var SEUIL_REASSORT_DEFAUT = 3;

  /* ---------- Sprint Revente-D : montant comptabilisé d'une vente ---------- */
  // FONCTION UNIQUE, utilisée partout où des ventes sont additionnées (et dans
  // les listes, pour que chaque liste corresponde au total affiché au-dessus) :
  //  - vente « depuis le stock » → le montant encaissé ;
  //  - commande spéciale → montant encaissé − prix payé au revendeur : seule la
  //    marge entre dans la comptabilité. Le prix payé au revendeur est de
  //    l'argent « en transit » : il vient de la cliente et repart aussitôt chez
  //    le revendeur (ex. encaissé 10 000, revendeur 7 000 → 3 000 comptabilisés).
  // Les données enregistrées (montantEncaisse, prixPayeRevendeur) ne changent
  // pas : seul le calcul change.
  function estCommandeSpeciale(v){ return v.typeVente === "commande_speciale"; }
  function montantComptabiliseVente(v){
    var encaisse = Number(v.montantEncaisse) || 0;
    if(estCommandeSpeciale(v)) return encaisse - (Number(v.prixPayeRevendeur) || 0);
    return encaisse;
  }
  // Bénéfice réalisé d'une vente = montant comptabilisé − coût des paquets
  // sortis du stock (quantité × coût moyen d'achat). Une commande spéciale ne
  // sort rien du stock : son bénéfice est sa marge, déjà comptabilisée.
  function beneficeVente(v, coutMoyen){
    if(estCommandeSpeciale(v)) return montantComptabiliseVente(v);
    return montantComptabiliseVente(v) - (Number(v.quantite) || 0) * (coutMoyen || 0);
  }

  function computeStockProduit(p){
    var achatsP = state.achats.filter(function(a){ return a.produitId === p.id; });
    var ventesP = state.ventes.filter(function(v){ return v.produitId === p.id; });
    var ventesStock = ventesP.filter(function(v){ return v.typeVente !== "commande_speciale"; });
    var ventesCommande = ventesP.filter(function(v){ return v.typeVente === "commande_speciale"; });

    var totalAchatQte = sumBy(achatsP, function(a){ return a.quantite; });
    var totalAchatValeur = sumBy(achatsP, function(a){ return a.quantite * a.prixAchatUnitaire; });
    var coutMoyen = totalAchatQte > 0 ? totalAchatValeur / totalAchatQte : 0;

    var qteVendueStock = sumBy(ventesStock, function(v){ return v.quantite; });
    var stockRestant = Math.max(0, totalAchatQte - qteVendueStock);

    var prixVenteRef = (p.dernierPrixVenteEstime === null || p.dernierPrixVenteEstime === undefined) ? 0 : p.dernierPrixVenteEstime;

    // Sprint Revente-D : via la fonction de comptabilisation (une commande
    // spéciale ne compte que pour sa marge).
    var caStock = sumBy(ventesStock, montantComptabiliseVente);
    var beneficeStock = caStock - qteVendueStock * coutMoyen;
    var caCommande = sumBy(ventesCommande, montantComptabiliseVente);
    var beneficeCommande = sumBy(ventesCommande, function(v){ return beneficeVente(v, coutMoyen); });

    var beneficeAttendu = sumBy(achatsP, function(a){ return a.quantite * ((a.prixVenteUnitaireEstime||0) - (a.prixAchatUnitaire||0)); });

    var seuil = (p.seuilReassort===undefined || p.seuilReassort===null) ? SEUIL_REASSORT_DEFAUT : p.seuilReassort;

    return {
      produit: p, totalAchatQte: totalAchatQte, coutMoyen: coutMoyen, stockRestant: stockRestant,
      valeurStockCout: stockRestant * coutMoyen, valeurStockVente: stockRestant * prixVenteRef,
      caTotal: caStock + caCommande, beneficeRealise: beneficeStock + beneficeCommande,
      beneficeAttendu: beneficeAttendu, seuil: seuil, alerte: stockRestant <= seuil
    };
  }

  function renderStockSection(titre){
    var produits = state.config.produits.slice().sort(function(a,b){ return a.nom.localeCompare(b.nom); });
    if(!produits.length) return "";
    var cards = produits.map(function(p){

      return (

            '<div class="sk">Coût moyen</div><div class="sv">' + formatFCFA(s.coutMoyen) + '</div>' +
            '<div class="sk">Valeur (coût)</div><div class="sv">' + formatFCFA(s.valeurStockCout) + '</div>' +
            '<div class="sk">Valeur (vente est.)</div><div class="sv">' + formatFCFA(s.valeurStockVente) + '</div>' +
            '<div class="sk">Bénéfice réalisé</div><div class="sv">' + formatFCFA(s.beneficeRealise) + '</div>' +
            '<div class="sk">Bénéfice attendu</div><div class="sv">' + formatFCFA(s.beneficeAttendu) + '</div>' +
          '</div>' +
          // Sprint Revente-E : vocabulaire simple (le champ reste seuilReassort).
          '<label class="sc-seuil">' +
            '<span class="sc-seuil-txt">🔔 Me prévenir quand il reste</span>' +
            '<span class="sc-seuil-val"><input type="number" inputmode="numeric" min="0" step="1" value="' + s.seuil + '" data-action-change="set-seuil-reassort" data-id="' + p.id + '" aria-label="Me prévenir quand il reste ce nombre de paquets">paquet(s)</span>' +

  // Bénéfice réalisé (marge réelle) — même méthode que le Suivi de stock F4,
  // via la fonction de comptabilisation (Sprint Revente-D). Le coût moyen de
  // chaque produit n'est calculé qu'une fois par appel (mêmes chiffres, mais
  // la caisse additionne tout l'historique à chaque affichage d'Aujourd'hui).
  function beneficeReventePeriode(range){
    var coutsMoyens = {};
    return sumBy(filterRange(state.ventes, range), function(v){
      if(estCommandeSpeciale(v)) return beneficeVente(v, 0);
      var cle = "p:" + v.produitId;
      if(!(cle in coutsMoyens)){
        var p = findProduitById(v.produitId);
        coutsMoyens[cle] = p ? computeStockProduit(p).coutMoyen : 0;
      }
      return beneficeVente(v, coutsMoyens[cle]);
    });
  }
  function beneficeReventeTotal(){
    return sumBy(state.config.produits, function(p){ return computeStockProduit(p).beneficeRealise; });
  }

  function emptyState(emoji, titre, desc){
    return '<div class="empty-state"><div class="es-emoji">' + emoji + '</div>' +
      '<div class="es-title">' + esc(titre) + '</div>' +
      '<div class="es-desc">' + esc(desc) + '</div></div>';
  }

  /* ================= Objectif d'épargne — base : Bénéfice réalisé ================= */
  // Cahier des charges v1, section 6 (point tranché) : l'épargne automatique
  // est un pourcentage du Bénéfice réalisé (la vraie marge), jamais des
  // Ventes encaissées (chiffre d'affaires brut, qui inclut le coût des
  // mèches déjà payées à l'achat) — pour ne jamais proposer une épargne non
  // soutenable une fois le stock racheté.
  function epargnePeriode(range){
    if(!state.objectifEpargne) return 0;
    var o = state.objectifEpargne;
    // Sprint Mèches-G : objectif en Libre, ou qui a changé de façon (dates
    // gardées). Un objectif d'avant passe par le calcul ci-dessous, inchangé.
    if(o.type === "libre" || o.faconDepuis || Array.isArray(o.faconsPrecedentes)) return epargneParFacons(o, range);
    if(o.type === "manuel"){
      return joursActifsDansPeriode(range) * (o.montant || 0);
    }
    return beneficeReventePeriode(range) * (o.pourcentage || 0) / 100;
  }
  function epargneJour(dateStr){ return epargnePeriode({ start:dateStr, end:dateStr }); }

  /* ----- Sprint Mèches-G : épargne libre (cahier v2.5 §5.16, comme Coiffure 9B2) ----- */
  // Mises de côté notées (« Mettre de côté ») : state.misesDeCote[] =
  // { id, date, montant, ts, modifieLe?, versionsPrecedentes? }, créé au
  // premier geste seulement. L'épargne Libre d'une période = la somme des
  // mises de côté datées dans cette période.
  function misesDeCote(){
    var l = state.misesDeCote;
    return Array.isArray(l) ? l.filter(function(m){ return m && m.date && Number(m.montant) > 0; }) : [];
  }
  function misesDeCotePeriode(range){
    return sumBy(misesDeCote().filter(function(m){ return inRange(m.date, range); }), function(m){ return m.montant; });
  }
  // Façons d'épargner de l'objectif, de la plus ancienne à la façon actuelle :
  // chacune vaut de sa date de début (incluse) jusqu'au début de la suivante
  // (exclu). La première n'a pas de début (« depuis toujours »).
  function faconsObjectif(o){
    var l = Array.isArray(o.faconsPrecedentes) ? o.faconsPrecedentes.slice() : [];
    l.push({ type: o.type, pourcentage: o.pourcentage, montant: o.montant, depuis: o.faconDepuis || null });
    return l;
  }
  // Même calcul qu'avant pour une façon Pourcentage ou Montant fixe.
  function epargneFaconPeriode(f, range){
    if(f.type === "libre") return misesDeCotePeriode(range);
    if(f.type === "manuel") return joursActifsDansPeriode(range) * (f.montant || 0);
    return beneficeReventePeriode(range) * (f.pourcentage || 0) / 100;
  }
  function veilleDe(dateStr){ var d = dateFromStr(dateStr); d.setDate(d.getDate() - 1); return dateKey(d); }
  function epargneParFacons(o, range){
    var l = faconsObjectif(o), total = 0;
    for(var i = 0; i < l.length; i++){
      var debut = l[i].depuis, suivant = i + 1 < l.length ? l[i + 1].depuis : null;
      var fin = suivant ? veilleDe(suivant) : null;
      var s = { start: (debut && debut > range.start) ? debut : range.start, end: (fin && fin < range.end) ? fin : range.end };
      if(s.start <= s.end) total += epargneFaconPeriode(l[i], s);
    }
    return total;
  }
  function epargneEnLibre(){ return !!state.objectifEpargne && state.objectifEpargne.type === "libre"; }
  // Case Épargne d'Aujourd'hui et raccourci de l'en-tête : « Mettre de côté »
  // en Libre, sinon l'écran Objectif.
  function actionEpargne(){ return epargneEnLibre() && saisieOuverte() ? "ouvrir-mettre-de-cote" : "ouvrir-objectif"; }
  // Première date possible pour une mise de côté : le début de la façon Libre
  // en cours. Avant, l'épargne est calculée comme avant.
  function debutMiseDeCote(){
    return epargneEnLibre() ? (state.objectifEpargne.faconDepuis || null) : null;
  }
  // Début de la liste « Mis de côté » de l'objectif actuel (son premier passage en Libre).
  function debutListeMisesDeCote(){
    var o = state.objectifEpargne;
    if(!o) return null;
    var debuts = [];
    faconsObjectif(o).forEach(function(f){ if(f.type === "libre") debuts.push(f.depuis || o.dateCreation || ""); });
    debuts.sort();
    var d = debuts.length ? debuts[0] : (o.dateCreation || "");
    return d && o.dateCreation && d < o.dateCreation ? o.dateCreation : d;
  }
  function misesDeCoteListees(){
    var debut = debutListeMisesDeCote();
    return misesDeCote().filter(function(m){ return !debut || m.date >= debut; }).sort(function(a, b){
      if(a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.ts || 0) - (a.ts || 0);
    });
  }
  function dernierMontantMisDeCote(){
    var l = misesDeCote().slice().sort(function(a, b){ return (b.ts || 0) - (a.ts || 0); });
    return l.length ? Math.round(Number(l[0].montant)) : 0;
  }
  function miseDeCoteParId(id){
    var l = Array.isArray(state.misesDeCote) ? state.misesDeCote : [];
    for(var i = 0; i < l.length; i++) if(l[i] && l[i].id === id) return l[i];
    return null;
  }
  // Trace d'une mise de côté supprimée.
  function archiverSuppression(quoi, rec){
    if(!rec) return;
    if(!Array.isArray(state.supprimes)) state.supprimes = [];
    state.supprimes.push({ quoi: quoi, le: Date.now(), enregistrement: JSON.parse(JSON.stringify(rec)) });
  }

  // 4 modèles d'objectif d'épargne propres à Revente (cahier, section 7,
  // point confirmé par Hamadou sans ajustement).
  var OBJECTIF_MODELES = [
    { id:"stock", emoji:"📦", nom:"Agrandir le stock", desc:"Racheter plus de produits, diversifier les références" },
    { id:"transport", emoji:"🚚", nom:"Transport & livraison", desc:"Moto, frais de livraison aux clientes, déplacement fournisseur" },
    { id:"famille", emoji:"👨‍👩‍👧", nom:"Famille", desc:"Mariage, scolarité, santé" },
    { id:"libre", emoji:"💰", nom:"Épargne libre", desc:"Juste mettre de côté, sans montant précis" }
  ];
  function findObjectifModele(id){
    for(var i=0;i<OBJECTIF_MODELES.length;i++) if(OBJECTIF_MODELES[i].id === id) return OBJECTIF_MODELES[i];
    return null;
  }
  function epargneEmoji(){
    return (state.objectifEpargne && state.objectifEpargne.emoji) || "💰";
  }

  // Solde net (Mon état / Télécharger) = Bénéfice réalisé − Épargne − Charges
  // communes, même principe que Coiffure (Main d’œuvre − Épargne − Charges).
  function soldeNetPeriode(range){
    return beneficeReventePeriode(range) - epargnePeriode(range) - chargesCommunesTotal(range);
  }
  function soldeNetJour(dateStr){ return soldeNetPeriode({ start:dateStr, end:dateStr }); }

  /* ================= Sprint Revente-D : caisse physique ================= */
  // Deux grandeurs distinctes :
  //  - « Ventes du mois » : un chiffre d'activité (somme des montants
  //    comptabilisés), jamais diminué par les achats ;
  //  - « Caisse à date » : l'argent physique =
  //      fonds de départ + Σ ventes comptabilisées − Σ sorties de caisse,
  //    tout cumulé DEPUIS LE DÉBUT jusqu'à aujourd'hui, en un seul calcul. Le
  //    report d'un mois à l'autre est donc automatique ; on ne calcule jamais
  //    « solde antérieur + solde du mois » à part (risque de double comptage).
  // Sorties de caisse (période) = achats payés avec la caisse (quantité × prix
  // d'achat unitaire + charges de l'achat) + charges communes + épargne mise de
  // côté. L'épargne est celle de l'objectif (sur le bénéfice réalisé, comme
  // partout), comptée à partir de la date de création de l'objectif : avant,
  // rien n'a été mis de côté, l'argent est resté dans la caisse (même borne
  // que « Mis de côté depuis le … » sur la carte de l'objectif).

  var DEBUT_HISTORIQUE = "0000-01-01";

  function achatPayeParCaisse(a){ return a.sourcePaiement !== "autre"; }
  function ventesComptabiliseesPeriode(range){
    return sumBy(filterRange(state.ventes, range), montantComptabiliseVente);
  }
  function achatsPeriodeTotal(range){
    return sumBy(filterRange(state.achats, range), coutAchat);
  }
  function achatsCaissePeriode(range){
    return sumBy(filterRange(state.achats, range).filter(achatPayeParCaisse), coutAchat);
  }
  function epargneMiseDeCotePeriode(range){
    var o = state.objectifEpargne;
    if(!o) return 0;
    var debut = (o.dateCreation && o.dateCreation > range.start) ? o.dateCreation : range.start;
    if(debut > range.end) return 0;
    return epargnePeriode({ start: debut, end: range.end });
  }
  function sortiesCaissePeriode(range){
    var achats = achatsCaissePeriode(range);
    var charges = chargesCommunesTotal(range);
    var epargne = epargneMiseDeCotePeriode(range);
    return { achatsCaisse: achats, charges: charges, epargne: epargne, total: achats + charges + epargne };
  }
  function fondsDepartCaisse(){
    var f = Number(state.config.fondsDepartCaisse);
    return (isFinite(f) && f > 0) ? f : 0;
  }
  // Caisse à date : un seul calcul, du tout début jusqu'à aujourd'hui.
  function caisseADate(){
    var depuisLeDebut = { start: DEBUT_HISTORIQUE, end: todayStr() };
    return fondsDepartCaisse() + ventesComptabiliseesPeriode(depuisLeDebut) - sortiesCaissePeriode(depuisLeDebut).total;
  }

  // Synthèse du mois civil en cours (zone « Ce mois-ci » et détail de la
  // caisse), en francs entiers. Les sorties affichées sont la somme de leurs
  // trois parts affichées, et le report des mois précédents est la différence
  // entre la caisse à date (calculée d'un seul tenant, ci-dessus) et les
  // chiffres du mois : le détail tombe donc toujours juste au franc près.
  function syntheseCaisseMois(){
    var aujourdHui = new Date();
    var today = todayStr();
    var moisRange = getMonthRange(aujourdHui);
    var moisADate = { start: moisRange.start, end: today };
    var sorties = sortiesCaissePeriode(moisADate);
    var r = Math.round;
    var achatsCaisse = r(sorties.achatsCaisse), charges = r(sorties.charges), epargne = r(sorties.epargne);
    var sortiesMois = achatsCaisse + charges + epargne;
    var ventesMois = r(ventesComptabiliseesPeriode(moisADate));
    var achatsMois = r(achatsPeriodeTotal(moisADate));
    var fonds = r(fondsDepartCaisse());
    var caisse = r(caisseADate());
    var commandesMois = filterRange(state.ventes, moisADate).filter(estCommandeSpeciale);
    return {
      moisLabel: moisLabelMaj(aujourdHui),
      achatsMois: achatsMois,
      achatsAutreSourceMois: achatsMois - r(achatsCaissePeriode(moisADate)),
      ventesMois: ventesMois,
      sortiesMois: sortiesMois,
      sortiesAchatsCaisse: achatsCaisse,
      sortiesCharges: charges,
      sortiesEpargne: epargne,
      chargesMois: charges,
      fonds: fonds,
      report: caisse - fonds - ventesMois + sortiesMois,
      caisse: caisse,
      nbCommandesSpecialesMois: commandesMois.length,
      transitCommandesMois: r(sumBy(commandesMois, function(v){ return Number(v.prixPayeRevendeur) || 0; }))
    };
  }

  /* ================= Écran « Aujourd’hui » ================= */
  // Cahier des charges v1, section 5.1 (point tranché, option B) : blocs
  // cliquables Achats/Ventes/Épargne, chaque bloc ouvre le détail du jour
  // correspondant ; le bloc Bénéfice reste informatif (non cliquable).

  // Sprint Revente-D : deux zones « Aujourd'hui » / « Ce mois-ci ».
  // Sprint Revente-E : la zone « Ce mois-ci » n'est plus affichée en
  // permanence. À sa place, en bas, un bouton bien visible (accent ambre, plus
  // haut que la carte Charges communes) l'ouvre dans une feuille du bas, avec
  // exactement le même contenu. Les 4 blocs du jour reprennent la hauteur
  // libérée : le bas du bouton touche la barre du bas, sans défilement.
  // Sprint Mèches-G : le bouton du bas devient « 🧺 Mon Djai · total ».
  function renderAujourdhui(){
    return renderZoneJour() + renderBoutonMonDjai();
  }

  function renderZoneJour(){
    var today = todayStr();
    var range = { start: today, end: today };
    var achatsJour = sumBy(filterRange(state.achats, range), coutAchat);
    var ventesJour = ventesComptabiliseesPeriode(range);
    var beneficeTotal = beneficeReventeTotal();
    var epargne = state.objectifEpargne ? epargneJour(today) : 0;

    // Sprint Mèches-G : un « + » dans la case Achats du jour (nouvel achat) et
    // dans la case Ventes du jour (nouvelle vente). La case reste un bouton
    // (liste du jour) ; le « + » est un bouton à part, posé dans son coin.
    var blocks =
      '<div class="case-plus-wrap">' +
        '<button type="button" class="dash-block" data-action="voir-jour-achats" data-test="case-achats-jour">' +
          '<div class="db-emoji db-ico t-ambre">📦</div><div class="db-amount" data-test="achats-jour">' + formatFCFA(achatsJour) + '</div><div class="db-label">Achats du jour</div>' +
        '</button>' +
        '<button type="button" class="case-plus" data-action="add-achat" aria-label="Nouvel achat" data-test="plus-achats-jour">+</button>' +
      '</div>' +
      '<div class="case-plus-wrap">' +
        '<button type="button" class="dash-block" data-action="voir-jour-ventes" data-test="case-ventes-jour">' +
          '<div class="db-emoji db-ico t-vert">🛍️</div><div class="db-amount pos" data-test="ventes-jour">' + formatFCFA(ventesJour) + '</div><div class="db-label">Ventes du jour</div>' +
        '</button>' +
        '<button type="button" class="case-plus" data-action="add-vente" aria-label="Nouvelle vente" data-test="plus-ventes-jour">+</button>' +
      '</div>' +
      '<div class="dash-block info">' +
        '<div class="db-emoji db-ico t-turq">💹</div><div class="db-amount" data-test="benefice-date">' + formatFCFA(beneficeTotal) + '</div><div class="db-label">Bénéfice (à date)</div>' +
      '</div>' +
      '<button type="button" class="dash-block" data-action="' + actionEpargne() + '" data-test="case-epargne">' +
        '<div class="db-emoji db-ico t-bleu">' + esc(epargneEmoji()) + '</div><div class="db-amount" data-test="epargne-jour">' + (state.objectifEpargne ? formatFCFA(epargne) : "Aucun") + '</div><div class="db-label">Épargne</div>' +
      '</button>';

    return (
      '<div class="section-title zone-titre">Aujourd’hui · ' + formatDateFr(today) + '</div>' +
      '<div class="dash-grid">' + blocks + '</div>' +
      '<div class="charges-card-wrap">' + renderChargesCommunesCard() + '</div>'
    );
  }

  // Sprint Mèches-G : « Mon Djai » = Caisse + Stock + Épargne, aujourd'hui.
  // Aucun calcul réécrit : la caisse à date (caisseADate), la valeur du stock
  // restant au prix d'achat (computeStockProduit : stock restant × coût
  // moyen, produit par produit) et l'épargne mise de côté déduite de la caisse
  // (sortiesCaissePeriode, depuis le début). Chaque part est arrondie au franc
  // comme à l'écran : le total affiché est toujours leur somme exacte.
  function monDjai(){
    var r = Math.round;
    var depuisLeDebut = { start: DEBUT_HISTORIQUE, end: todayStr() };
    var caisse = r(caisseADate());
    var stock = r(sumBy(state.config.produits, function(p){ return computeStockProduit(p).valeurStockCout; }));
    var epargne = r(sortiesCaissePeriode(depuisLeDebut).epargne);
    return { caisse: caisse, stock: stock, epargne: epargne, total: caisse + stock + epargne };
  }

  // Le total de « Mon Djai » tient toujours en entier (jusqu'à 320 px) : s'il
  // déborde, sa police est réduite juste ce qu'il faut (13 px au plus petit).
  function ajusterBoutonMonDjai(){
    var b = document.querySelector(".main.ecran-aujourdhui .mondjai-btn");
    if(!b) return;
    var t = b.querySelector(".md-total");
    if(!t) return;
    t.style.fontSize = "";
    var garde = 0;
    while(b.scrollWidth > b.clientWidth + 1 && garde < 40){
      var taille = parseFloat(getComputedStyle(t).fontSize);
      if(!(taille > 13)) break;
      t.style.fontSize = Math.max(13, Math.round((taille - 0.5) * 10) / 10) + "px";
      garde++;
    }
  }

  // Bouton « 🧺 Mon Djai · total », sur toute la largeur. Pastille rouge si la
  // caisse est négative (même arrondi qu'à l'écran) ; le message doux reste
  // dans le détail de la caisse.
  function renderBoutonMonDjai(){
    var m = monDjai();
    return (
      '<button type="button" class="mois-btn mondjai-btn" data-action="voir-mon-djai" data-test="bouton-mon-djai">' +
        '<span class="cm-ico">🧺' +
          (m.caisse < 0 ? '<span class="cm-pastille" data-test="pastille-caisse-negative" aria-label="Caisse négative"></span>' : '') +
        '</span>' +
        '<span class="cm-main">' +
          '<span class="cm-titre">Mon Djai</span>' +
          '<span class="cm-sous">Caisse · stock · épargne</span>' +
        '</span>' +
        '<span class="md-total' + (m.total < 0 ? " neg" : "") + '" data-test="total-mon-djai">' + formatFCFA(m.total) + '</span>' +
        '<span class="md-chev" aria-hidden="true">›</span>' +
      '</button>'
    );
  }

  // Feuille « Mon Djai » : le total, puis Caisse · Stock · Épargne (chaque
  // case ouvre son écran), et une seule ligne « Stock au prix d'achat ».
  function renderMonDjai(){
    var m = monDjai();
    var caisseNeg = m.caisse < 0;
    var cas = function(action, test, ico, teinte, label, valeur, neg){
      return '<button type="button" class="md-case' + (neg ? " md-neg" : "") + '" data-action="' + action + '" data-test="' + test + '">' +
        '<span class="mc-ico ' + teinte + '" aria-hidden="true">' + ico + '</span>' +
        '<span class="mc-label">' + label + '</span>' +
        '<span class="mc-val' + (neg ? " neg" : "") + '" data-test="' + test + '-montant">' + formatFCFA(valeur) + '</span>' +
        '<span class="mc-chev" aria-hidden="true">›</span>' +
      '</button>';
    };
    return (
      '<div class="md-entete">' +
        '<div class="md-label">Aujourd’hui</div>' +
        '<div class="md-grand' + (m.total < 0 ? " neg" : "") + '" data-test="mon-djai-total">' + formatFCFA(m.total) + '</div>' +
      '</div>' +
      '<div class="md-cases">' +
        cas("voir-detail-caisse", "md-caisse", "💵", caisseNeg ? "t-rouge" : "t-ambre", "Caisse", m.caisse, caisseNeg) +
        cas("mon-djai-stock", "md-stock", "📦", "t-turq", "Stock", m.stock, false) +
        cas("mon-djai-epargne", "md-epargne", "💰", "t-bleu", "Épargne", m.epargne, false) +
      '</div>' +
      '<div class="md-ligne" data-test="md-ligne">Stock au prix d’achat</div>'
    );
  }

  var MESSAGE_CAISSE_NEGATIVE = "Votre caisse est négative : un achat a peut-être été payé avec une autre source.";

  // Détail de la caisse (au toucher du bloc « Caisse à date » ou des sorties).
  function renderDetailCaisse(){
    var s = syntheseCaisseMois();
    var negative = s.caisse < 0;
    var signe = function(n){ return n === 0 ? formatFCFA(0) : (n < 0 ? "− " : "+ ") + formatFCFA(Math.abs(n)); };
    var ligne = function(label, valeur, classe, test){
      return '<div class="cd-row' + (classe ? " " + classe : "") + '"><div class="cd-k">' + label + '</div>' +
        '<div class="cd-v"' + (test ? ' data-test="' + test + '"' : '') + '>' + valeur + '</div></div>';
    };
    var html =
      '<div class="caisse-detail">' +
        ligne("Fonds de départ", formatFCFA(s.fonds), "", "cd-fonds") +
        ligne("Report des mois précédents", signe(s.report), "", "cd-report") +
        ligne("Ventes du mois", signe(s.ventesMois), "cd-pos", "cd-ventes") +
        ligne("Sorties de caisse du mois", "− " + formatFCFA(s.sortiesMois), "cd-neg", "cd-sorties") +
        ligne("Achats payés avec la caisse", formatFCFA(s.sortiesAchatsCaisse), "cd-sub", "cd-sorties-achats") +
        ligne("Charges communes", formatFCFA(s.sortiesCharges), "cd-sub", "cd-sorties-charges") +
        ligne("Épargne mise de côté", formatFCFA(s.sortiesEpargne), "cd-sub", "cd-sorties-epargne") +
        ligne("Caisse à date", formatFCFA(s.caisse), "cd-total" + (negative ? " cd-total-neg" : ""), "cd-caisse") +
      '</div>';
    var notes = "";
    if(negative) notes += '<div class="dash-perte" style="margin-top:12px;">' + esc(MESSAGE_CAISSE_NEGATIVE) + '</div>';
    if(s.achatsAutreSourceMois > 0){
      notes += '<div class="hint" style="margin-top:12px;" data-test="cd-autre-source">Achats payés avec une autre source ce mois-ci : <b style="color:var(--text);">' + formatFCFA(s.achatsAutreSourceMois) + '</b> — comptés dans les achats du mois, pas dans la caisse.</div>';
    }
    if(s.nbCommandesSpecialesMois > 0){
      notes += '<div class="hint" style="margin-top:10px;">Commandes spéciales : seule la marge est comptée. Les ' + formatFCFA(s.transitCommandesMois) + ' payés au revendeur ce mois-ci sont de l’argent en transit (de la cliente au revendeur).</div>';
    }
    notes += '<div class="hint" style="margin-top:10px;">La caisse se reporte toute seule d’un mois à l’autre. ' +
      (epargneEnLibre() ? 'Épargne : ce que vous avez mis de côté.' : 'Épargne comptée depuis la création de votre objectif.') + '</div>';
    notes += '<button type="button" class="btn btn-secondary" style="margin-top:14px;" data-action="modifier-fonds-depuis-caisse">Fonds de départ : ' + (s.fonds > 0 ? 'modifier' : 'indiquer') + ' dans Réglages</button>';
    return html + notes;
  }

  function renderChargesCommunesCard(){
    var today = todayStr();
    var total = chargesCommunesTotal({ start: today, end: today });
    if(!state.autresCharges.length){
      return (
        '<div class="caisse-zone">' +
          '<button type="button" class="charges-row charges-row-vide" data-action="voir-charges-jour">' +
            '<span class="cr-emoji t-rouge">🧾</span><span class="cr-label">Charges communes</span><span class="cr-chev" aria-hidden="true">›</span>' +
          '</button>' +
        '</div>'
      );
    }
    return (
      '<div class="caisse-zone">' +
        '<button type="button" class="charges-row" data-action="voir-charges-jour">' +
          '<span class="cr-emoji t-rouge">💸</span><span class="cr-label">Charges communes</span><span class="cr-amount" data-test="charges-jour">' + formatFCFA(total) + '</span>' +
        '</button>' +
      '</div>'
    );
  }

  /* ================= Blocs « Achats du jour » / « Ventes du jour » (Aujourd’hui) ================= */

  function renderJourAchatsModal(){
    var today = todayStr();
    var items = sortByDateDesc(state.achats.filter(function(a){ return a.date === today; }));
    if(!items.length){
      return emptyState("📦", "Aucun achat aujourd’hui", "Les achats enregistrés aujourd’hui apparaîtront ici.");
    }
    return '<div class="entry-list">' + items.map(function(a){
      return (
        '<button type="button" class="entry-card" data-action="voir-achat-du-jour" data-id="' + a.id + '">' +
          '<div class="entry-ico">📦</div>' +
          '<div class="entry-main">' +
            '<div class="entry-title et-flex"><span class="et-nom">' + esc(a.produitNom) + '</span>' + badgeAutreSource(a) + '</div>' +
            '<div class="entry-sub">' + a.quantite + ' paquet(s) · ' + formatFCFA(a.prixAchatUnitaire) + '/u</div>' +

          '<div class="entry-amount">' + formatFCFA(a.quantite*a.prixAchatUnitaire + (a.charges||0)) + '</div>' +
        '</button>'
      );

  // Sprint Revente-D : repère visuel des achats qui ne sont pas sortis de la caisse.
  function badgeAutreSource(a){
    return achatPayeParCaisse(a) ? "" : ' <span class="badge badge-autre">Autre source</span>';
  }
  // Sprint Revente-D : dans les listes, une commande spéciale affiche son
  // montant comptabilisé (la marge) — pour que la liste corresponde au total —
  // et rappelle le montant encaissé et la part du revendeur.
  function sousTitreTransit(v){
    if(!estCommandeSpeciale(v)) return "";
    return " · encaissé " + montantInsecable(v.montantEncaisse) + ", dont " + montantInsecable(v.prixPayeRevendeur || 0) + " au revendeur";
  }
  // Sprint Revente-E : un montant ne se coupe jamais en fin de ligne (« 7 / 000 F »).
  function montantInsecable(n){ return formatFCFA(n).replace(/ /g, "\u00a0"); }
  function renderJourVentesModal(){
    var today = todayStr();
    var items = sortByDateDesc(state.ventes.filter(function(v){ return v.date === today; }));
    if(!items.length){
      return emptyState("🛍️", "Aucune vente aujourd’hui", "Les ventes enregistrées aujourd’hui apparaîtront ici.");
    }
    return '<div class="entry-list">' + items.map(function(v){
      var badge = v.typeVente === "commande_speciale" ? ' <span class="badge">Commande spéciale</span>' : "";
      return (
        '<button type="button" class="entry-card" data-action="voir-vente-du-jour" data-id="' + v.id + '">' +
          '<div class="entry-ico ico-vente">🛍️</div>' +
          '<div class="entry-main">' +
            '<div class="entry-title et-flex"><span class="et-nom">' + esc(v.produitNom) + '</span>' + badge + '</div>' +
            '<div class="entry-sub">' + v.quantite + ' vendu(s)' + sousTitreTransit(v) + '</div>' +
          '</div>' +
          '<div class="entry-amount pos">' + formatFCFA(montantComptabiliseVente(v)) + '</div>' +
        '</button>'
      );
    }).join("") + '</div>';
  }

  /* ================= Formulaires : capture / options communes ================= */

  function optionsProduits(selectedId, placeholder){
    var list = state.config.produits.slice().sort(function(a,b){ return a.nom.localeCompare(b.nom); });
    var opts = '<option value="" disabled' + (!selectedId?" selected":"") + '>' + esc(placeholder||"Choisir un produit") + '</option>';
    opts += list.map(function(it){
      return '<option value="' + it.id + '"' + (it.id===selectedId?" selected":"") + '>' + esc(it.nom) + '</option>';
    }).join("");
    opts += '<option value="__new__"' + (selectedId==="__new__"?" selected":"") + '>+ Nouveau produit…</option>';
    return opts;
  }
  function fieldErr(key){
    return ui.errors[key] ? '<div class="field-error">' + esc(ui.errors[key]) + '</div>' : "";
  }
  function captureDraft(fieldIds){
    fieldIds.forEach(function(id){
      var el = byId(id);
      if(el) ui.draft[id] = el.value;
    });
  }

  /* ---------- F2 : Achats ---------- */

  var ACHAT_FIELDS = ["f-date","f-produitSel","f-produitNouveauNom","f-quantite","f-prixAchat","f-prixVente","f-charges"];

  // Sprint Revente-E : le même formulaire sert à la saisie et à la
  // modification (pré-rempli, mêmes contrôles, bouton « Enregistrer les
  // modifications » et message doux si un mois passé est concerné).
  function renderFormAchat(modif){
    var d = ui.draft;
    var produitSel = d["f-produitSel"] || "";
    var isNew = produitSel === "__new__";
    var sourcePaiement = d["f-sourcePaiement"] === "autre" ? "autre" : "caisse";
    return (
      '<div>' +
        '<div class="field"><div class="label">Date d’acquisition <span class="req">*</span></div>' +
          '<input type="date" class="input" id="f-date" max="' + todayStr() + '" value="' + esc(d["f-date"] || todayStr()) + '" data-action-change="capture-achat">' +
          fieldErr("date") +
        '</div>' +
        '<div class="field"><div class="label">Produit <span class="req">*</span></div>' +
          '<select class="select" id="f-produitSel" data-action-change="produit-achat-change">' + optionsProduits(produitSel) + '</select>' +
          (isNew ? '<div class="inline-new"><input type="text" class="input" id="f-produitNouveauNom" placeholder="Nom du nouveau produit" value="' + esc(d["f-produitNouveauNom"]||"") + '" data-autofocus data-action-change="capture-achat"></div>' : '') +
          fieldErr("produit") +
        '</div>' +
        '<div class="field"><div class="label">Quantité achetée (paquets) <span class="req">*</span></div>' +
          '<input type="number" inputmode="decimal" step="0.1" min="0" class="input" id="f-quantite" placeholder="Ex. 2 ou 0,5" value="' + esc(d["f-quantite"]||"") + '" data-action-change="capture-achat">' +
          fieldErr("quantite") +
        '</div>' +
        '<div class="field"><div class="label">Prix d’achat unitaire (FCFA) <span class="req">*</span></div>' +
          '<input type="number" inputmode="numeric" step="1" min="0" class="input" id="f-prixAchat" value="' + esc(d["f-prixAchat"]||"") + '" data-action-change="capture-achat">' +
          fieldErr("prixAchat") +
        '</div>' +
        '<div class="field"><div class="label">Prix de vente unitaire estimé (FCFA) <span class="req">*</span></div>' +
          '<input type="number" inputmode="numeric" step="1" min="0" class="input" id="f-prixVente" value="' + esc(d["f-prixVente"]||"") + '" data-action-change="capture-achat">' +
          '<div class="field-note">Sert seulement à estimer le bénéfice attendu.</div>' +
          fieldErr("prixVente") +
        '</div>' +
        '<div class="field"><div class="label">Charges (transport, livraison…) (FCFA)</div>' +
          '<input type="number" inputmode="numeric" step="1" min="0" class="input" id="f-charges" placeholder="0" value="' + esc(d["f-charges"]||"") + '" data-action-change="capture-achat">' +
        '</div>' +
        // Sprint Revente-D : d'où vient l'argent de cet achat (« la caisse » par défaut).
        '<div class="field"><div class="label">Payé avec</div>' +
          '<div class="radio-row">' +
            '<button type="button" class="radio-opt' + (sourcePaiement==="caisse"?" active":"") + '" data-action="set-source-paiement" data-val="caisse">La caisse</button>' +
            '<button type="button" class="radio-opt' + (sourcePaiement==="autre"?" active":"") + '" data-action="set-source-paiement" data-val="autre">Une autre source</button>' +
          '</div>' +
          '<div class="field-note">' + (sourcePaiement==="autre"
            ? "Argent personnel, mobile money, prêt… : l’achat compte dans vos achats du mois, mais ne sort pas de la caisse."
            : "Le montant de l’achat sort de la caisse.") + '</div>' +
        '</div>' +
        (modif ? renderNoteMoisPasse() : '') +
        (modif
          ? '<button type="button" class="btn btn-primary" data-action="enregistrer-modif-achat">Enregistrer les modifications</button>'
          : '<button type="button" class="btn btn-primary" data-action="enregistrer-achat">Enregistrer</button>') +
      '</div>'
