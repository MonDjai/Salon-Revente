  function chiffrer(cle, texte){
    var iv = octetsHasard(LONGUEUR_IV);
    return window.crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, cle, octetsUtf8(texte)).then(function(buf){
      return { donnees: versBase64(new Uint8Array(buf)), iv: versBase64(iv) };
    });
  }
  function dechiffrer(cle, donnees, iv){
    return window.crypto.subtle.decrypt({ name: "AES-GCM", iv: depuisBase64(iv) }, cle, depuisBase64(donnees)).then(function(buf){
      return texteUtf8(new Uint8Array(buf));
    });
  }

  /* ---------- La clé de la sauvegarde : CryptoKey non exportable (magasin « cle ») ---------- */
  // Tirée du code PIN quand il est créé, changé ou tapé ; jamais le PIN ni la
  // clé en clair, jamais dans un fichier. Elle permet la sauvegarde du jour
  // même quand l'appli s'ouvre avec l'empreinte.
  function lireCle(suite){
    if(memoire.cle || memoire.cleLue){ suite(memoire.cle); return; }
    ouvrirBaseSecours(function(base){
      if(!base){ memoire.cleLue = true; suite(memoire.cle); return; }
      try{
        var dem = base.transaction("cle", "readonly").objectStore("cle").get(CLE_SAUVEGARDE);
        dem.onsuccess = function(){
          fermerBase(base);
          var v = dem.result;
          memoire.cleLue = true;
          if(v && v.cle && v.sel && !memoire.cle) memoire.cle = v;
          suite(memoire.cle);
        };
        dem.onerror = function(){ fermerBase(base); memoire.cleLue = true; suite(memoire.cle); };
      }catch(e){ fermerBase(base); memoire.cleLue = true; suite(memoire.cle); }
    });
  }
  // Range la clé ; si le navigateur refuse de la garder, elle reste en
  // mémoire pour la journée (repli : sauvegarde le jour où le PIN est tapé).
  function rangerCle(objet, suite){
    memoire.cle = objet; memoire.cleLue = true;
    ouvrirBaseSecours(function(base){
      if(!base){ memoire.cleNonGardee = true; if(suite) suite(false); return; }
      var fini = false;
      function rendre(ok){ if(fini) return; fini = true; fermerBase(base); memoire.cleNonGardee = !ok; if(suite) suite(ok); }
      try{
        var tx = base.transaction("cle", "readwrite");
        tx.objectStore("cle").put(objet, CLE_SAUVEGARDE);
        tx.oncomplete = function(){ rendre(true); };
        tx.onerror = tx.onabort = function(){ rendre(false); };
      }catch(e){ rendre(false); }
    });
  }
  function effacerCle(){
    memoire.cle = null; memoire.cleLue = true;
    ouvrirBaseSecours(function(base){
      if(!base) return;
      try{
        var tx = base.transaction("cle", "readwrite");
        tx.objectStore("cle")["delete"](CLE_SAUVEGARDE);
        tx.oncomplete = tx.onerror = tx.onabort = function(){ fermerBase(base); };
      }catch(e){ fermerBase(base); }
    });
  }
  // Tire une nouvelle clé (sel neuf) du code PIN et la range. suite(objet | null)
  function creerCle(pin, suite){
    if(!cryptoPresent()){ if(suite) suite(null); return; }
    var sel = octetsHasard(LONGUEUR_SEL);
    enCours.cle = true;
    try{
      tirerCle(String(pin), sel, PBKDF2_ITERATIONS).then(function(cle){
        enCours.cle = false;
        var objet = { cle: cle, sel: versBase64(sel), iterations: PBKDF2_ITERATIONS, le: maintenant() };
        rangerCle(objet, function(){ if(suite) suite(objet); });
      }, function(){ enCours.cle = false; if(suite) suite(null); });
    }catch(e){ enCours.cle = false; if(suite) suite(null); }
  }
  // Le code PIN vient d'être tapé (écran de l'appli) : un PIN d'avant
  // (config.pinCode) ou un PIN du compte sans clé produit la clé ; dans le
  // repli sans clé gardée, la sauvegarde du jour se fait maintenant.
  function pinTape(pin){
    if(!cryptoPresent() || !pin) return;
    lireCle(function(c){
      if(c){ if(memoire.cleNonGardee) planifierSauvegardeAuto(); return; }
      creerCle(pin, function(objet){ if(objet) planifierSauvegardeAuto(); prevenirReglages(); });
    });
  }

  /* ---------- Sauvegarde en ligne ---------- */
  function pinPresent(){ chargerCompte(); return !!compte.pin || appel("pinExistant", false) === true; }
  // Pourquoi la sauvegarde en ligne ne peut pas se faire (ou "" si elle peut).
  function empechementSauvegarde(){
    chargerCompte();
    if(!cryptoPresent()) return "crypto";
    if(!pinPresent()) return "pin";
    if(!estInscrit()) return "inscription";
    if(!estConnecte()) return "connexion";
    if(!compte.sauvegardeEnLigne.active) return "desactivee";
    return "";
  }
  function sauvegardeDue(){
    chargerCompte();
    var s = sauvegardeIci();
    return !empechementSauvegarde() && (s.aRefaire || s.derniereLe !== jourLocal());
  }
  function planifierSauvegardeAuto(){
    if(minuteurs.sauvegarde || !cfg) return;
    if(!sauvegardeDue()) return;
    if(maintenant() - memoire.sauvegardeEchecLe < PAUSE_APRES_ECHEC_MS) return;
    minuteurs.sauvegarde = setTimeout(function(){
      minuteurs.sauvegarde = null;
      essayerSauvegardeAuto();
    }, DELAI_SAUVEGARDE_AUTO_MS);
  }
  // Une fois par jour, au premier lancement du jour, appli au repos.
  function essayerSauvegardeAuto(){
    if(!sauvegardeDue() || enCours.sauvegarde || !enLigne()) return;
    if(ecran || appel("verrouille", false) === true || appel("auRepos", true) !== true){ planifierSauvegardeAuto(); return; }
    lireCle(function(cle){
      if(!cle) return;                         // pas de clé : le PIN sera demandé une fois (Réglages)
      sauvegarderAvec(cle, function(err){
        if(err) memoire.sauvegardeEchecLe = maintenant();
        prevenirReglages();
      });
    });
  }
  // Chiffre le contenu donné par l'appli et le dépose sur le serveur.
  // suite(erreur) ; erreur = { type: "taille" | "contenu" | "crypto" | … }
  function sauvegarderAvec(cleObjet, suite){
    if(enCours.sauvegarde){ suite({ type: "occupe" }); return; }
    var contenu = appel("contenuSauvegarde", null);
    if(!contenu || typeof contenu !== "object"){ suite({ type: "contenu" }); return; }
    var texte;
    try{ texte = JSON.stringify({ format: FORMAT_SAUVEGARDE, version: 1, appli: cfg.appli, versionAppli: String(cfg.version || ""), le: maintenant(), contenu: contenu }); }
    catch(e){ suite({ type: "contenu" }); return; }
    enCours.sauvegarde = true;
    function finir(err){ enCours.sauvegarde = false; suite(err || null); }
    try{
      chiffrer(cleObjet.cle, texte).then(function(ch){
        if(ch.donnees.length > TAILLE_MAX_SAUVEGARDE){ finir({ type: "taille" }); return; }
        var parametres = { p_appli: cfg.appli, p_donnees: ch.donnees, p_iv: ch.iv, p_sel: cleObjet.sel,
          p_iterations: cleObjet.iterations, p_version: String(cfg.version || "").slice(0, 40) };
        appelerFonction("deposer_sauvegarde", parametres, null, function(err, data){
          if(err){ finir(err); return; }
          modifierCompte(function(c){
            noterSauvegardeIci(c, { derniereLe: jourLocal(), derniereMs: data && data.maj_le ? Date.parse(data.maj_le) || maintenant() : maintenant(),
              derniereTaille: data && data.taille ? data.taille : ch.donnees.length, aRefaire: false });
          });
          compter("sauvegarde.en_ligne");
          finir(null);
        });
      }, function(){ finir({ type: "crypto" }); });
    }catch(e){ finir({ type: "crypto" }); }
  }
  // Lecture d'une sauvegarde (la dernière, ou l'avant-dernière). suite(err, s | null)
  function lireSauvegardeEnLigne(precedente, suite){
    appelerFonction("lire_ma_sauvegarde", { p_appli: cfg.appli, p_precedente: !!precedente }, null, function(err, data){
      if(err){ suite(err, null); return; }
      if(!data || typeof data !== "object" || !data.donnees || !data.iv || !data.sel){ suite(null, null); return; }
      suite(null, data);
    });
  }
  // Ouvre une sauvegarde avec le PIN tapé. suite(null, { contenu, cle }) ou suite({ type: "pin" | "illisible" })
  function ouvrirSauvegarde(s, pin, suite){
    var sel = depuisBase64(s.sel), iterations = Number(s.iterations) || PBKDF2_ITERATIONS, cleTiree = null;
    try{
      tirerCle(String(pin), sel, iterations).then(function(cle){
        cleTiree = cle;
        return dechiffrer(cle, s.donnees, s.iv);
      }).then(function(texte){
        var o = null;
        try{ o = JSON.parse(texte); }catch(e){ o = null; }
        if(!o || o.format !== FORMAT_SAUVEGARDE || !o.contenu || typeof o.contenu !== "object"){ suite({ type: "illisible" }); return; }
        if(o.appli && o.appli !== cfg.appli){ suite({ type: "illisible" }); return; }
        suite(null, { contenu: o.contenu, cle: { cle: cleTiree, sel: s.sel, iterations: iterations, le: maintenant() }, le: s.maj_le || null });
      }, function(){
        // AES-GCM ne dit pas si c'est le code ou les données : mauvais PIN, ou sauvegarde abîmée.
        suite({ type: "pin" });
      });
    }catch(e){ suite({ type: "illisible" }); }
  }
  // Réglages de l'appli à redessiner (message, date de la dernière sauvegarde).
  function prevenirReglages(){ if(!ecran) appel("surChangement"); else if(ecran.type === "feuille") prevenirAppli(); }

  /* ---------- Copie de secours des chiffres de l'appli (IndexedDB) ---------- */
  // o = { base, lire() → texte | null (stockage principal), ecrire(texte), estVide(texte) → bool, surRestauration() }
  // La copie n'est jamais écrite avant d'avoir été lue ; jamais écrasée par un
  // état vide ; elle ne remplace jamais un stockage principal présent ; elle
  // ne masque jamais l'écran (tout se fait en arrière-plan).
  function ouvrirBaseDonnees(suite){ ouvrirBase(copieDonnees.o.base, 1, ["copie"], suite); }
  function demarrerCopieDonnees(o){
    if(copieDonnees || !o || !o.base) return;
    copieDonnees = { o: o, lue: false };
    ouvrirBaseDonnees(function(base){
      if(!base) return;                        // copie impossible : on n'écrira jamais
      try{
        var dem = base.transaction("copie", "readonly").objectStore("copie").get("etat");
        dem.onsuccess = function(){
          fermerBase(base);
          var v = dem.result, ici = null;
          try{ ici = o.lire(); }catch(e){ ici = null; }
          copieDonnees.lue = true;
          if(ici === null && v && typeof v.texte === "string" && !vide(v.texte)){
            try{ o.ecrire(v.texte); }catch(e){}
            try{ o.surRestauration(); }catch(e){}
            return;
          }
          if(ici !== null && !vide(ici) && (!v || v.texte !== ici)) noterChangementDonnees();
        };
        dem.onerror = function(){ fermerBase(base); };
      }catch(e){ fermerBase(base); }
    });
  }
  function vide(texte){
    try{ return copieDonnees.o.estVide(texte) !== false; }catch(e){ return true; }
  }
  function noterChangementDonnees(){
    if(!copieDonnees || !copieDonnees.lue) return;
    if(minuteurs.donnees) clearTimeout(minuteurs.donnees);
    minuteurs.donnees = setTimeout(ecrireCopieDonnees, DELAI_COPIE_DONNEES_MS);
  }
  function ecrireCopieDonnees(){
    minuteurs.donnees = null;
    if(!copieDonnees || !copieDonnees.lue) return;
    var texte = null;
    try{ texte = copieDonnees.o.lire(); }catch(e){ texte = null; }
    if(texte === null || vide(texte)) return;   // jamais d'état vide sur la copie
    ouvrirBaseDonnees(function(base){
      if(!base) return;
      try{
        var tx = base.transaction("copie", "readwrite");
        tx.objectStore("copie").put({ texte: texte, le: maintenant(), version: String(cfg && cfg.version || "") }, "etat");
        tx.oncomplete = tx.onerror = tx.onabort = function(){ fermerBase(base); };
      }catch(e){ fermerBase(base); }
    });
  }

  /* ---------- Inscription et modification du compte ---------- */
  // fiche = { prenom, nom, commune, activites, salon, modeCoiffure }
  function parametresCompte(fiche){
    return { p_prenom: fiche.prenom, p_nom: fiche.nom || "", p_salon: fiche.salon, p_activites: fiche.activites,
      p_mode_coiffure: fiche.modeCoiffure || null, p_commune: fiche.commune || "", p_parrain: null, p_conditions: true };
  }
  // Enregistre sur le serveur ; en cas de panne, garde la fiche sur le téléphone
  // et la met en file d'attente. suite(erreurDefinitive, enAttente)
  function envoyerFiche(fiche, suite){
    var parametres = parametresCompte(fiche);
    function rangerLocalement(enAttente){
      modifierCompte(function(c){
        c.prenom = fiche.prenom; c.nom = fiche.nom || null; c.commune = fiche.commune || null;
        c.salon = fiche.salon; c.activites = fiche.activites.slice(0); c.modeCoiffure = fiche.modeCoiffure || null;
        if(!c.conditionsAccepteesLe) c.conditionsAccepteesLe = jourLocal();
        if(enAttente && !c.id) c.enAttente = true;
      });
    }
    appelerFonction("enregistrer_mon_compte", parametres, null, function(err, data){
      if(!err){
        rangerLocalement(false);
        appliquerStatut(data);
        envoyerAppareil();
        suite(null, false);
        return;
      }
      if(estPanne(err)){
        rangerLocalement(true);
        mettreEnFile("enregistrer_mon_compte", parametres);
        suite(null, true);
        return;
      }
      suite(err, false);
    });
  }

  /* ---------- Code PIN du compte (haché) et empreinte ---------- */
  function pinDefini(){ chargerCompte(); return !!compte.pin; }
  function verifierPin(pin){
    chargerCompte();
    if(!compte.pin) return false;
    return hacherPin(String(pin), compte.pin.sel) === compte.pin.empreinte;
  }
  // cleTiree (facultative) : clé déjà tirée de ce PIN (restauration d'une
  // sauvegarde en ligne) ; sinon une clé neuve est tirée du nouveau PIN.
  function definirPin(pin, cleTiree){
    var sel = hasard(16, ALPHABET_ID);
    modifierCompte(function(c){
      c.pin = { empreinte: hacherPin(String(pin), sel), sel: sel };
      // La prochaine sauvegarde en ligne part avec la clé de ce PIN (v4 : dans chaque appli du téléphone).
      c.sauvegardeEnLigne.aRefaire = true;
      var i;
      for(i = 0; i < APPLIS.length; i++){ var pa = propre(c, APPLIS[i]); if(pa && pa.sauvegarde && typeof pa.sauvegarde === "object") pa.sauvegarde.aRefaire = true; }
    });
    appel("surPinDefini");
    if(cleTiree) rangerCle(cleTiree, function(){ planifierSauvegardeAuto(); });
    else creerCle(pin, function(){ planifierSauvegardeAuto(); prevenirReglages(); });
  }
  function retirerPin(){
    modifierCompte(function(c){ c.pin = null; c.empreinte = null; });
    effacerCle();
    appel("surPinRetire");
  }
  function empreinteActive(){ chargerCompte(); return !!(compte.empreinte && memoire.empreintePossible !== false && webAuthnPresent()); }
  function webAuthnPresent(){
    try{ return !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create && navigator.credentials.get && window.Uint8Array); }
    catch(e){ return false; }
  }
  // L'empreinte n'est proposée que si le téléphone répond « oui ».
  function sonderEmpreinte(){
    memoire.empreintePossible = false;
    if(!webAuthnPresent()) return;
    try{
      var f = window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable;
      if(typeof f !== "function") return;
      memoire.empreintePossible = null;          // réponse du téléphone attendue
      f.call(window.PublicKeyCredential).then(function(oui){
        var avant = memoire.empreintePossible;
        memoire.empreintePossible = oui === true;
        if(ecran) majApresSonde();
        // Écran de code PIN de l'appli déjà affiché : le bouton de l'empreinte suit la réponse.
        else if(avant !== memoire.empreintePossible && compte && compte.empreinte && appel("verrouille", false) === true) prevenirAppli();
      }, function(){ memoire.empreintePossible = false; });
    }catch(e){ memoire.empreintePossible = false; }
  }
  function octetsHasard(n){

    return o;
  }
  var B64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
  // Base64 « url » sans remplissage (identifiants d'empreinte, sauvegarde en
  // ligne). Par morceaux : une sauvegarde peut faire plusieurs Mo.
  function versBase64(octets){
    var morceaux = [], out = "", i, a, b, c;
    for(i = 0; i < octets.length; i += 3){
      a = octets[i]; b = i + 1 < octets.length ? octets[i + 1] : 0; c = i + 2 < octets.length ? octets[i + 2] : 0;
      out += B64.charAt(a >> 2) + B64.charAt(((a & 3) << 4) | (b >> 4));
      if(i + 1 < octets.length) out += B64.charAt(((b & 15) << 2) | (c >> 6));
      if(i + 2 < octets.length) out += B64.charAt(c & 63);
      if(out.length >= 8192){ morceaux.push(out); out = ""; }
    }
    morceaux.push(out);
    return morceaux.join("");
  }
  var B64_VALEURS = null;
  function depuisBase64(s){
    var i, n = 0, bits = 0, k = 0;
    s = String(s || "");
    if(!B64_VALEURS){ B64_VALEURS = {}; for(i = 0; i < B64.length; i++) B64_VALEURS[B64.charAt(i)] = i; }
    var out = new Uint8Array(Math.floor(s.length * 3 / 4) + 3);
    for(i = 0; i < s.length; i++){
      var v = B64_VALEURS[s.charAt(i)];
      if(v === undefined) continue;
      n = ((n << 6) | v) & 0xffffff; bits += 6;
      if(bits >= 8){ bits -= 8; out[k++] = (n >> bits) & 255; }
    }
    return out.subarray ? out.subarray(0, k) : out;
  }
  // Enregistre l'empreinte du téléphone (authentificateur intégré seulement).
  function activerEmpreinte(suite){
    if(!webAuthnPresent() || memoire.empreintePossible !== true){ suite(false); return; }
    chargerCompte();
    try{
      navigator.credentials.create({ publicKey: {
        challenge: octetsHasard(32),
        rp: { name: "MonDjai" },
        user: { id: octetsHasard(16), name: compte.telephone || "MonDjai", displayName: compte.prenom || "MonDjai" },

        if(!cred || !cred.rawId){ suite(false); return; }
        var id = versBase64(new Uint8Array(cred.rawId));

      }, function(){ suite(false); });
    }catch(e){ suite(false); }
  }
  // Vérification locale : le téléphone confirme l'empreinte. Le PIN reste le secours.
  function verifierEmpreinte(suite){
    chargerCompte();
    if(!webAuthnPresent() || !compte.empreinte){ suite(false); return; }
    var attendu = compte.empreinte.credentialId;
    try{
      navigator.credentials.get({ publicKey: {
        challenge: octetsHasard(32),
        allowCredentials: [{ type: "public-key", id: depuisBase64(attendu), transports: ["internal"] }],
        userVerification: "required",

        var ok = !!(cred && cred.rawId && versBase64(new Uint8Array(cred.rawId)) === attendu);

          var donnees = new Uint8Array(cred.response.authenticatorData);
          if(donnees.length > 32 && !(donnees[32] & 4)) ok = false;
        }catch(e){}
        suite(ok);
      }, function(){ suite(false); });
    }catch(e){ suite(false); }
  }

  /* ---------- Styles du bloc (posés une fois) ---------- */

    var out = [], i;

    return out.join(" + ");

  // La carte MonDjai : elle se remplit pendant l'inscription.
  function htmlCarte(nom, numero, identifiant){

      '<div class="mdc-carte-texte">' +

        '<div class="mdc-carte-nom" data-carte="nom">' + esc(nom || "Votre carte") + '</div>' +

  function copierTexte(texte, suite){
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(texte).then(function(){ suite(true); }, function(){ suite(copierAncien(texte)); });
        return;
      }
    }catch(e){}
    suite(copierAncien(texte));
  }
  function copierAncien(texte){
    try{
      var t = document.createElement("textarea");
      t.value = texte; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.top = "-100px";
      document.body.appendChild(t); t.select();
      var ok = document.execCommand && document.execCommand("copy");
      document.body.removeChild(t);
      return !!ok;
    }catch(e){ return false; }
  }
  function moyensActifs(){
    var inf = infosPaiement(), out = [];
    if(inf.wave && inf.wave.actif) out.push("wave");
    if(inf.orange_money && inf.orange_money.actif && inf.orange_money.numero) out.push("orange_money");
    if(!out.length) out.push("wave");
    return out;
  }

      case "voir-conditions": ecran.feuille = "conditions"; ecran.conditionsVue = null; dessinerFeuille(); prevenirAppli(); return;
      case "conditions-texte": ecran.conditionsVue = el.getAttribute("data-val"); dessinerFeuille(); prevenirAppli(); return;
      case "conditions-essentiel": ecran.conditionsVue = null; dessinerFeuille(); prevenirAppli(); return;
      // ----- Mon abonnement -----
      case "choisir-duree": {
        var d = parseInt(el.getAttribute("data-val"), 10);
        if(DUREES.indexOf(d) !== -1){ ecran.duree = d; ecran.message = null; dessiner(); }
        return;
      }
      case "choisir-formule": ecran.formule = el.getAttribute("data-val"); ecran.message = null; dessiner(); return;
      case "aller-payer": ecran.vue = "payer"; ecran.message = null; montrer(); rafraichirInfosPaiement(function(){ if(ecran && ecran.type === "abonnement" && ecran.vue === "payer") dessiner(); }); return;
      case "aller-declarer": {
        var moyens = moyensActifs();

        return;
      }
      case "moyen": {
        ecran.moyen = el.getAttribute("data-val") === "orange_money" ? "orange_money" : "wave";

        dessiner();
        return;
      }
      case "envoyer-declaration": envoyerDeclaration(); return;
      case "corriger-paiement": {
        chargerCompte();
        var dc = compte.declaration;
        if(dc && formuleOuvreAppli(dc.formule)){ ecran.formule = dc.formule; ecran.duree = dc.duree; ecran.moyen = dc.moyen; ecran.reference = dc.reference || ""; }
        ecran.vue = "declarer"; ecran.message = null; montrer(); focaliser("#mdc-ref");
        return;
      }
      case "copier-om": copierTexte(chiffresDe(infosPaiement().orange_money.numero), function(ok){ dire(ok ? "Numéro copié." : "Copiez le numéro à la main.", ok ? "ok" : ""); }); return;
      // ----- Restauration d'une sauvegarde en ligne (nouveau téléphone) -----
      case "restau-non": apresRestauration(); return;
      case "restau-precedente": {
        var rs = ecran.restauration;
        if(!rs || rs.occupe) return;
        rs.occupe = true; dire("Un instant…");
        lireSauvegardeEnLigne(true, function(err, s){
          if(!ecran || ecran.restauration !== rs) return;
          rs.occupe = false;
          if(err){ dire(messagePanne(err), "alerte"); return; }
          if(!s){ dire("Pas d’autre sauvegarde.", "alerte"); return; }
          ecran.restauration = { s: s, le: s.maj_le || null, saisie: "", echecs: 0, precedente: true, occupe: false };
          ecran.message = null;
          dessiner();
        });
        return;
      }
      case "demenagement-sauvegarder": appel("sauvegarder"); return;
      case "conditions": {
        ecran.b.conditions = !ecran.b.conditions;
        el.setAttribute("aria-checked", String(ecran.b.conditions));
        el.className = "mdc-coche";
        if(ecran.message && ecran.message.ton === "alerte") dire("");
        return;
      }
      case "envoyer-numero": envoyerNumero(); return;
      case "sans-reseau": {
        // Jamais bloquée faute de réseau : l'appli s'ouvre en essai ; l'inscription
        // sera proposée au retour du réseau.
        memoire.invitationTentee = true;
        fermerEcran();
        appel("ouvrirAcces");
        prevenirAppli();
        return;
      }
      case "valider-code": validerCode(); return;
      case "renvoyer": renvoyerCode(); return;
      case "changer-numero": allerEtape(1); return;
      case "mode": {
        lireFormulaire();
        ecran.b.mode = el.getAttribute("data-val") === "salon" ? "salon" : "domicile";
        var freres = el.parentNode.children, i;
        for(i = 0; i < freres.length; i++) freres[i].setAttribute("aria-pressed", String(freres[i] === el));
        return;
      }
      case "aussi": ecran.b.aussi = !ecran.b.aussi; el.setAttribute("aria-checked", String(ecran.b.aussi)); return;
      case "envoyer-fiche": envoyerFicheEcran(function(){ apresFiche(); }); return;
      case "pin-touche": toucherPin(el.getAttribute("data-val")); return;
      case "pin-plus-tard": allerEtape(5); return;
      case "pin-vouloir-empreinte": ecran.pin.veutEmpreinte = true; dire("Choisissez d’abord un code PIN de secours."); return;
      case "empreinte-activer": {
        if(ecran.occupe) return;
        occuper(true);
        activerEmpreinte(function(ok){
          if(!ecran) return;
          occuper(false);
          if(ok){ allerEtape(5); return; }
          dire("L’empreinte n’a pas pu être activée. Le code PIN suffit.", "alerte");
        });
        return;
      }
      case "empreinte-non": allerEtape(5); return;
      case "terminer": terminer(); return;
      case "terminer-guide": memoire.guideDemande = true; terminer(); return;
      // ----- Mon compte -----
      case "reconnecter": fermerEcran(); ouvrirInscription("reconnexion"); return;
      case "modifier": ecran.vue = "modifier"; ecran.b = brouillonDepuisCompte(); ecran.message = null; montrer(); return;
      case "enregistrer-fiche": envoyerFicheEcran(function(enAttente){
        ecran.vue = "fiche";
        ecran.message = enAttente ? { texte: "Noté. Envoi au retour du réseau.", ton: "" } : { texte: "Enregistré.", ton: "ok" };
        montrer();
      }); return;
      case "pin-changer": ecran.vue = "pin"; ecran.pin = pinActuelOuNouveau(); ecran.message = null; montrer(); return;
      case "pin-retirer": ecran.vue = "pin"; ecran.pin = { phase: "retirer", saisie: "", premier: "" }; ecran.message = null; montrer(); return;
      case "empreinte-bascule": {
        if(compte.empreinte){ modifierCompte(function(c){ c.empreinte = null; }); dessiner(); return; }
        activerEmpreinte(function(ok){
          if(!ecran || ecran.type !== "compte") return;
          ecran.message = ok ? { texte: "Empreinte activée.", ton: "ok" } : { texte: "L’empreinte n’a pas pu être activée.", ton: "alerte" };
          dessiner();

  }
  function fermerFeuille(){
    if(!ecran) return;
    if(ecran.feuille === "merci") modifierCompte(function(c){ if(c.merci) c.merci.vu = true; });
    if(ecran.type === "feuille"){ ecran = null; }
    else { ecran.feuille = null; ecran.conditionsVue = null; }
    dessinerFeuille();
    prevenirAppli();

  function majApresSonde(){

    if(!ecran) return;
    if((ecran.type === "inscription" && ecran.etape === 4 && ecran.pin.phase === "premier" && !ecran.pin.saisie) ||
       (ecran.type === "compte" && ecran.vue === "fiche")) dessiner();

  /* ---------- Mon compte, déménagement ---------- */
  function ouvrirMonCompte(){
    chargerCompte();
    if(!compte.id && !compte.enAttente){ ouvrirInscription(appel("nouvelleInstallation", false) === true ? "nouvelle" : "invitation"); return; }
    ecran = { type: "compte", vue: "fiche", b: null, pin: null, occupe: false, feuille: null, message: null, direct: false };
    montrer();
    rafraichirStatut();
  }
  // Ouvre directement le pavé du code PIN (depuis les Réglages de l'appli).
  function ouvrirPin(){
    chargerCompte();

      pin: pinActuelOuNouveau() };

  function ouvrirDemenagement(){
    if(!demenagementVisible()) return;

  /* ---------- Bouton retour du téléphone ---------- */
  // Nombre de niveaux ouverts par le bloc (0 = le bouton retour sort de l'appli).
  // v3 : le guide en bulles compte pour un niveau (le retour le ferme).
  function profondeur(){ return profondeurEcran() + (guide ? 1 : 0); }
  function profondeurEcran(){
    if(!ecran) return 0;
    var p = ecran.feuille ? 1 + (ecran.feuille === "conditions" && ecran.conditionsVue ? 1 : 0) : 0;
    if(ecran.type === "feuille") return p;
    if(ecran.type === "inscription") return ecran.mode === "reconnue" ? p + 1 : p + (ecran.mode === "nouvelle" ? 0 : 1) + (ecran.etape - 1);
    if(ecran.type === "abonnement") return p + (ecran.vue === "declarer" ? 3 : ecran.vue === "payer" ? 2 : 1);
    return p + 1 + (ecran.vue === "fiche" || ecran.direct ? 0 : 1);
  }
  function retour(){
    if(guide){ fermerGuide(true); return; }
    if(!ecran) return;
    if(ecran.feuille === "conditions" && ecran.conditionsVue){ ecran.conditionsVue = null; dessinerFeuille(); prevenirAppli(); return; }
    if(ecran.feuille){ fermerFeuille(); return; }
    if(ecran.type === "abonnement"){
      if(ecran.vue === "declarer"){ ecran.vue = "payer"; ecran.message = null; montrer(); return; }
      if(ecran.vue === "payer"){ ecran.vue = "formules"; ecran.message = null; montrer(); return; }
      var depuis = ecran.depuis;
      fermerEcran();
      if(depuis === "compte"){ ouvrirMonCompte(); return; }
      prevenirAppli();
      return;
    }
    if(ecran.type === "inscription"){
      var e = ecran.etape;
      if(e === 5){ terminer(); return; }
      if(e === 4){ allerEtape(3); return; }
      if(e === 3 || e === 2){ allerEtape(1); return; }
      if(ecran.mode !== "nouvelle"){ fermerEcran(); prevenirAppli(); }
      return;
    }
    if(ecran.type === "compte"){
      if(ecran.vue !== "fiche" && !ecran.direct){ ecran.vue = "fiche"; ecran.message = null; montrer(); return; }
      fermerEcran(); prevenirAppli();
    }
  }

  /* ---------- Sauvegarde en ligne : Réglages de l'appli ---------- */
  function messageEmpechement(emp){
    if(emp === "crypto") return "Ce téléphone ne permet pas la sauvegarde en ligne. La sauvegarde en fichier reste possible.";
    if(emp === "pin") return "Sans code PIN, vos chiffres ne sont pas sauvegardés en ligne.";
    if(emp === "inscription") return "Terminez votre inscription pour l’activer.";
    if(emp === "connexion") return "Reconnectez-vous pour sauvegarder en ligne.";
    if(emp === "desactivee") return "Désactivée. La sauvegarde en fichier reste possible.";
    return "";
  }
  function messageErreurSauvegarde(err){
    if(!err) return "";
    if(err.type === "taille") return "Trop de données pour la sauvegarde en ligne. La sauvegarde en fichier reste possible.";
    if(err.code === "sans_session") return "Reconnectez-vous pour sauvegarder en ligne.";
    if(estPanne(err)) return messagePanne(err);
    return "La sauvegarde n’a pas pu se faire. Réessayez plus tard.";
  }
  function sauvegarderMaintenant(){
    var emp = empechementSauvegarde();
    if(emp && emp !== "desactivee"){ memoire.selMessage = { texte: messageEmpechement(emp), ton: "alerte" }; prevenirReglages(); return; }
    lireCle(function(cle){
      if(!cle){ ouvrirPinSauvegarde(); return; }
      memoire.selMessage = { texte: "Sauvegarde en cours…", ton: "" };
      prevenirReglages();
      sauvegarderAvec(cle, function(err){
        memoire.sauvegardeEchecLe = err ? maintenant() : 0;
        memoire.selMessage = err ? { texte: messageErreurSauvegarde(err), ton: "alerte" } : { texte: "Sauvegardé.", ton: "ok" };
        prevenirReglages();
      });
    });
  }
  function ouvrirPinSauvegarde(){
    if(ecran) return;
    ecran = { type: "feuille", feuille: "pin-sauvegarde", pin: { phase: "verifier", saisie: "", occupe: false }, message: null };
    dessinerFeuille();
    prevenirAppli();
  }
  // Section « Sauvegarde en ligne » des Réglages de l'appli.
  function reglageSauvegardeEnLigne(){
    if(!cfg) return "";
    chargerCompte();
    var emp = empechementSauvegarde(), s = compte.sauvegardeEnLigne, ici = sauvegardeIci();
    var possible = emp === "" || emp === "desactivee" || emp === "connexion";
    var active = s.active && emp !== "crypto" && emp !== "pin";
    var etat = "", boutons = "", m = memoire.selMessage;
    if(emp === "" ){
      etat = "Chaque jour, sans rien faire." + (ici.derniereLe ? " Dernière : " + dateFr(ici.derniereLe) + "." : "");
      if(memoire.cleLue && !memoire.cle && !enCours.cle) etat += " Tapez votre code PIN une fois pour l’activer.";
      boutons = '<button type="button" class="mdc-btn-2" data-mdc="sel-maintenant" data-test="sel-maintenant">Sauvegarder maintenant</button>';
    } else {
      etat = messageEmpechement(emp);
      if(emp === "pin") boutons = '<button type="button" class="mdc-btn-2" data-mdc="sel-creer-pin">Créer un code PIN</button>';
      else if(emp === "connexion") boutons = '<button type="button" class="mdc-btn-2" data-mdc="ouvrir-reconnexion">Me reconnecter</button>';
      else if(emp === "inscription") boutons = '<button type="button" class="mdc-btn-2" data-mdc="ouvrir-inscription">Terminer mon inscription</button>';
    }
    return '<div class="mdc-sel" data-test="sauvegarde-en-ligne" data-etat="' + esc(emp || "active") + '">' +
      '<button type="button" class="mdc-rang" role="switch" data-mdc="sel-bascule" data-test="sel-bascule" aria-checked="' + !!active + '"' + (possible ? '' : ' aria-disabled="true"') + '>Sauvegarde en ligne<i class="mdc-inter"></i></button>' +
      '<p data-test="sel-etat">' + esc(etat) + '</p>' +
      (m ? '<p class="' + esc(m.ton || "") + '" role="status" data-test="sel-message">' + esc(m.texte) + '</p>' : '') +
      boutons + '</div>';
  }

  /* ---------- Accès, lecture seule : ce que l'appli demande au bloc ---------- */
  function acces(){ return cfg ? statutCourant() : { valeur: "essai", saisieOuverte: true, source: "local" }; }
  function ouvrirAbonnement(vue, depuis){
    if(!cfg) return;
    chargerCompte();
    var formule = formulesProposees()[0];
    var p = paiementEnCours(), d = compte.declaration;
    var duree = 1;
    if(p && formuleOuvreAppli(p.formule)){ formule = p.formule; duree = p.duree; }
    else if(d && d.refusee && formuleOuvreAppli(d.formule)){ formule = d.formule; duree = d.duree; }
    arreterRenvoi(); arreterLectureSms();
    ecran = { type: "abonnement", vue: vue === "payer" ? "payer" : "formules", formule: formule, duree: duree,
      moyen: moyensActifs()[0], reference: d && (d.refusee || p) ? d.reference || "" : "", depuis: depuis || null,
      occupe: false, feuille: null, message: null };
    montrer();
    rafraichirStatut();
    rafraichirInfosPaiement(function(){ if(ecran && ecran.type === "abonnement" && !ecran.occupe && !ecran.feuille) dessiner(); });
  }
  // La même feuille pour chaque geste fermé en lecture seule.
  function ouvrirLectureSeule(){

  // Bandeau discret en haut de l'écran, sur tous les onglets.
  function bandeauLectureSeule(){

  function ligneAbonnement(){
    if(!cfg) return "";
    var st = statutCourant(), c = couleursCarte();

      '<i style="background:' + esc(c.haut) + ';color:' + esc(c.encre) + ';">F</i>' +

  /* ---------- Morceaux affichés dans l'appli ---------- */
  // Une seule ligne à la fois sur Aujourd'hui (ou rien). Elle tient sur une
  // ligne, à la place du sous-titre du bandeau : aucune hauteur ajoutée.
  // Ordre (cahier §5.8, puis les lignes du compte) : déménagement, échéance
  // (J-3 à J), grâce, paiement en vérification, paiement validé, inscription,
  // reconnexion, conditions mises à jour, saisie oubliée, sauvegarde.
  // « ✕ » (Plus tard) cache une ligne de rappel pour la journée.
  function carteAujourdhui(){
    if(!cfg) return "";
    chargerCompte();
    var l = ligneDuJour();
    if(!l) return "";
    if(l.rappel && memoire.rappelsVus[l.type] !== jourLocal()){
      memoire.rappelsVus[l.type] = jourLocal();
      compter("rappel.affiche." + l.type);
    }
    return l.html;
  }
  function cacheAujourdhui(type){
    var r = compte.rappels;
    return !!(r && r.plusTard && r.plusTard[clePlusTard(type)] === jourLocal());
  }
  function merciIci(){ var s = compte.statut; return !s || !s.formule || formuleOuvreAppli(s.formule); }
  // Une pastille (et, pour un rappel, son « ✕ » Plus tard).
  function pastilleRappel(type, action, test, texte, avecPlusTard){
    // Sur deux lignes, jamais « · Noter » seul en début de ligne, ni « 3 » séparé de « jours ».
    texte = String(texte).replace(/ · /g, "\u00a0·\u00a0").replace(/(\d) (?=[^\d])/g, "$1\u00a0");
    var b = '<button type="button" class="mdc-pastille" data-mdc="' + action + '"' + (avecPlusTard ? ' data-rappel="' + type + '"' : '') + ' data-test="' + test + '">' + esc(texte) + '</button>';
    if(!avecPlusTard) return b;
    return '<span class="mdc-ligne" data-test="ligne-rappel" data-type="' + type + '">' + b +
      '<button type="button" class="mdc-ligne-x" data-mdc="rappel-plus-tard" data-val="' + type + '" data-test="rappel-plus-tard" aria-label="Plus tard">✕</button></span>';
  }
  function ligneDuJour(){
    if(demenagementVisible()) return { type: "demenagement", html: '<button type="button" class="mdc-pastille" data-mdc="ouvrir-demenagement" data-test="carte-demenagement">MonDjai déménage · 3 gestes</button>' };
    var st = statutCourant(), enCoursP = paiementEnCoursIci(), jour = jourLocal();
    if(!enCoursP && (st.valeur === "essai" || st.valeur === "abonnee") && st.joursRestants !== null && st.joursRestants <= JOURS_AVIS_ECHEANCE && (st.source === "serveur" || st.accesFin) && !cacheAujourdhui("echeance")){
      var essai = st.valeur === "essai";
      var debutTexte = st.source === "local" ? "Votre accès finit le " : essai ? "Votre essai finit le " : "Votre abonnement finit le ";
      return { type: "echeance", rappel: true, html: pastilleRappel("echeance", "ouvrir-abonnement", "carte-echeance",
        debutTexte + dateFr(st.accesFin).slice(0, 5) + (st.dejaAbonnee ? " · Me réabonner" : " · M’abonner"), true) };
    }
    if(!enCoursP && st.valeur === "grace"){
      return { type: "grace", html: '<button type="button" class="mdc-pastille" data-mdc="ouvrir-abonnement" data-test="carte-grace">' +
        esc((st.dejaAbonnee ? "Abonnement terminé" : "Essai terminé") + " · encore " + joursLisibles(st.joursGrace) + " pour noter") + '</button>' };
    }
    if(enCoursP || st.valeur === "confiance") return { type: "verification", html: '<button type="button" class="mdc-pastille" data-mdc="ouvrir-abonnement" data-test="carte-verification">Paiement en cours de vérification</button>' };
    if(compte.merci && compte.merci.vu && compte.merci.le === jour && merciIci() && !cacheAujourdhui("paiement")){
      return { type: "paiement", rappel: true, html: pastilleRappel("paiement", "ouvrir-abonnement", "carte-merci", "Merci ! Abonnée jusqu’au " + dateFr(compte.merci.fin).slice(0, 5), true) };
    }
    if(inscriptionATerminer() && !cacheAujourdhui("inscription")) return { type: "inscription", rappel: true, html: pastilleRappel("inscription", "ouvrir-inscription", "carte-inscription", "Terminez votre inscription · 1 minute", true) };
    if(compte.id && !estConnecte()) return { type: "reconnexion", html: '<button type="button" class="mdc-pastille" data-mdc="ouvrir-reconnexion" data-test="carte-reconnexion">Reconnectez-vous · 1 minute</button>' };
    if(conditionsAAnnoncer()) return { type: "conditions", html: '<button type="button" class="mdc-pastille" data-mdc="lire-conditions-maj" data-test="carte-conditions">Conditions mises à jour · Lire</button>' };
    var n = joursSansSaisie();
    if(n >= JOURS_SANS_SAISIE && st.saisieOuverte && rappelSaisieIci() && !cacheAujourdhui("saisie")){
      return { type: "saisie", rappel: true, html: pastilleRappel("saisie", "rappel-noter", "carte-saisie", "Rien noté depuis " + n + " jours · Noter", true) };
    }
    if(joursSansSauvegarde() > JOURS_SANS_SAUVEGARDE && !cacheAujourdhui("sauvegarde")){
      return { type: "sauvegarde", rappel: true, html: pastilleRappel("sauvegarde", "rappel-sauvegarde", "carte-sauvegarde", "Sauvegardez vos données · 10 secondes", true) };
    }
    return null;
  }
  // Jours sans rien noter, jamais comptés avant le premier jour d'usage de
  // l'appli (installation). Une recette du soir compte comme une saisie.
  function joursSansSaisie(){
    var base = plusTardif(appel("derniereSaisie", null), appel("debutUsage", null));
    if(!base || !/^\d{4}-\d{2}-\d{2}$/.test(base)) return 0;
    return Math.max(0, ecartJours(base, jourLocal()));
  }
  // Jours depuis la dernière sauvegarde (en ligne ou en fichier), ou depuis le
  // premier jour d'usage s'il n'y en a jamais eu. 0 tant que rien n'est noté.
  function joursSansSauvegarde(){
    if(appel("etatVide", true) === true) return 0;
    var s = sauvegardeIci();
    var base = plusTardif(s.derniereLe || null, appel("derniereSauvegardeFichier", null)) || appel("debutUsage", null);
    if(!base || !/^\d{4}-\d{2}-\d{2}$/.test(base)) return 0;
    return Math.max(0, ecartJours(base, jourLocal()));
  }
  // Inscription faite avec le texte provisoire : une ligne, un seul jour, jamais bloquante.
  function conditionsAAnnoncer(){
    if(!compte.id || compte.conditionsVersion === CONDITIONS_VERSION) return false;
    var a = compte.conditionsAnnonce;
    if(a && (a.lue || a.le !== jourLocal())) return false;
    if(!a) modifierCompte(function(c){ c.conditionsAnnonce = { le: jourLocal(), lue: false }; });
    return true;
  }
  function ligneReglages(){
    if(!cfg) return "";
    chargerCompte();
    var c = couleursCarte();
    var pastille = '<i style="background:' + esc(c.haut) + ';color:' + esc(c.encre) + ';">';
    if(!compte.id && !compte.enAttente){
      return '<button type="button" class="mdc-reglage" data-mdc="ouvrir-inscription" data-test="reglage-compte">' + pastille + '+</i>' +
        '<span><b>Terminez votre inscription</b><small>1 minute</small></span><em aria-hidden="true">›</em></button>';
    }
    var nomComplet = (compte.prenom || "") + (compte.nom ? " " + compte.nom : "");
    return '<button type="button" class="mdc-reglage" data-mdc="ouvrir-compte" data-test="reglage-compte">' + pastille + esc((compte.prenom || "?").charAt(0).toUpperCase()) + '</i>' +
      '<span><b>' + esc(nomComplet) + '</b><small>' + esc(compte.id ? "Identifiant " + identifiantLisible(compte.id) : "Enregistrement en attente") + '</small></span><em aria-hidden="true">›</em></button>';
  }

  /* ---------- Vérifications appelées par l'appli après chaque rendu ---------- */
  function verifier(){
    if(!cfg) return;
    poserTheme();
    chargerCompte();
    // Chiffres retrouvés (copie de secours) pendant que l'écran 1 d'une
    // « nouvelle » installation était affiché, sans rien tapé : on le ferme.
    if(ecran && ecran.type === "inscription" && ((ecran.mode === "nouvelle" && ecran.etape === 1) || ecran.mode === "reconnue") && !ecran.touche && !ecran.occupe &&
       !ecran.feuille && appel("nouvelleInstallation", false) !== true){
      fermerEcran();
    }
    // « Merci ! Abonnée jusqu'au … » : dans Mon abonnement s'il est ouvert, sinon une feuille, appli au repos.
    // v4 : seulement dans une appli que la formule ouvre (l'autre appli le montrera).
    if(compte.merci && !compte.merci.vu && merciIci()){
      if(ecran && ecran.type === "abonnement" && !ecran.feuille){
        modifierCompte(function(c){ c.merci.vu = true; });
        ecran.vue = "formules";
        ecran.message = { texte: "Merci ! Abonnée jusqu’au " + dateFr(compte.merci.fin) + ".", ton: "ok" };
        dessiner();
      } else if(!ecran && appel("verrouille", false) !== true && appel("auRepos", true) === true){
        ecran = { type: "feuille", feuille: "merci" };
        dessinerFeuille();
        prevenirAppli();
        return;
      }
    }
    planifierSauvegardeAuto();
    // v3 : le guide se repose sur les éléments redessinés.
    if(guide){ positionnerGuide(); return; }
    // Notification touchée pendant qu'une feuille sans enjeu est ouverte : la feuille se ferme.
    if(memoire.ecranDemande && ecran && ecran.type === "feuille" && (ecran.feuille === "notifications" || ecran.feuille === "merci" || ecran.feuille === "conditions")){
      if(ecran.feuille === "merci") modifierCompte(function(c){ if(c.merci) c.merci.vu = true; });
      ecran = null;
      dessinerFeuille();
    }
    if(ecran) return;
    if(appel("nouvelleInstallation", false) === true){ memoire.premiereSeance = true; ouvrirInscription("nouvelle"); return; }
    if(memoire.ecranDemande && appel("verrouille", false) !== true){
      var demande = memoire.ecranDemande;
      memoire.ecranDemande = null;
      compter("notification.ouverte");
      appel("ouvrirEcran", null, demande);
      return;
    }
    if(memoire.guideDemande && appel("verrouille", false) !== true && appel("auRepos", true) === true){
      memoire.guideDemande = false;
      lancerGuide();
      return;
    }
    // v4 : la bulle du bouton de l'autre appli, s'il est apparu après le guide.
    if(!memoire.premiereSeance && lienVisible() && !(compte.lienVu && compte.lienVu[cfg.appli]) &&
       appel("verrouille", false) !== true && appel("auRepos", true) === true && document.querySelector('[data-mdc="autre-appli"]') !== null){
      if(lancerBulleLien()) return;
    }
    if(proposerNotificationsSiBesoin()) return;
    // Installation existante : l'inscription est proposée UNE fois, appli au repos.
    if(memoire.invitationTentee || !enLigne()) return;
    chargerCompte();
    if(!inscriptionATerminer() || compte.invitation[cfg.appli]) return;
    if(appel("verrouille", false) === true || appel("auRepos", true) !== true) return;
    memoire.invitationTentee = true;
    setTimeout(function(){
      chargerCompte();
      if(ecran || !inscriptionATerminer() || compte.invitation[cfg.appli]) return;
      if(appel("verrouille", false) === true || appel("auRepos", true) !== true){ memoire.invitationTentee = false; return; }
      ouvrirInscription("invitation");
    }, 500);
  }

  /* ---------- v3 : comptages anonymes (niveau 2) — mondjai_mesures_v1 ---------- */
  // Jamais de montant, de nom, de numéro ni de texte saisi : seulement des noms
  // de gestes ([a-z0-9_.], 40 caractères au plus) et des nombres. L'identifiant
  // de mesure est tiré au hasard sur le téléphone, rangé à part, sans aucun
  // lien avec le compte ; les envois partent avec la clé publique seule.
  var mesures = null;
  function chargerMesures(){
    var brut = lireStockage(CLE_MESURES), o = null;
    if(brut){ try{ o = JSON.parse(brut); }catch(e){ o = null; } }
    var m = { version: 1, idMesure: null, actif: true, jours: {}, erreurs: [], erreursDuJour: null };
    if(o && typeof o === "object"){
      if(typeof o.idMesure === "string" && /^[a-z0-9]{16,40}$/.test(o.idMesure)) m.idMesure = o.idMesure;
      m.actif = o.actif !== false;
      if(o.jours && typeof o.jours === "object" && !Array.isArray(o.jours)) m.jours = o.jours;
      if(Array.isArray(o.erreurs)) m.erreurs = o.erreurs;
      if(o.erreursDuJour && typeof o.erreursDuJour === "object") m.erreursDuJour = o.erreursDuJour;
    }
    mesures = m;
    return m;
  }
  function enregistrerMesures(){ ecrireStockage(CLE_MESURES, JSON.stringify(mesures)); }
  function idMesure(){
    if(!mesures.idMesure){ mesures.idMesure = hasard(LONGUEUR_ID_MESURE, ALPHABET_ID); enregistrerMesures(); }
    return mesures.idMesure;
  }
  function nomCompteur(nom){
    var s = String(nom === undefined || nom === null ? "" : nom).toLowerCase().replace(/[^a-z0-9_.]/g, "_").slice(0, 40);
    return /^[a-z0-9_.]{1,40}$/.test(s) ? s : null;
  }
  // Ajoute n (1 par défaut) au compteur du jour de cette appli.
  function compter(nom, n){
    if(!cfg) return;
    var k = nomCompteur(nom);
    if(!k) return;
    chargerMesures();
    if(!mesures.actif) return;
    var jour = jourLocal(), appli = cfg.appli, version = String(cfg.version || "").slice(0, 40);
    var j = mesures.jours[jour];
    if(!j || typeof j !== "object") j = mesures.jours[jour] = {};
    var a = j[appli];
    if(!a || typeof a !== "object" || !a.c) a = j[appli] = { v: version, c: {} };
    a.v = version;
    if(!Object.prototype.hasOwnProperty.call(a.c, k)){
      var nb = 0, x;
      for(x in a.c) if(Object.prototype.hasOwnProperty.call(a.c, x)) nb++;
      if(nb >= COMPTEURS_MAX) return;
      a.c[k] = 0;
    }
    var ajout = Math.round(Number(n === undefined ? 1 : n) || 0);
    if(ajout <= 0) return;
    a.c[k] = Math.min(VALEUR_COMPTEUR_MAX, (Number(a.c[k]) || 0) + ajout);
    idMesure();
    enregistrerMesures();
  }
  // Durée de saisie : du formulaire ouvert à l'enregistrement.
  var saisieEnCours = { debut: 0 };
  function debutSaisie(){ saisieEnCours.debut = maintenant(); }
  // Une saisie enregistrée (nom de la fonction, par exemple « saisie.soir »).
  function finSaisie(nomFonction){
    var d = saisieEnCours.debut ? Math.round((maintenant() - saisieEnCours.debut) / 1000) : 0;
    saisieEnCours.debut = 0;
    compter("saisies");
    if(d > 0) compter("saisie.duree_s", Math.min(d, DUREE_SAISIE_MAX_S));
    compter("heure." + new Date(maintenant()).getHours());
    if(nomFonction) compter("fonction." + nomFonction);
    // Le serveur doit connaître le jour de la dernière saisie (jamais un montant)
    // pour ne pas envoyer « Rien noté » à tort : une fois par jour au plus.
    chargerCompte();
    var n = notifsIci();
    if(n && n.autorisees && n.endpoint && rappelSaisieIci() && n.saisieEnvoyee !== jourLocal()){
      modifierCompte(function(c){ majNotifsIci(c, { saisieEnvoyee: jourLocal() }); });
      envoyerAppareil(true);
    }
  }
  // Les compteurs des jours passés, une fois par jour (au premier lancement).
  // Hors ligne, gardés 30 jours au plus : les plus vieux sont abandonnés.
  function purgerMesures(){
    var aujourdhui = jourLocal(), k, change = false;
    for(k in mesures.jours){
      if(!Object.prototype.hasOwnProperty.call(mesures.jours, k)) continue;
      if(!/^\d{4}-\d{2}-\d{2}$/.test(k) || ecartJours(k, aujourdhui) > JOURS_MESURES_GARDES){ delete mesures.jours[k]; change = true; }
    }
    if(change) enregistrerMesures();
  }
  function envoyerMesures(suite){
    if(!cfg || enCours.mesures){ if(suite) suite(); return; }
    chargerMesures();
    purgerMesures();
    if(!mesures.actif || !enLigne()){ if(suite) suite(); return; }
    var aujourdhui = jourLocal(), jours = [], k, change = false;
    for(k in mesures.jours){
      if(!Object.prototype.hasOwnProperty.call(mesures.jours, k)) continue;
      if(!/^\d{4}-\d{2}-\d{2}$/.test(k) || ecartJours(k, aujourdhui) > JOURS_MESURES_GARDES){ delete mesures.jours[k]; change = true; }
      else if(k < aujourdhui && mesures.jours[k] && mesures.jours[k][cfg.appli]) jours.push(k);
    }
    if(change) enregistrerMesures();
    jours.sort();
    var a = decrireAppareil();
    enCours.mesures = true;
    (function suivant(){
      if(!jours.length){ enCours.mesures = false; envoyerErreurs(suite); return; }
      var jour = jours.shift();
      chargerMesures();
      var e = mesures.jours[jour] && mesures.jours[jour][cfg.appli];
      if(!e){ suivant(); return; }
      var parametres = { p_id_mesure: idMesure(), p_appli: cfg.appli, p_version: e.v || String(cfg.version || "").slice(0, 40), p_jour: jour,
        p_compteurs: e.c || {}, p_marque: a.marque, p_systeme: a.systeme };
      appelerFonction("envoyer_mesures", parametres, { anonyme: true }, function(err){
        if(estPanne(err)){ enCours.mesures = false; if(suite) suite(); return; }
        // Reçu, ou refusé pour de bon : on ne le renvoie plus.
        chargerMesures();
        if(mesures.jours[jour]){ delete mesures.jours[jour][cfg.appli]; var reste = false, x; for(x in mesures.jours[jour]) if(Object.prototype.hasOwnProperty.call(mesures.jours[jour], x)) reste = true; if(!reste) delete mesures.jours[jour]; }
        enregistrerMesures();
        suivant();
      });
    })();
  }
  // Erreurs JavaScript : message (300 caractères, sans suite de chiffres ni
  // adresse), écran, version ; 20 par jour au plus ; gardées hors ligne.
  function nettoyerMessage(m){
    return String(m === undefined || m === null ? "?" : m).replace(/[0-9]{6,}/g, "#").replace(/[^\s@]+@[^\s@]+/g, "@").replace(/\s+/g, " ").slice(0, MESSAGE_ERREUR_MAX);
  }
  function signalerErreur(message, ecranNom){
    if(!cfg) return;
    chargerMesures();
    if(!mesures.actif) return;
    var jour = jourLocal(), ed = mesures.erreursDuJour;
    if(!ed || ed.jour !== jour) ed = { jour: jour, n: 0 };
    if(ed.n >= ERREURS_PAR_JOUR) return;
    ed.n++;
    mesures.erreursDuJour = ed;
    var a = decrireAppareil();
    mesures.erreurs.push({ appli: cfg.appli, version: String(cfg.version || "").slice(0, 40), message: nettoyerMessage(message),
      ecran: nomCompteur(ecranNom) || null, systeme: a.systeme, navigateur: a.navigateur, le: maintenant() });
    while(mesures.erreurs.length > ERREURS_PAR_JOUR) mesures.erreurs.shift();
    idMesure();
    enregistrerMesures();
    setTimeout(function(){ envoyerErreurs(); }, 0);
  }
  function envoyerErreurs(suite){
    if(!cfg || enCours.erreurs || !enLigne()){ if(suite) suite(); return; }
    chargerMesures();
    if(!mesures.actif || !mesures.erreurs.length){ if(suite) suite(); return; }
    enCours.erreurs = true;
    (function suivant(){
      chargerMesures();
      var e = mesures.erreurs[0];
      if(!e){ enCours.erreurs = false; if(suite) suite(); return; }
      appelerFonction("signaler_erreur", { p_id_mesure: idMesure(), p_appli: e.appli, p_version: e.version, p_message: e.message,
        p_ecran: e.ecran, p_systeme: e.systeme, p_navigateur: e.navigateur }, { anonyme: true }, function(err){
        if(estPanne(err)){ enCours.erreurs = false; if(suite) suite(); return; }
        chargerMesures();
        if(mesures.erreurs.length && mesures.erreurs[0].le === e.le && mesures.erreurs[0].message === e.message) mesures.erreurs.shift();
        enregistrerMesures();
        suivant();
      });
    })();
  }
  function surErreurJs(ev){
    if(memoire.dansErreur) return;
    memoire.dansErreur = true;
    try{
      var m = ev && (ev.message || (ev.error && ev.error.message)) || "erreur";
      var lieu = ev && ev.lineno ? " (ligne " + ev.lineno + ")" : "";
      signalerErreur(String(m) + lieu, appel("ecranCourant", ""));
    }catch(e){}
    memoire.dansErreur = false;
  }
  function surRejet(ev){
    if(memoire.dansErreur) return;
    memoire.dansErreur = true;
    try{
      var r = ev ? ev.reason : null;
      signalerErreur("Promesse rejetée : " + (r && r.message ? r.message : String(r)), appel("ecranCourant", ""));
    }catch(e){}
    memoire.dansErreur = false;
  }
  // Réglages › À propos › « Aider à améliorer MonDjai » (activé par défaut).
  function reglageAiderAmeliorer(){
    if(!cfg) return "";
    chargerMesures();
    return '<div class="mdc-sel" data-test="aider-ameliorer">' +
      '<button type="button" class="mdc-rang" role="switch" data-mdc="mesures-bascule" data-test="mesures-bascule" aria-checked="' + !!mesures.actif + '">Aider à améliorer MonDjai<i class="mdc-inter"></i></button>' +
      '<p>Nous comptons les gestes, jamais vos chiffres ni votre nom.</p></div>';
  }

  /* ---------- v3 : notifications appli fermée (Web Push) ---------- */
  function pushPresent(){
    try{ return !!(navigator.serviceWorker && window.PushManager && window.Notification && window.Uint8Array && typeof Promise === "function"); }
    catch(e){ return false; }
  }
  function surIphone(){ var a = decrireAppareil(); return a.marque === "iPhone" || a.marque === "iPad" || /^iOS/.test(a.systeme || ""); }
  function permissionNotifications(){
    try{ return window.Notification && window.Notification.permission ? window.Notification.permission : "default"; }catch(e){ return "default"; }
  }
  // v4 : appli ouverte hors de son adresse https (fichier reçu par WhatsApp,
  // adresse content://…) : le navigateur n'y permet jamais les notifications.
  function adresseSure(){
    try{
      if(window.isSecureContext === false) return false;
      var p = String(location.protocol || "");
      return p === "https:" || (p === "http:" && /^(localhost|127\.0\.0\.1)$/.test(String(location.hostname || "")));
    }catch(e){ return true; }
  }
  // { possible, raison: "" | "adresse" | "absent" | "iphone" | "refuse", actives }
  function etatNotifications(){
    chargerCompte();
    var n = notifsIci() || {};
    if(!adresseSure()) return { possible: false, raison: "adresse", actives: false };
    if(surIphone() && !decrireAppareil().installee) return { possible: false, raison: "iphone", actives: false };
    if(!pushPresent()) return { possible: false, raison: "absent", actives: false };
    var p = permissionNotifications();
    if(p === "denied") return { possible: false, raison: "refuse", actives: false };
    return { possible: true, raison: "", actives: p === "granted" && n.autorisees === true && !!n.endpoint };
  }
  function messageNotifications(raison){
    if(raison === "adresse") return "Ouvrez MonDjai depuis son adresse pour recevoir les notifications.";
    if(raison === "iphone") return "Sur iPhone : ajoutez d’abord l’appli à l’écran d’accueil.";
    if(raison === "refuse") return "Refusées dans les réglages du téléphone.";
    if(raison === "absent") return "Ce téléphone ne permet pas les notifications.";
    if(raison === "inscription") return "Terminez votre inscription pour les recevoir.";
    return "Les notifications n’ont pas pu être activées.";
  }
  // Ce que le serveur garde avec l'appareil (p_push) : null = rien à changer.
  // Le jour de la dernière saisie (jamais un montant) sert seulement au rappel
  // « Rien noté », et seulement si ce rappel est activé.
  function pushPourServeur(){
    var n = notifsIci();
    if(!n || n.autorisees === undefined) return null;
    if(!n.autorisees || !n.endpoint || !n.cles) return { actif: false };
    var saisie = rappelSaisieIci();
    var o = { actif: true, endpoint: n.endpoint, keys: { p256dh: n.cles.p256dh, auth: n.cles.auth }, appli: cfg.appli, saisie: saisie };
    if(saisie){
      var jour = plusTardif(appel("derniereSaisie", null), appel("debutUsage", null));
      if(jour && /^\d{4}-\d{2}-\d{2}$/.test(jour)) o.derniere_saisie = jour;
    }
    return o;
  }
  function enregistrementSw(suite){
    var fini = false, t = null;
    function rendre(r){ if(fini) return; fini = true; if(t) clearTimeout(t); suite(r); }
    try{
      if(!navigator.serviceWorker || !navigator.serviceWorker.ready){ rendre(null); return; }
      t = setTimeout(function(){ rendre(null); }, DELAI_DEMANDE_SW_MS);
      navigator.serviceWorker.ready.then(function(reg){ rendre(reg || null); }, function(){ rendre(null); });
    }catch(e){ rendre(null); }
  }
  // Abonnement Web Push (clé publique VAPID), puis envoi à enregistrer_appareil.
  function abonnerPush(suite){
    enregistrementSw(function(reg){
      if(!reg || !reg.pushManager){ suite(false, "absent"); return; }
      try{
        reg.pushManager.getSubscription().then(function(sub){
          return sub || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: depuisBase64(VAPID_CLE_PUBLIQUE) });
        }).then(function(sub){
          var j = sub && typeof sub.toJSON === "function" ? sub.toJSON() : null;
          if(!j || !j.endpoint || !j.keys || !j.keys.p256dh || !j.keys.auth){ suite(false, "erreur"); return; }
          modifierCompte(function(c){
            majNotifsIci(c, { autorisees: true, endpoint: j.endpoint, cles: { p256dh: j.keys.p256dh, auth: j.keys.auth }, le: jourLocal() });
          });
          envoyerAppareil(true);
          suite(true, "");
        }, function(){ suite(false, "erreur"); });
      }catch(e){ suite(false, "erreur"); }
    });
  }
  // Demande du téléphone (après un toucher) ; suite(ok, raison).
  function demanderNotifications(suite){
    var et = etatNotifications();
    if(!et.possible){ suite(false, et.raison); return; }
    chargerCompte();
    if(!estInscrit() || !estConnecte()){ suite(false, "inscription"); return; }
    modifierCompte(function(c){ majNotifsIci(c, { demandeesLe: jourLocal() }); });
    var repondu = false;
    function reponse(p){
      if(repondu) return;
      repondu = true;
      if(p === "granted"){ abonnerPush(suite); return; }
      // Refus, ou fenêtre fermée sans réponse : pas de nouvelle demande avant 30 jours.
      modifierCompte(function(c){ majNotifsIci(c, { autorisees: false, refuseeLe: jourLocal() }); });
      suite(false, p === "denied" ? "refuse" : "plus_tard");
    }
    try{
      var r = window.Notification.requestPermission(function(p){ reponse(p); });   // ancien Safari
      if(r && typeof r.then === "function") r.then(reponse, function(){ reponse("default"); });
    }catch(e){ suite(false, "erreur"); }
  }
  function desactiverNotifications(){
    modifierCompte(function(c){ majNotifsIci(c, { autorisees: false, endpoint: null, cles: null }); });
    enregistrementSw(function(reg){
      try{ if(reg && reg.pushManager) reg.pushManager.getSubscription().then(function(s){ if(s) s.unsubscribe(); }, function(){}); }catch(e){}
    });
    envoyerAppareil(true);
  }
  // À l'ouverture : l'abonnement est-il toujours là, et toujours le même ?
  function maintenirAbonnementPush(){
    chargerCompte();
    var n = notifsIci();
    if(!n || !n.autorisees || !pushPresent()) return;
    if(permissionNotifications() !== "granted"){
      modifierCompte(function(c){ majNotifsIci(c, { autorisees: false, endpoint: null, cles: null }); });
      envoyerAppareil(true);
      return;
    }
    enregistrementSw(function(reg){
      if(!reg || !reg.pushManager) return;
      try{
        reg.pushManager.getSubscription().then(function(sub){
          var j = sub && typeof sub.toJSON === "function" ? sub.toJSON() : null;
          chargerCompte();
          if(!j || !j.endpoint){ abonnerPush(function(){}); return; }
          var ni = notifsIci();
          if(j.endpoint !== (ni && ni.endpoint)){
            modifierCompte(function(c){ majNotifsIci(c, { endpoint: j.endpoint, cles: { p256dh: j.keys.p256dh, auth: j.keys.auth } }); });
            envoyerAppareil(true);
          }
        }, function(){});
      }catch(e){}
    });
  }
  // Proposée une fois, appli au repos, jamais pendant la séance de
  // l'inscription (la nouvelle venue voit d'abord le guide) ; un refus est

  // Mesure l'élément après chaque rendu : la bulle se pose dessous s'il y a la

  // à l'écran, donc « Suivant » jamais caché.
  function positionnerGuide(){
    if(!guide || !guide.el) return;
    var zone = guide.el.firstChild, bulle = guide.el.lastChild, MARGE = 10, ECART = 6;
    var H = window.innerHeight || document.documentElement.clientHeight || 640;
    var W = window.innerWidth || document.documentElement.clientWidth || 360;

        try{ cible.scrollIntoView({ block: "center" }); }catch(e){ try{ cible.scrollIntoView(); }catch(e2){} }
        r = cible.getBoundingClientRect();

    }

    if(r){
      zone.style.display = "block";
      zone.style.top = Math.round(r.top - ECART) + "px";
      zone.style.left = Math.round(r.left - ECART) + "px";
      zone.style.width = Math.round(r.width + 2 * ECART) + "px";
      zone.style.height = Math.round(r.height + 2 * ECART) + "px";

    var largeur = Math.min(W - 2 * MARGE, 340);
    var gauche = r ? r.left + r.width / 2 - largeur / 2 : (W - largeur) / 2;
    gauche = Math.max(MARGE, Math.min(gauche, W - largeur - MARGE));

    bulle.style.left = Math.round(gauche) + "px";
