    }).then(function(){
      marquerSauvegardeReussie("Sauvegarde enregistrée.");
    }).catch(function(err){
      if(err && err.name === "AbortError"){
        // L'utilisatrice a annulé la boîte de dialogue : choix délibéré, on ne
        // force pas de second téléchargement et on ne signale pas d'erreur.
        return;
      }
      // Tout autre échec (permission refusée, navigateur capricieux…) : jamais
      // laisser l'utilisatrice sans sauvegarde — repli automatique et silencieux.
      exporterJsonTelechargementDirect(contenu, filename);
    });
  }

  function importerJsonDepuisFichier(file, callback){
    if(!file){ callback(false); return; }
    var reader = new FileReader();
    reader.onload = function(){
      var parsed;
      try{ parsed = JSON.parse(reader.result); }catch(e){ callback(false); return; }
      state = normaliserEtatImporte(parsed);
      saveState();
      callback(true);
    };
    reader.onerror = function(){ callback(false); };
    reader.readAsText(file);
  }

  /* ================= UI (non persisté) ================= */

  var ui = {
    tab: "aujourdhui",
    overlay: null,       // null | 'reglages' | 'apropos' | 'objectif' | 'telecharger'
    modal: null,
    draft: {},
    errors: {},
    pendingAutofocus: false,
    locked: false,
    codeAccesInput: "",
    codeAccesErreur: "",
    objDraft: null,
    etatPeriode: "jour",
    etatSemaineRef: null,
    etatMoisRef: null,

  /* ================= Sprint Revente-F : thème clair / automatique / sombre ================= */
  // Repris de MonDjai/Coiffure (Sprint 8D). Le choix est lu à la volée
  // (absent ou inconnu = « clair ») : charger un état du Sprint E ne réécrit
  // rien ; seul un choix dans Réglages l'enregistre. Le thème appliqué
  // (data-theme="clair" | "sombre" sur <html>) est déjà posé par le script de
  // <head> avant le premier affichage ; il est ensuite tenu à jour ici (choix
  // dans Réglages, réglage du téléphone en Automatique), sans rechargement.
  var CHOIX_THEMES = ["clair", "auto", "sombre"];
  function choixTheme(){
    var t = state && state.config ? state.config.theme : null;
    return CHOIX_THEMES.indexOf(t) !== -1 ? t : "clair";

  function telephoneEnSombre(){
    try{ return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches); }catch(e){ return false; }
  }
  function themeApplique(){
    var c = choixTheme();
    return (c === "sombre" || (c === "auto" && telephoneEnSombre())) ? "sombre" : "clair";
  }
  function appliquerTheme(){
    var t = themeApplique();
    var html = document.documentElement;
    if(html.getAttribute("data-theme") !== t) html.setAttribute("data-theme", t);
    majCouleurBarreSysteme();

  // meta theme-color (barre d'état du téléphone) : sombre en thème sombre ;
  // en clair, la couleur du bandeau MonDjai quand l'écran en a un, sinon le
  // fond clair (code d'accès, PIN, Objectif, À propos, Télécharger).
  function majCouleurBarreSysteme(){
    var meta = document.querySelector('meta[name="theme-color"]');
    if(!meta) return;
    var c = document.documentElement.getAttribute("data-theme") === "sombre" ? "#11141a"

  // Automatique : suit en direct le réglage clair / sombre du téléphone.
  function suivreThemeTelephone(){
    try{
      if(!window.matchMedia) return;
      var mq = window.matchMedia("(prefers-color-scheme: dark)");
      var surChangement = function(){ if(choixTheme() === "auto") appliquerTheme(); };
      if(mq.addEventListener) mq.addEventListener("change", surChangement);
      else if(mq.addListener) mq.addListener(surChangement);

  // Bandeau MonDjai d'Aujourd'hui (thème clair) : il descend derrière le titre
  // et ~60 px dans les deux tuiles du haut (au plus la moitié d'une tuile) —

  function majBandeauAujourdhui(){
    var main = document.querySelector("#app > .main.ecran-aujourdhui");

    for(var i = 0; i < main.children.length; i++){
      if(main.children[i].classList.contains("dash-grid")){ grille = main.children[i]; break; }
    }
    var tuile = grille ? grille.querySelector(".dash-block") : null;
    if(!tuile) return;
    var h = Math.round(tuile.getBoundingClientRect().top - main.getBoundingClientRect().top + Math.min(60, tuile.offsetHeight / 2));
    if(h > 0) main.style.setProperty("--bandeau-h", h + "px");

  // Sprint Revente-E — transitions courtes. L'application redessine tout
  // l'écran à chaque toucher : une animation posée sur les éléments eux-mêmes
  // se rejouerait donc à chaque redessin (ex. toucher « Une autre source »
  // dans un formulaire). On compare plutôt la « scène » affichée à celle du
  // rendu précédent, et on n'ajoute une classe d'animation (CSS, 150–200 ms)
  // que lors d'un VRAI changement : écran / onglet / écran secondaire (fondu +
  // léger glissement), sous-vue de l'onglet Achats, ouverture d'une feuille
  // du bas (la feuille monte, le fond s'assombrit en fondu) ou passage d'une
  // feuille à une autre (fondu du contenu). Rien au tout premier affichage,
  // et rien du tout si le téléphone demande un mouvement réduit.
  var derniereScene = null;
  function sceneCourante(){
    if(estEcranPorte()){
      return { ecran: ui.locked && state.config.codeAccesOk && !accesMensuelExpire() ? "porte-pin" : "porte-code", vue: "",
        modale: ui.modal ? ui.modal.type + ":" + (ui.modal.id || "") : null };
    }
    var ecran = ui.overlay ? "overlay:" + ui.overlay : "onglet:" + ui.tab;
    var vue = (!ui.overlay && ui.tab === "achatvente") ? vueAchatVente() : "";
    return { ecran: ecran, vue: vue, modale: ui.modal ? ui.modal.type + ":" + (ui.modal.id || "") : null };
  }
  function mouvementReduit(){
    try{ return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); }catch(e){ return false; }
  }
  function ajouterClasse(liste, classe){
    Array.prototype.forEach.call(liste, function(el){ if(el) el.classList.add(classe); });
  }
  function animerSiChangementDeScene(){
    var s = sceneCourante();
    var avant = derniereScene;
    derniereScene = s;
    if(!avant || mouvementReduit()) return;
    if(s.ecran !== avant.ecran){
      ajouterClasse(document.querySelectorAll("#app > .main, #app > .onb, #app > .overlay-back, #app > .overlay-body"), "anim-ecran");
    } else if(s.vue !== avant.vue){
      ajouterClasse(document.querySelectorAll("#app .sous-vue"), "anim-ecran");
    }
    if(s.modale && s.modale !== avant.modale){
      var fond = document.querySelector("#app > .modal-overlay");
      if(!fond) return;
      if(!avant.modale) fond.classList.add("anim-in");
      else ajouterClasse([fond.querySelector(".modal")], "anim-swap");

  /* ================= Écran « Code d'accès » ================= */
  // Sprint Revente-A : code initial partagé. Sprint Revente-B : accès mensuel
  // à bornes calendaires (voir plus bas), sur le modèle exact de Coiffure
  // Sprint 5B — même écran, seul le sous-titre change selon le mode.

  var CODE_ACCES_ATTENDU = "HKETCK";
  function normaliserCode(s){
    return String(s||"").toUpperCase().replace(/\s+/g,"");
  }

  // ----- Accès mensuel calendaire (Sprint Revente-B, repris de Coiffure 5B) -----

  // Secret propre à Revente, jamais interchangeable avec celui de Coiffure
  // (MDJ-COIFFURE-2026-R4XN) ni de Salon F (MDJ-SALONF-2026-K7QT). Utilisé
  // également par l'outil séparé outil-code-mensuel-revente.html (non livré
  // aux utilisatrices) pour calculer les codes de réabonnement — toute
  // modification future du secret ou de l'algorithme dans l'un des deux
  // fichiers doit être répercutée à l'identique dans l'autre.
  var SECRET_MENSUEL_REVENTE = "MDJ-REVENTE-2026-T8VM";
  var LETTRES_CODE_MENSUEL = "ABCDEFGHJKLMNPQRSTUVWXYZ";

  function hashFnv1a(str){
    var h = 2166136261;
    for(var i=0;i<str.length;i++){
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }
  function fmix32(h){
    h ^= h >>> 16;
    h = Math.imul(h, 0x85ebca6b) >>> 0;
    h ^= h >>> 13;
    h = Math.imul(h, 0xc2b2ae35) >>> 0;
    h ^= h >>> 16;
    return h >>> 0;
  }
  function codeAccesDuMois(mois, annee, secret){
    var base = String(secret) + "|" + String(annee) + "-" + pad2(mois) + "|";
    var code = "";
    for(var i=0;i<6;i++){
      var h = fmix32(hashFnv1a(base + i));
      code += LETTRES_CODE_MENSUEL.charAt(h % LETTRES_CODE_MENSUEL.length);
    }
    return code;
  }
  function codeAccesDuMoisAttenduAujourdhui(){
    var d = new Date();
    return codeAccesDuMois(d.getMonth()+1, d.getFullYear(), SECRET_MENSUEL_REVENTE);
  }

  // Parse une date "YYYY-MM-DD" (format utilisé par todayStr/meta.creation) en
  // objet Date local — jamais via `new Date(chaine)`, qui peut être interprété
  // en UTC selon le moteur et décaler le jour d'une unité près de minuit.
  function parseDateStr(s){
    if(!s) return null;
    var parts = String(s).split("-");
    if(parts.length !== 3) return null;
    var y = parseInt(parts[0],10), m = parseInt(parts[1],10), d = parseInt(parts[2],10);
    if(!y || !m || !d) return null;
    return new Date(y, m-1, d);
  }
  function moisSuivant(mois, annee){
    mois = mois + 1;
    if(mois > 12){ mois = 1; annee = annee + 1; }
    return { mois: mois, annee: annee };
  }
  // Compare deux { mois, annee } : négatif si a < b, positif si a > b, 0 si égal.
  function compareMoisAnnee(a, b){
    if(a.annee !== b.annee) return a.annee - b.annee;
    return a.mois - b.mois;
  }
  // Installation avant le 15 du mois → essai jusqu'à la fin de ce même mois
  // civil ; à partir du 15 → essai jusqu'à la fin du mois civil suivant
  // (garantit dans tous les cas au moins deux semaines pleines d'essai).
  function finEssaiPourInstallation(dateInstallation){
    var jour = dateInstallation.getDate();
    var mois = dateInstallation.getMonth()+1;
    var annee = dateInstallation.getFullYear();
    if(jour < 15) return { mois: mois, annee: annee };
    return moisSuivant(mois, annee);
  }
  // Accès expiré dès que le mois civil en cours dépasse le dernier mois
  // couvert (`moisAccesValide`). Comme pour le code d'accès initial : aucune
  // donnée n'est jamais supprimée pendant qu'un renouvellement est en attente,
  // seul l'accès est bloqué.
  function accesMensuelExpire(){
    if(!state.config.codeAccesOk) return false;
    var couverture = state.config.moisAccesValide;
    if(!couverture) return false; // état inattendu (migration en attente) : ne jamais bloquer par sécurité
    var d = new Date();
    var actuel = { mois: d.getMonth()+1, annee: d.getFullYear() };
    return compareMoisAnnee(actuel, couverture) > 0;
  }

  function renderCodeAcces(mode){

  function handlePinKey(prefix, val){

          '<button type="button" class="icon-btn" data-action="ouvrir-telecharger" aria-label="Télécharger" data-test="bouton-telecharger">📤</button>' +
        '</div>' +
      '</div>'
    );
  }

  function renderEpargneShortcut(){
    var epargne = state.objectifEpargne ? epargneJour(todayStr()) : 0;
    var val = state.objectifEpargne ? formatFCFA(epargne) : "Aucun";

        '<span class="es-emoji">' + esc(epargneEmoji()) + '</span><span class="es-val">' + esc(val) + '</span>' +
      '</button>'
    );
  }

  function renderTabBar(){
    var items = TAB_DEFS.map(function(t){
      return (
        '<button type="button" class="tab' + (ui.tab===t.key?" active":"") + '" data-action="go-tab" data-tab="' + t.key + '">' +

  }

  function renderMain(){
    var body = "";
    switch(ui.tab){
      case "aujourdhui": body = renderAujourdhui(); break;
      case "achatvente": body = renderAchatVente(); break;

  // Sprint Revente-F : un seul bouton « + » dans Achat/Vente — nouvelle vente
  // sur la vue Ventes, nouvel achat sur Achats et Stock (comme au Sprint E).
  // Sprint Revente-F (2) : aussi sur Aujourd'hui, pour la saisie rapide d'une
  // vente à une cliente (le formulaire s'ouvre, on reste sur Aujourd'hui).
  function renderFab(){
    if(ui.tab === "aujourdhui"){
      return '<button type="button" class="fab fab-aujourdhui" data-action="add-vente" aria-label="Nouvelle vente" data-test="fab-aujourdhui">+</button>';

  }

  /* ================= Calculs de dates/périodes ================= */

  function sortByDateDesc(arr){
    return arr.slice().sort(function(a,b){
      if(a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.ts||0) - (a.ts||0);
    });
  }
  function dateFromStr(s){
    var p = s.split("-");
    return new Date(+p[0], +p[1]-1, +p[2]);
  }
  function dateKey(d){ return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()); }
  // Sprint Revente-C — correctif : ces deux définitions avaient été omises au
  // fork depuis Coiffure (ReferenceError sur tous les onglets « Mois »).
  var MOIS_NOMS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  function moisLabelFor(d){ return MOIS_NOMS[d.getMonth()] + " " + d.getFullYear(); }
  function moisLabelMaj(d){ var s = moisLabelFor(d); return s.charAt(0).toUpperCase() + s.slice(1); }

  function getDayRange(d){ var k = dateKey(d); return { start:k, end:k }; }
  function getWeekRange(d){
    var day = d.getDay();
    var diffLundi = (day === 0) ? -6 : (1 - day);
    var lundi = new Date(d); lundi.setDate(d.getDate() + diffLundi);
    var dimanche = new Date(lundi); dimanche.setDate(lundi.getDate() + 6);
    return { start: dateKey(lundi), end: dateKey(dimanche) };
  }
  function getMonthRange(d){
    var premier = new Date(d.getFullYear(), d.getMonth(), 1);
    var dernier = new Date(d.getFullYear(), d.getMonth()+1, 0);
    return { start: dateKey(premier), end: dateKey(dernier) };
  }
  function rangeForPeriode(periode, ref){
    if(periode === "semaine") return getWeekRange(ref);
    if(periode === "mois") return getMonthRange(ref);
    return getDayRange(ref);
  }
  function inRange(dateStr, range){ return !!dateStr && dateStr >= range.start && dateStr <= range.end; }
  function filterRange(arr, range){ return arr.filter(function(x){ return inRange(x.date, range); }); }
  function sumBy(arr, fn){ return arr.reduce(function(s,x){ return s + (Number(fn(x)) || 0); }, 0); }

  function allActivityDates(){
    var set = {};
    state.achats.forEach(function(a){ if(a.date) set[a.date] = 1; });
    state.ventes.forEach(function(v){ if(v.date) set[v.date] = 1; });
    state.autresCharges.forEach(function(c){ if(c.date) set[c.date] = 1; });
    return Object.keys(set).sort();
  }
  function earliestActivityWeekStart(){
    var dates = allActivityDates();
    if(!dates.length) return getWeekRange(new Date()).start;
    return getWeekRange(dateFromStr(dates[0])).start;
  }
  function earliestActivityMonthStart(){
    var dates = allActivityDates();
    if(!dates.length) return getMonthRange(new Date()).start;
    return getMonthRange(dateFromStr(dates[0])).start;
  }

  // ----- Navigation précédent / suivant, commune à tous les écrans à période -----
  // Sprint Revente-C : les références (ex. ui.etatMoisRef) peuvent être n'importe
  // quel jour de la période (au départ : aujourd'hui). Les bornes sont donc
  // toujours comparées sur le DÉBUT de la période — sinon le bouton « précédent »
  // restait actif sur la toute première période avec données et ne menait nulle
  // part. Bornes : la période de la toute première donnée enregistrée, et la
  // période en cours (jamais de navigation dans le futur).
  function debutPeriode(periode, refStr){
    var d = dateFromStr(refStr);
    return periode === "semaine" ? getWeekRange(d).start : getMonthRange(d).start;
  }
  function bornesPeriode(periode, refStr){
    var debut = debutPeriode(periode, refStr);
    var actuelle = periode === "semaine" ? getWeekRange(new Date()).start : getMonthRange(new Date()).start;
    var premiere = periode === "semaine" ? earliestActivityWeekStart() : earliestActivityMonthStart();
    return { estPremiere: debut <= premiere, estActuelle: debut >= actuelle };
  }
  function decalerPeriode(periode, refStr, delta){
    var d = dateFromStr(debutPeriode(periode, refStr));
    if(periode === "semaine") d.setDate(d.getDate() + 7*delta);
    else d.setMonth(d.getMonth() + delta);
    var nouveau = dateKey(d);
    var actuelle = periode === "semaine" ? getWeekRange(new Date()).start : getMonthRange(new Date()).start;
    var premiere = periode === "semaine" ? earliestActivityWeekStart() : earliestActivityMonthStart();
    if(nouveau > actuelle) nouveau = actuelle;
    if(nouveau < premiere) nouveau = premiere;
    return nouveau;
  }
  function libellePeriode(periode, refStr){
    if(periode === "semaine"){
      var r = getWeekRange(dateFromStr(refStr));
      return formatDateFr(r.start) + " – " + formatDateFr(r.end);
    }
    if(periode === "mois") return moisLabelMaj(dateFromStr(refStr));
    return formatDateFr(refStr);
  }
  // Barre ‹ libellé › — `action` reçoit data-sens (-1/1) et data-periode.
  function renderNavPeriode(action, periode, refStr){
    var b = bornesPeriode(periode, refStr);
    return (
      '<div class="etat-nav">' +
        '<button type="button" class="en-btn" data-action="' + action + '" data-sens="-1" data-periode="' + periode + '"' + (b.estPremiere?" disabled":"") + ' aria-label="Période précédente">‹</button>' +
        '<div class="en-label">' + esc(libellePeriode(periode, refStr)) + '</div>' +
        '<button type="button" class="en-btn" data-action="' + action + '" data-sens="1" data-periode="' + periode + '"' + (b.estActuelle?" disabled":"") + ' aria-label="Période suivante">›</button>' +
      '</div>'
    );
  }
  function formatQte(n){
    var r = Math.round((Number(n)||0) * 100) / 100;
    return String(r).replace(".", ",");
  }
  // Un jour est "actif" (pour le mode Manuel de l'épargne) dès qu'un achat ou
  // une vente y a été enregistré.
  function joursActifsDansPeriode(range){
    var set = {};
    state.achats.forEach(function(a){ if(inRange(a.date, range)) set[a.date] = 1; });
    state.ventes.forEach(function(v){ if(inRange(v.date, range)) set[v.date] = 1; });
    return Object.keys(set).length;
  }

  function chargesCommunesTotal(range){
    return sumBy(filterRange(state.autresCharges, range), function(c){ return c.montant; });
  }

  /* ================= F4 : Suivi de stock (repris de Salon F) ================= */

  var SEUIL_REASSORT_DEFAUT = 3;

  /* ---------- Sprint Revente-D : montant comptabilisé d'une vente ---------- */
  // FONCTION UNIQUE, utilisée partout où des ventes sont additionnées (et dans
  // les listes, pour que chaque liste corresponde au total affiché au-dessus) :
  //  - vente « depuis le stock » → le montant encaissé ;
  //  - commande spéciale → montant encaissé − prix payé au revendeur : seule la
  //    marge entre dans la comptabilité. Le prix payé au revendeur est de
  //    l'argent « en transit » : il vient de la cliente et repart aussitôt chez
  //    le revendeur (ex. encaissé 10 000, revendeur 7 000 → 3 000 comptabilisés).
  // Les données enregistrées (montantEncaisse, prixPayeRevendeur) ne changent
  // pas : seul le calcul change.
  function estCommandeSpeciale(v){ return v.typeVente === "commande_speciale"; }
  function montantComptabiliseVente(v){
    var encaisse = Number(v.montantEncaisse) || 0;
    if(estCommandeSpeciale(v)) return encaisse - (Number(v.prixPayeRevendeur) || 0);
    return encaisse;
  }
  // Bénéfice réalisé d'une vente = montant comptabilisé − coût des paquets
  // sortis du stock (quantité × coût moyen d'achat). Une commande spéciale ne
  // sort rien du stock : son bénéfice est sa marge, déjà comptabilisée.
  function beneficeVente(v, coutMoyen){
    if(estCommandeSpeciale(v)) return montantComptabiliseVente(v);
    return montantComptabiliseVente(v) - (Number(v.quantite) || 0) * (coutMoyen || 0);
  }

  function computeStockProduit(p){
    var achatsP = state.achats.filter(function(a){ return a.produitId === p.id; });
    var ventesP = state.ventes.filter(function(v){ return v.produitId === p.id; });
    var ventesStock = ventesP.filter(function(v){ return v.typeVente !== "commande_speciale"; });
    var ventesCommande = ventesP.filter(function(v){ return v.typeVente === "commande_speciale"; });

    var totalAchatQte = sumBy(achatsP, function(a){ return a.quantite; });
    var totalAchatValeur = sumBy(achatsP, function(a){ return a.quantite * a.prixAchatUnitaire; });
    var coutMoyen = totalAchatQte > 0 ? totalAchatValeur / totalAchatQte : 0;

    var qteVendueStock = sumBy(ventesStock, function(v){ return v.quantite; });
    var stockRestant = Math.max(0, totalAchatQte - qteVendueStock);

    var prixVenteRef = (p.dernierPrixVenteEstime === null || p.dernierPrixVenteEstime === undefined) ? 0 : p.dernierPrixVenteEstime;

    // Sprint Revente-D : via la fonction de comptabilisation (une commande
    // spéciale ne compte que pour sa marge).
    var caStock = sumBy(ventesStock, montantComptabiliseVente);
    var beneficeStock = caStock - qteVendueStock * coutMoyen;
    var caCommande = sumBy(ventesCommande, montantComptabiliseVente);
    var beneficeCommande = sumBy(ventesCommande, function(v){ return beneficeVente(v, coutMoyen); });

    var beneficeAttendu = sumBy(achatsP, function(a){ return a.quantite * ((a.prixVenteUnitaireEstime||0) - (a.prixAchatUnitaire||0)); });

    var seuil = (p.seuilReassort===undefined || p.seuilReassort===null) ? SEUIL_REASSORT_DEFAUT : p.seuilReassort;

    return {
      produit: p, totalAchatQte: totalAchatQte, coutMoyen: coutMoyen, stockRestant: stockRestant,
      valeurStockCout: stockRestant * coutMoyen, valeurStockVente: stockRestant * prixVenteRef,
      caTotal: caStock + caCommande, beneficeRealise: beneficeStock + beneficeCommande,
      beneficeAttendu: beneficeAttendu, seuil: seuil, alerte: stockRestant <= seuil
    };
  }

  function renderStockSection(titre){
    var produits = state.config.produits.slice().sort(function(a,b){ return a.nom.localeCompare(b.nom); });
    if(!produits.length) return "";
    var cards = produits.map(function(p){
      var s = computeStockProduit(p);
      return (
        '<div class="stock-card" data-stock-produit="' + esc(p.nom) + '">' +
          '<div class="sc-head">' +
            '<div class="sc-nom">' + esc(p.nom) + '</div>' +
            (s.alerte ? '<div class="sc-alerte" data-test="badge-bientot-fini">Bientôt fini</div>' : '') +
          '</div>' +
          '<div class="sc-grid">' +
            '<div class="sk">Stock restant</div><div class="sv" data-col="stock-restant">' + formatQte(s.stockRestant) + ' paquet(s)</div>' +
            '<div class="sk">Coût moyen</div><div class="sv">' + formatFCFA(s.coutMoyen) + '</div>' +
            '<div class="sk">Valeur (coût)</div><div class="sv">' + formatFCFA(s.valeurStockCout) + '</div>' +
            '<div class="sk">Valeur (vente est.)</div><div class="sv">' + formatFCFA(s.valeurStockVente) + '</div>' +
            '<div class="sk">Bénéfice réalisé</div><div class="sv">' + formatFCFA(s.beneficeRealise) + '</div>' +
            '<div class="sk">Bénéfice attendu</div><div class="sv">' + formatFCFA(s.beneficeAttendu) + '</div>' +
          '</div>' +
          // Sprint Revente-E : vocabulaire simple (le champ reste seuilReassort).
          '<label class="sc-seuil">' +
            '<span class="sc-seuil-txt">🔔 Me prévenir quand il reste</span>' +
            '<span class="sc-seuil-val"><input type="number" inputmode="numeric" min="0" step="1" value="' + s.seuil + '" data-action-change="set-seuil-reassort" data-id="' + p.id + '" aria-label="Me prévenir quand il reste ce nombre de paquets">paquet(s)</span>' +
          '</label>' +
        '</div>'
      );
    }).join("");
    return '<div class="reglages-section"><div class="rs-title">' + esc(titre || "Suivi de stock") + '</div>' + cards + '</div>';
  }

  // Bénéfice réalisé (marge réelle) — même méthode que le Suivi de stock F4,
  // via la fonction de comptabilisation (Sprint Revente-D). Le coût moyen de
  // chaque produit n'est calculé qu'une fois par appel (mêmes chiffres, mais
  // la caisse additionne tout l'historique à chaque affichage d'Aujourd'hui).
  function beneficeReventePeriode(range){
    var coutsMoyens = {};
    return sumBy(filterRange(state.ventes, range), function(v){
      if(estCommandeSpeciale(v)) return beneficeVente(v, 0);
      var cle = "p:" + v.produitId;
      if(!(cle in coutsMoyens)){
        var p = findProduitById(v.produitId);
        coutsMoyens[cle] = p ? computeStockProduit(p).coutMoyen : 0;
      }
      return beneficeVente(v, coutsMoyens[cle]);
    });
  }
  function beneficeReventeTotal(){
    return sumBy(state.config.produits, function(p){ return computeStockProduit(p).beneficeRealise; });
  }

  function emptyState(emoji, titre, desc){
    return '<div class="empty-state"><div class="es-emoji">' + emoji + '</div>' +
      '<div class="es-title">' + esc(titre) + '</div>' +
      '<div class="es-desc">' + esc(desc) + '</div></div>';
  }

  /* ================= Objectif d'épargne — base : Bénéfice réalisé ================= */
  // Cahier des charges v1, section 6 (point tranché) : l'épargne automatique
  // est un pourcentage du Bénéfice réalisé (la vraie marge), jamais des
  // Ventes encaissées (chiffre d'affaires brut, qui inclut le coût des
  // mèches déjà payées à l'achat) — pour ne jamais proposer une épargne non
  // soutenable une fois le stock racheté.
  function epargnePeriode(range){
    if(!state.objectifEpargne) return 0;
    var o = state.objectifEpargne;
    if(o.type === "manuel"){
      return joursActifsDansPeriode(range) * (o.montant || 0);
    }
    return beneficeReventePeriode(range) * (o.pourcentage || 0) / 100;
  }
  function epargneJour(dateStr){ return epargnePeriode({ start:dateStr, end:dateStr }); }

  // 4 modèles d'objectif d'épargne propres à Revente (cahier, section 7,
  // point confirmé par Hamadou sans ajustement).
  var OBJECTIF_MODELES = [
    { id:"stock", emoji:"📦", nom:"Agrandir le stock", desc:"Racheter plus de produits, diversifier les références" },
    { id:"transport", emoji:"🚚", nom:"Transport & livraison", desc:"Moto, frais de livraison aux clientes, déplacement fournisseur" },
    { id:"famille", emoji:"👨‍👩‍👧", nom:"Famille", desc:"Mariage, scolarité, santé" },
    { id:"libre", emoji:"💰", nom:"Épargne libre", desc:"Juste mettre de côté, sans montant précis" }
  ];
  function findObjectifModele(id){
    for(var i=0;i<OBJECTIF_MODELES.length;i++) if(OBJECTIF_MODELES[i].id === id) return OBJECTIF_MODELES[i];
    return null;
  }
  function epargneEmoji(){
    return (state.objectifEpargne && state.objectifEpargne.emoji) || "💰";
  }

  // Solde net (Mon état / Télécharger) = Bénéfice réalisé − Épargne − Charges
  // communes, même principe que Coiffure (Main d’œuvre − Épargne − Charges).
  function soldeNetPeriode(range){
    return beneficeReventePeriode(range) - epargnePeriode(range) - chargesCommunesTotal(range);
  }
  function soldeNetJour(dateStr){ return soldeNetPeriode({ start:dateStr, end:dateStr }); }

  /* ================= Sprint Revente-D : caisse physique ================= */
  // Deux grandeurs distinctes :
  //  - « Ventes du mois » : un chiffre d'activité (somme des montants
  //    comptabilisés), jamais diminué par les achats ;
  //  - « Caisse à date » : l'argent physique =
  //      fonds de départ + Σ ventes comptabilisées − Σ sorties de caisse,
  //    tout cumulé DEPUIS LE DÉBUT jusqu'à aujourd'hui, en un seul calcul. Le
  //    report d'un mois à l'autre est donc automatique ; on ne calcule jamais
  //    « solde antérieur + solde du mois » à part (risque de double comptage).
  // Sorties de caisse (période) = achats payés avec la caisse (quantité × prix
  // d'achat unitaire + charges de l'achat) + charges communes + épargne mise de
  // côté. L'épargne est celle de l'objectif (sur le bénéfice réalisé, comme
  // partout), comptée à partir de la date de création de l'objectif : avant,
  // rien n'a été mis de côté, l'argent est resté dans la caisse (même borne
  // que « Mis de côté depuis le … » sur la carte de l'objectif).

  var DEBUT_HISTORIQUE = "0000-01-01";

  function achatPayeParCaisse(a){ return a.sourcePaiement !== "autre"; }
  function ventesComptabiliseesPeriode(range){
    return sumBy(filterRange(state.ventes, range), montantComptabiliseVente);
  }
  function achatsPeriodeTotal(range){
    return sumBy(filterRange(state.achats, range), coutAchat);
  }
  function achatsCaissePeriode(range){
    return sumBy(filterRange(state.achats, range).filter(achatPayeParCaisse), coutAchat);
  }
  function epargneMiseDeCotePeriode(range){
    var o = state.objectifEpargne;
    if(!o) return 0;
    var debut = (o.dateCreation && o.dateCreation > range.start) ? o.dateCreation : range.start;
    if(debut > range.end) return 0;
    return epargnePeriode({ start: debut, end: range.end });
  }
  function sortiesCaissePeriode(range){
    var achats = achatsCaissePeriode(range);
    var charges = chargesCommunesTotal(range);
    var epargne = epargneMiseDeCotePeriode(range);
    return { achatsCaisse: achats, charges: charges, epargne: epargne, total: achats + charges + epargne };
  }
  function fondsDepartCaisse(){
    var f = Number(state.config.fondsDepartCaisse);
    return (isFinite(f) && f > 0) ? f : 0;
  }
  // Caisse à date : un seul calcul, du tout début jusqu'à aujourd'hui.
  function caisseADate(){
    var depuisLeDebut = { start: DEBUT_HISTORIQUE, end: todayStr() };
    return fondsDepartCaisse() + ventesComptabiliseesPeriode(depuisLeDebut) - sortiesCaissePeriode(depuisLeDebut).total;
  }

  // Synthèse du mois civil en cours (zone « Ce mois-ci » et détail de la
  // caisse), en francs entiers. Les sorties affichées sont la somme de leurs
  // trois parts affichées, et le report des mois précédents est la différence
  // entre la caisse à date (calculée d'un seul tenant, ci-dessus) et les
  // chiffres du mois : le détail tombe donc toujours juste au franc près.
  function syntheseCaisseMois(){
    var aujourdHui = new Date();
    var today = todayStr();
    var moisRange = getMonthRange(aujourdHui);
    var moisADate = { start: moisRange.start, end: today };
    var sorties = sortiesCaissePeriode(moisADate);
    var r = Math.round;
    var achatsCaisse = r(sorties.achatsCaisse), charges = r(sorties.charges), epargne = r(sorties.epargne);
    var sortiesMois = achatsCaisse + charges + epargne;
    var ventesMois = r(ventesComptabiliseesPeriode(moisADate));
    var achatsMois = r(achatsPeriodeTotal(moisADate));
    var fonds = r(fondsDepartCaisse());
    var caisse = r(caisseADate());
    var commandesMois = filterRange(state.ventes, moisADate).filter(estCommandeSpeciale);
    return {
      moisLabel: moisLabelMaj(aujourdHui),
      achatsMois: achatsMois,
      achatsAutreSourceMois: achatsMois - r(achatsCaissePeriode(moisADate)),
      ventesMois: ventesMois,
      sortiesMois: sortiesMois,
      sortiesAchatsCaisse: achatsCaisse,
      sortiesCharges: charges,
      sortiesEpargne: epargne,
      chargesMois: charges,
      fonds: fonds,
      report: caisse - fonds - ventesMois + sortiesMois,
      caisse: caisse,
      nbCommandesSpecialesMois: commandesMois.length,
      transitCommandesMois: r(sumBy(commandesMois, function(v){ return Number(v.prixPayeRevendeur) || 0; }))
    };
  }

  /* ================= Écran « Aujourd’hui » ================= */
  // Cahier des charges v1, section 5.1 (point tranché, option B) : blocs
  // cliquables Achats/Ventes/Épargne, chaque bloc ouvre le détail du jour
  // correspondant ; le bloc Bénéfice reste informatif (non cliquable).

  // Sprint Revente-D : deux zones « Aujourd'hui » / « Ce mois-ci ».
  // Sprint Revente-E : la zone « Ce mois-ci » n'est plus affichée en
  // permanence. À sa place, en bas, un bouton bien visible (accent ambre, plus
  // haut que la carte Charges communes) l'ouvre dans une feuille du bas, avec
  // exactement le même contenu. Les 4 blocs du jour reprennent la hauteur
  // libérée : le bas du bouton touche la barre du bas, sans défilement.
  function renderAujourdhui(){
    return renderZoneJour() + renderBoutonCeMois();
  }

  function renderZoneJour(){
    var today = todayStr();
    var range = { start: today, end: today };
    var achatsJour = sumBy(filterRange(state.achats, range), coutAchat);
    var ventesJour = ventesComptabiliseesPeriode(range);
    var beneficeTotal = beneficeReventeTotal();
    var epargne = state.objectifEpargne ? epargneJour(today) : 0;

    var blocks =
      '<button type="button" class="dash-block" data-action="voir-jour-achats">' +
        '<div class="db-emoji db-ico t-ambre">📦</div><div class="db-amount" data-test="achats-jour">' + formatFCFA(achatsJour) + '</div><div class="db-label">Achats du jour</div>' +
      '</button>' +
      '<button type="button" class="dash-block" data-action="voir-jour-ventes">' +
        '<div class="db-emoji db-ico t-vert">🛍️</div><div class="db-amount pos" data-test="ventes-jour">' + formatFCFA(ventesJour) + '</div><div class="db-label">Ventes du jour</div>' +
      '</button>' +
      '<div class="dash-block info">' +
        '<div class="db-emoji db-ico t-turq">💹</div><div class="db-amount" data-test="benefice-date">' + formatFCFA(beneficeTotal) + '</div><div class="db-label">Bénéfice (à date)</div>' +
      '</div>' +
      '<button type="button" class="dash-block" data-action="ouvrir-objectif">' +
        '<div class="db-emoji db-ico t-bleu">' + esc(epargneEmoji()) + '</div><div class="db-amount" data-test="epargne-jour">' + (state.objectifEpargne ? formatFCFA(epargne) : "Aucun") + '</div><div class="db-label">Épargne</div>' +
      '</button>';

    return (
      '<div class="section-title zone-titre">Aujourd’hui · ' + formatDateFr(today) + '</div>' +
      '<div class="dash-grid">' + blocks + '</div>' +
      '<div class="charges-card-wrap">' + renderChargesCommunesCard() + '</div>'
    );
  }

  // Sprint Revente-F (2) : le « + » se pose à droite du bouton (couloir) ; le
  // titre doit tenir en entier à côté. S'il déborde, la police est réduite
  // juste ce qu'il faut (13 px au plus petit) ; en dernier recours, sur un
  // très petit écran, le mois est abrégé (« Sept. 2026 »).
  var MOIS_COURTS = ["Janv.","Févr.","Mars","Avr.","Mai","Juin","Juil.","Août","Sept.","Oct.","Nov.","Déc."];
  function moisLabelCourt(d){ return MOIS_COURTS[d.getMonth()] + " " + d.getFullYear(); }
  function largeurTexte(el){
    var r = document.createRange(); r.selectNodeContents(el);
    return r.getBoundingClientRect().width;
  }
  function ajusterTitreCeMois(){
    var t = document.querySelector(".main.ecran-aujourdhui .mois-btn .cm-titre");
    if(!t) return;
    var mois = t.querySelector(".cm-mois");
    t.style.fontSize = "";
    if(mois && mois.getAttribute("data-long")) mois.textContent = mois.getAttribute("data-long");
    var dispo = t.clientWidth;
    if(!dispo || largeurTexte(t) <= dispo) return;
    var taille = parseFloat(getComputedStyle(t).fontSize);
    taille = Math.max(13, Math.floor(taille * dispo / largeurTexte(t) * 10) / 10);
    t.style.fontSize = taille + "px";
    // (la largeur ne suit pas exactement la taille : on affine par petits pas)
    while(largeurTexte(t) > dispo && taille > 13){
      taille = Math.max(13, Math.round((taille - 0.2) * 10) / 10);
      t.style.fontSize = taille + "px";
    }
    if(largeurTexte(t) > dispo && mois && mois.getAttribute("data-court")) mois.textContent = mois.getAttribute("data-court");
  }

  // Bouton « 📅 Ce mois-ci · <mois civil en cours> » (libellé dynamique).
  // Pastille rouge si la caisse à date est négative (même arrondi que la
  // synthèse) : l'alerte n'est pas cachée derrière le bouton ; le message doux
  // reste dans le contenu.
  function renderBoutonCeMois(){
    var negative = Math.round(caisseADate()) < 0;
    return (
      '<button type="button" class="mois-btn" data-action="voir-ce-mois" data-test="bouton-ce-mois">' +
        '<span class="cm-ico">📅' +
          (negative ? '<span class="cm-pastille" data-test="pastille-caisse-negative" aria-label="Caisse négative"></span>' : '') +
        '</span>' +
        '<span class="cm-main">' +
          '<span class="cm-titre">Ce mois-ci · <span class="cm-mois" data-long="' + esc(moisLabelMaj(new Date())) + '" data-court="' + esc(moisLabelCourt(new Date())) + '">' + esc(moisLabelMaj(new Date())) + '</span></span>' +
          '<span class="cm-sous">Achats, ventes, caisse</span>' +
        '</span>' +
      '</button>'
    );
  }

  // Contenu de « Ce mois-ci » (feuille du bas) : celui de la zone du Sprint D,
  // sans changement — Achats du mois, Ventes du mois, Sorties de caisse
  // (→ détail), Charges communes (incluses dans les sorties), Caisse à date en
  // grand (→ détail), message de caisse négative.
  function renderCeMois(){
    var s = syntheseCaisseMois();
    var negative = s.caisse < 0;
    var tuiles =
      '<div class="mois-tile">' +
        '<div class="mt-label">Achats du mois</div>' +
        '<div class="mt-val" data-test="achats-mois">' + formatFCFA(s.achatsMois) + '</div>' +
      '</div>' +
      '<div class="mois-tile">' +
        '<div class="mt-label">Ventes du mois</div>' +
        '<div class="mt-val pos" data-test="ventes-mois">' + formatFCFA(s.ventesMois) + '</div>' +
      '</div>' +
      '<button type="button" class="mois-tile mois-tile-btn" data-action="voir-detail-caisse" data-test="tuile-sorties">' +
        '<span class="mt-chev" aria-hidden="true">›</span>' +
        '<div class="mt-label">Sorties de caisse</div>' +
        '<div class="mt-val neg" data-test="sorties-mois">' + formatFCFA(s.sortiesMois) + '</div>' +
      '</button>' +
      '<div class="mois-tile">' +
        '<div class="mt-label">Charges communes</div>' +
        '<div class="mt-val" data-test="charges-mois">' + formatFCFA(s.chargesMois) + '</div>' +
        '<div class="mt-note">incluses dans les sorties</div>' +
      '</div>';
    var caisse =
      '<button type="button" class="caisse-bloc' + (negative ? " caisse-neg" : "") + '" data-action="voir-detail-caisse" data-test="bloc-caisse">' +
        '<div class="cb-emoji ' + (negative ? "t-rouge" : "t-ambre") + '">💵</div>' +
        '<div class="cb-main">' +
          '<div class="cb-label">Caisse à date</div>' +
          '<div class="cb-amount' + (negative ? " neg" : "") + '" data-test="caisse-date">' + formatFCFA(s.caisse) + '</div>' +
          (negative ? '<div class="caisse-negative" data-test="caisse-negative">' + esc(MESSAGE_CAISSE_NEGATIVE) + '</div>' : '') +
        '</div>' +
        '<div class="cb-chev">›</div>' +
      '</button>';
    return (
      '<div class="mois-grid">' + tuiles + '</div>' +
      caisse +
      '<div class="mois-aide">Touchez la caisse ou les sorties pour le détail.</div>'
    );
  }

  var MESSAGE_CAISSE_NEGATIVE = "Votre caisse est négative : un achat a peut-être été payé avec une autre source.";

  // Détail de la caisse (au toucher du bloc « Caisse à date » ou des sorties).
  function renderDetailCaisse(){
    var s = syntheseCaisseMois();
    var negative = s.caisse < 0;
    var signe = function(n){ return n === 0 ? formatFCFA(0) : (n < 0 ? "− " : "+ ") + formatFCFA(Math.abs(n)); };
    var ligne = function(label, valeur, classe, test){
      return '<div class="cd-row' + (classe ? " " + classe : "") + '"><div class="cd-k">' + label + '</div>' +
        '<div class="cd-v"' + (test ? ' data-test="' + test + '"' : '') + '>' + valeur + '</div></div>';
    };
    var html =
      '<div class="caisse-detail">' +
        ligne("Fonds de départ", formatFCFA(s.fonds), "", "cd-fonds") +
        ligne("Report des mois précédents", signe(s.report), "", "cd-report") +
        ligne("Ventes du mois", signe(s.ventesMois), "cd-pos", "cd-ventes") +
        ligne("Sorties de caisse du mois", "− " + formatFCFA(s.sortiesMois), "cd-neg", "cd-sorties") +
        ligne("Achats payés avec la caisse", formatFCFA(s.sortiesAchatsCaisse), "cd-sub", "cd-sorties-achats") +
        ligne("Charges communes", formatFCFA(s.sortiesCharges), "cd-sub", "cd-sorties-charges") +
        ligne("Épargne mise de côté", formatFCFA(s.sortiesEpargne), "cd-sub", "cd-sorties-epargne") +
        ligne("Caisse à date", formatFCFA(s.caisse), "cd-total" + (negative ? " cd-total-neg" : ""), "cd-caisse") +
      '</div>';
    var notes = "";
    if(negative) notes += '<div class="dash-perte" style="margin-top:12px;">' + esc(MESSAGE_CAISSE_NEGATIVE) + '</div>';
    if(s.achatsAutreSourceMois > 0){
      notes += '<div class="hint" style="margin-top:12px;" data-test="cd-autre-source">Achats payés avec une autre source ce mois-ci : <b style="color:var(--text);">' + formatFCFA(s.achatsAutreSourceMois) + '</b> — comptés dans les achats du mois, pas dans la caisse.</div>';
    }
    if(s.nbCommandesSpecialesMois > 0){
      notes += '<div class="hint" style="margin-top:10px;">Commandes spéciales : seule la marge est comptée. Les ' + formatFCFA(s.transitCommandesMois) + ' payés au revendeur ce mois-ci sont de l’argent en transit (de la cliente au revendeur).</div>';
    }
    notes += '<div class="hint" style="margin-top:10px;">La caisse se reporte toute seule d’un mois à l’autre. Épargne comptée depuis la création de votre objectif.</div>';
    notes += '<button type="button" class="btn btn-secondary" style="margin-top:14px;" data-action="modifier-fonds-depuis-caisse">Fonds de départ : ' + (s.fonds > 0 ? 'modifier' : 'indiquer') + ' dans Réglages</button>';
    return html + notes;
  }

  function renderChargesCommunesCard(){
    var today = todayStr();
    var total = chargesCommunesTotal({ start: today, end: today });
    if(!state.autresCharges.length){
      return (
        '<div class="caisse-zone">' +
          '<button type="button" class="charges-row charges-row-vide" data-action="voir-charges-jour">' +
            '<span class="cr-emoji t-rouge">🧾</span><span class="cr-label">Charges communes</span><span class="cr-chev" aria-hidden="true">›</span>' +
          '</button>' +
        '</div>'
      );
