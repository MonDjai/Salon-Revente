    return (
      '<div class="caisse-zone">' +
        '<button type="button" class="charges-row" data-action="voir-charges-jour">' +
          '<span class="cr-emoji t-rouge">💸</span><span class="cr-label">Charges communes</span><span class="cr-amount" data-test="charges-jour">' + formatFCFA(total) + '</span>' +
        '</button>' +
      '</div>'
    );
  }

  /* ================= Blocs « Achats du jour » / « Ventes du jour » (Aujourd’hui) ================= */

  function renderJourAchatsModal(){
    var today = todayStr();
    var items = sortByDateDesc(state.achats.filter(function(a){ return a.date === today; }));
    if(!items.length){
      return emptyState("📦", "Aucun achat aujourd’hui", "Les achats enregistrés aujourd’hui apparaîtront ici.");
    }
    return '<div class="entry-list">' + items.map(function(a){
      return (
        '<button type="button" class="entry-card" data-action="voir-achat-du-jour" data-id="' + a.id + '">' +
          '<div class="entry-ico">📦</div>' +
          '<div class="entry-main">' +
            '<div class="entry-title et-flex"><span class="et-nom">' + esc(a.produitNom) + '</span>' + badgeAutreSource(a) + '</div>' +
            '<div class="entry-sub">' + a.quantite + ' paquet(s) · ' + formatFCFA(a.prixAchatUnitaire) + '/u</div>' +
          '</div>' +
          '<div class="entry-amount">' + formatFCFA(a.quantite*a.prixAchatUnitaire + (a.charges||0)) + '</div>' +
        '</button>'
      );
    }).join("") + '</div>';
  }
  // Sprint Revente-D : repère visuel des achats qui ne sont pas sortis de la caisse.
  function badgeAutreSource(a){
    return achatPayeParCaisse(a) ? "" : ' <span class="badge badge-autre">Autre source</span>';
  }
  // Sprint Revente-D : dans les listes, une commande spéciale affiche son
  // montant comptabilisé (la marge) — pour que la liste corresponde au total —
  // et rappelle le montant encaissé et la part du revendeur.
  function sousTitreTransit(v){
    if(!estCommandeSpeciale(v)) return "";
    return " · encaissé " + montantInsecable(v.montantEncaisse) + ", dont " + montantInsecable(v.prixPayeRevendeur || 0) + " au revendeur";
  }
  // Sprint Revente-E : un montant ne se coupe jamais en fin de ligne (« 7 / 000 F »).
  function montantInsecable(n){ return formatFCFA(n).replace(/ /g, "\u00a0"); }
  function renderJourVentesModal(){
    var today = todayStr();
    var items = sortByDateDesc(state.ventes.filter(function(v){ return v.date === today; }));
    if(!items.length){
      return emptyState("🛍️", "Aucune vente aujourd’hui", "Les ventes enregistrées aujourd’hui apparaîtront ici.");
    }
    return '<div class="entry-list">' + items.map(function(v){
      var badge = v.typeVente === "commande_speciale" ? ' <span class="badge">Commande spéciale</span>' : "";
      return (
        '<button type="button" class="entry-card" data-action="voir-vente-du-jour" data-id="' + v.id + '">' +
          '<div class="entry-ico ico-vente">🛍️</div>' +
          '<div class="entry-main">' +
            '<div class="entry-title et-flex"><span class="et-nom">' + esc(v.produitNom) + '</span>' + badge + '</div>' +
            '<div class="entry-sub">' + v.quantite + ' vendu(s)' + sousTitreTransit(v) + '</div>' +
          '</div>' +
          '<div class="entry-amount pos">' + formatFCFA(montantComptabiliseVente(v)) + '</div>' +
        '</button>'
      );
    }).join("") + '</div>';
  }

  /* ================= Formulaires : capture / options communes ================= */

  function optionsProduits(selectedId, placeholder){
    var list = state.config.produits.slice().sort(function(a,b){ return a.nom.localeCompare(b.nom); });
    var opts = '<option value="" disabled' + (!selectedId?" selected":"") + '>' + esc(placeholder||"Choisir un produit") + '</option>';
    opts += list.map(function(it){
      return '<option value="' + it.id + '"' + (it.id===selectedId?" selected":"") + '>' + esc(it.nom) + '</option>';
    }).join("");
    opts += '<option value="__new__"' + (selectedId==="__new__"?" selected":"") + '>+ Nouveau produit…</option>';
    return opts;
  }
  function fieldErr(key){
    return ui.errors[key] ? '<div class="field-error">' + esc(ui.errors[key]) + '</div>' : "";
  }
  function captureDraft(fieldIds){
    fieldIds.forEach(function(id){
      var el = byId(id);
      if(el) ui.draft[id] = el.value;
    });
  }

  /* ---------- F2 : Achats ---------- */

  var ACHAT_FIELDS = ["f-date","f-produitSel","f-produitNouveauNom","f-quantite","f-prixAchat","f-prixVente","f-charges"];

  // Sprint Revente-E : le même formulaire sert à la saisie et à la
  // modification (pré-rempli, mêmes contrôles, bouton « Enregistrer les
  // modifications » et message doux si un mois passé est concerné).
  function renderFormAchat(modif){
    var d = ui.draft;
    var produitSel = d["f-produitSel"] || "";
    var isNew = produitSel === "__new__";
    var sourcePaiement = d["f-sourcePaiement"] === "autre" ? "autre" : "caisse";
    return (
      '<div>' +
        '<div class="field"><div class="label">Date d’acquisition <span class="req">*</span></div>' +
          '<input type="date" class="input" id="f-date" max="' + todayStr() + '" value="' + esc(d["f-date"] || todayStr()) + '" data-action-change="capture-achat">' +
          fieldErr("date") +
        '</div>' +
        '<div class="field"><div class="label">Produit <span class="req">*</span></div>' +
          '<select class="select" id="f-produitSel" data-action-change="produit-achat-change">' + optionsProduits(produitSel) + '</select>' +
          (isNew ? '<div class="inline-new"><input type="text" class="input" id="f-produitNouveauNom" placeholder="Nom du nouveau produit" value="' + esc(d["f-produitNouveauNom"]||"") + '" data-autofocus data-action-change="capture-achat"></div>' : '') +
          fieldErr("produit") +
        '</div>' +
        '<div class="field"><div class="label">Quantité achetée (paquets) <span class="req">*</span></div>' +
          '<input type="number" inputmode="decimal" step="0.1" min="0" class="input" id="f-quantite" placeholder="Ex. 2 ou 0,5" value="' + esc(d["f-quantite"]||"") + '" data-action-change="capture-achat">' +
          fieldErr("quantite") +
        '</div>' +
        '<div class="field"><div class="label">Prix d’achat unitaire (FCFA) <span class="req">*</span></div>' +
          '<input type="number" inputmode="numeric" step="1" min="0" class="input" id="f-prixAchat" value="' + esc(d["f-prixAchat"]||"") + '" data-action-change="capture-achat">' +
          fieldErr("prixAchat") +
        '</div>' +
        '<div class="field"><div class="label">Prix de vente unitaire estimé (FCFA) <span class="req">*</span></div>' +
          '<input type="number" inputmode="numeric" step="1" min="0" class="input" id="f-prixVente" value="' + esc(d["f-prixVente"]||"") + '" data-action-change="capture-achat">' +
          '<div class="field-note">Sert seulement à estimer le bénéfice attendu.</div>' +
          fieldErr("prixVente") +
        '</div>' +
        '<div class="field"><div class="label">Charges (transport, livraison…) (FCFA)</div>' +
          '<input type="number" inputmode="numeric" step="1" min="0" class="input" id="f-charges" placeholder="0" value="' + esc(d["f-charges"]||"") + '" data-action-change="capture-achat">' +
        '</div>' +
        // Sprint Revente-D : d'où vient l'argent de cet achat (« la caisse » par défaut).
        '<div class="field"><div class="label">Payé avec</div>' +
          '<div class="radio-row">' +
            '<button type="button" class="radio-opt' + (sourcePaiement==="caisse"?" active":"") + '" data-action="set-source-paiement" data-val="caisse">La caisse</button>' +
            '<button type="button" class="radio-opt' + (sourcePaiement==="autre"?" active":"") + '" data-action="set-source-paiement" data-val="autre">Une autre source</button>' +
          '</div>' +
          '<div class="field-note">' + (sourcePaiement==="autre"
            ? "Argent personnel, mobile money, prêt… : l’achat compte dans vos achats du mois, mais ne sort pas de la caisse."
            : "Le montant de l’achat sort de la caisse.") + '</div>' +
        '</div>' +
        (modif ? renderNoteMoisPasse() : '') +
        (modif
          ? '<button type="button" class="btn btn-primary" data-action="enregistrer-modif-achat">Enregistrer les modifications</button>'
          : '<button type="button" class="btn btn-primary" data-action="enregistrer-achat">Enregistrer</button>') +
      '</div>'
    );
  }

  function onProduitAchatChange(){
    captureDraft(ACHAT_FIELDS);
    // Sprint Revente-E : dans une modification, changer de produit garde les
    // prix déjà indiqués (ce sont ceux de l'achat que l'on corrige).
    if(estFormulaireModification()) return;
    var sel = ui.draft["f-produitSel"];
    if(sel && sel !== "__new__"){
      var p = findProduitById(sel);
      if(p){
        if(p.dernierPrixAchat !== null && p.dernierPrixAchat !== undefined) ui.draft["f-prixAchat"] = String(p.dernierPrixAchat);
        if(p.dernierPrixVenteEstime !== null && p.dernierPrixVenteEstime !== undefined) ui.draft["f-prixVente"] = String(p.dernierPrixVenteEstime);
      }
    }
  }

  // Lecture + contrôles du formulaire d'achat — Sprint Revente-E : partagés
  // par la saisie et la modification (mêmes contrôles, mêmes messages).
  function lireFormulaireAchat(){
    captureDraft(ACHAT_FIELDS);
    var d = ui.draft;
    var errors = {};
    var date = d["f-date"] || todayStr();
    var produitSel = d["f-produitSel"];
    var produitNom = produitSel === "__new__" ? (d["f-produitNouveauNom"]||"").trim() : (findProduitById(produitSel)||{}).nom;
    var quantite = toNum(d["f-quantite"]);
    var prixAchat = toNum(d["f-prixAchat"]);
    var prixVente = toNum(d["f-prixVente"]);
    var charges = toNum(d["f-charges"]);

    if(!date) errors.date = "Choisissez une date.";
    if(!produitSel || (produitSel==="__new__" && !produitNom)) errors.produit = "Choisissez ou créez un produit.";
    if(!(quantite > 0)) errors.quantite = "Indiquez une quantité supérieure à 0.";
    if(!(prixAchat >= 0) || d["f-prixAchat"]==="") errors.prixAchat = "Indiquez le prix d’achat unitaire.";
    if(!(prixVente >= 0) || d["f-prixVente"]==="") errors.prixVente = "Indiquez le prix de vente estimé.";

    return {
      errors: errors, date: date, produitSel: produitSel, produitNom: produitNom,
      quantite: quantite, prixAchat: prixAchat, prixVente: prixVente, charges: charges,
      sourcePaiement: d["f-sourcePaiement"] === "autre" ? "autre" : "caisse"
    };
  }

  function enregistrerAchat(){
    var f = lireFormulaireAchat();
    if(Object.keys(f.errors).length){ ui.errors = f.errors; render(); return; }

    var produit = f.produitSel === "__new__" ? findOrCreateProduit(f.produitNom, f.prixAchat, f.prixVente) : findProduitById(f.produitSel);
    if(produit){ produit.dernierPrixAchat = f.prixAchat; produit.dernierPrixVenteEstime = f.prixVente; }

    state.achats.push({
      id: uid("achat"), date: f.date,
      produitId: produit ? produit.id : null,
      produitNom: produit ? produit.nom : f.produitNom,
      quantite: f.quantite, prixAchatUnitaire: f.prixAchat, prixVenteUnitaireEstime: f.prixVente,
      charges: f.charges, ts: Date.now(),
      sourcePaiement: f.sourcePaiement
    });
    saveState();
    closeModal();
  }

  /* ================= Sprint Revente-C : onglet Achats ================= */
  // Deux sous-vues, « Détails achats » et « Stock & réappro ».
  // Sprint Revente-E (simplification demandée par Hamadou) :
  //  - « Détails achats » : Jour / Semaine / Mois avec navigation ‹ › bornée,
  //    carte du total de la période et liste « Achats de la période » — les
  //    listes « Semaines du mois » / « Jours de la semaine » et le drill-down
  //    (avec son « ‹ Retour ») sont supprimés ;
  //  - « Stock & réappro » : plus de sélecteur Jour / Semaine / Mois ; un
  //    tableau mensuel (mois civil en cours par défaut, ‹ › pour revoir un
  //    mois passé) avec une ligne TOTAL, indépendant de la période de
  //    « Détails achats ».

  function coutAchat(a){ return (a.quantite||0)*(a.prixAchatUnitaire||0) + (a.charges||0); }
  function libelleJourLong(ds){
    var dd = dateFromStr(ds);
    var j = JOURS_NOMS[dd.getDay()];
    return j.charAt(0).toUpperCase() + j.slice(1) + " " + formatDateFr(ds);
  }
  function ensureAchatsRefs(){
    if(!ui.achatsPeriode) ui.achatsPeriode = "jour";
    if(!ui.achatsSemaineRef) ui.achatsSemaineRef = todayStr();
    if(!ui.achatsMoisRef) ui.achatsMoisRef = todayStr();
  }
  // Période affichée dans « Détails achats ».
  function niveauAchats(){
    ensureAchatsRefs();
    var p = ui.achatsPeriode;
    if(p === "semaine") return { type:"semaine", ref: ui.achatsSemaineRef, range: getWeekRange(dateFromStr(ui.achatsSemaineRef)) };
    if(p === "mois") return { type:"mois", ref: ui.achatsMoisRef, range: getMonthRange(dateFromStr(ui.achatsMoisRef)) };
    return { type:"jour", date: todayStr(), range: getDayRange(new Date()) };
  }

  // Sprint Revente-F : un seul onglet « Achat/Vente » (mêmes rubriques que les
  // autres applications MonDjai) — trois vues côte à côte : Achats (= « Détails
  // achats » : Jour / Semaine / Mois), Ventes (présentées comme les achats,
  // sur la même période) et Stock (= « Stock & réappro »).
  var VUES_ACHAT_VENTE = [
    { key:"achats", emoji:"📦", label:"Achats" },
    { key:"ventes", emoji:"🛍️", label:"Ventes" },
    { key:"stock", emoji:"🗃️", label:"Stock" }
  ];
  function vueAchatVente(){
    return (ui.achatsVue === "ventes" || ui.achatsVue === "stock") ? ui.achatsVue : "achats";
  }
  function renderAchatVente(){
    var vue = vueAchatVente();
    var seg = '<div class="seg seg-3" data-test="vues-achat-vente">' + VUES_ACHAT_VENTE.map(function(v){
      return '<button type="button" class="seg-btn' + (vue === v.key ? " active" : "") + '" data-action="achats-vue" data-val="' + v.key + '">' +
        '<span class="sb-emoji" aria-hidden="true">' + v.emoji + '</span>' + v.label + '</button>';
    }).join("") + '</div>';
    var corps = vue === "stock" ? renderAchatsStock() : (vue === "ventes" ? renderVentesDetails() : renderAchatsDetails());
    return '<div class="section-title">Achat/Vente</div>' + seg + '<div class="sous-vue">' + corps + '</div>';
  }

  function renderAchatsEntete(niv){
    var periode = ui.achatsPeriode;
    var tabs = ["jour","semaine","mois"].map(function(p){
      var lbl = { jour:"Jour", semaine:"Semaine", mois:"Mois" }[p];
      return '<button type="button" class="etat-tab' + (periode===p?" active":"") + '" data-action="achats-set-periode" data-val="' + p + '">' + lbl + '</button>';
    }).join("");
    var html = '<div class="etat-tabs">' + tabs + '</div>';
    if(niv.type === "jour") html += '<div class="periode-titre">' + esc(libelleJourLong(niv.date)) + '</div>';
    else html += renderNavPeriode("achats-nav", niv.type, niv.ref);
    return html;
  }

  /* ---------- Sous-vue « Détails achats » ---------- */

  function renderAchatsDetails(){
    var niv = niveauAchats();
    var range = niv.range;
    var achats = sortByDateDesc(filterRange(state.achats, range));
    var total = sumBy(achats, coutAchat);
    var qte = sumBy(achats, function(a){ return a.quantite; });
    var charges = sumBy(achats, function(a){ return a.charges; });
    var carte =
      '<div class="dash-solde" style="margin-bottom:16px;">' +
        '<div class="ds-label">Total des achats de la période</div>' +
        '<div class="ds-amount" data-test="total-achats-periode">' + formatFCFA(total) + '</div>' +
        '<div class="solde-mini-stats">' +
          '<div class="sms-col"><div class="sms-label">Achats</div><div class="sms-val" data-test="nb-achats-periode">' + achats.length + '</div></div>' +
          '<div class="sms-col"><div class="sms-label">Paquets</div><div class="sms-val" data-test="paquets-periode">' + formatQte(qte) + '</div></div>' +
          '<div class="sms-col"><div class="sms-label">Dont charges</div><div class="sms-val">' + formatFCFA(charges) + '</div></div>' +
        '</div>' +
      '</div>';

    var titreListe = '<div class="section-title">' + (niv.type === "jour" ? "Achats de la journée" : "Achats de la période") + '</div>';
    if(!achats.length){
      var vide = niv.type === "jour"
        ? emptyState("📦","Aucun achat aujourd’hui","Touchez le bouton + pour enregistrer un réapprovisionnement.")
        : emptyState("📦","Aucun achat sur cette période","Les achats enregistrés sur cette période apparaîtront ici.");
      return renderAchatsEntete(niv) + carte + titreListe + vide;
    }
    var lg = niv.type === "jour";
    var rows = achats.map(function(a){
      return (
        '<button type="button" class="entry-card' + (lg ? " entry-card-lg" : "") + '" style="width:100%;' + (lg ? "" : " text-align:left;") + '" data-action="voir-achat" data-id="' + a.id + '">' +
          '<div class="entry-ico">📦</div>' +
          '<div class="entry-main">' +
            '<div class="entry-title et-flex"><span class="et-nom">' + esc(a.produitNom) + '</span>' + badgeAutreSource(a) + '</div>' +
            '<div class="entry-sub">' + formatDateFr(a.date) + ' · ' + formatQte(a.quantite) + ' paquet(s) · ' + formatFCFA(a.prixAchatUnitaire) + '/u</div>' +
          '</div>' +
          '<div class="entry-amount">' + formatFCFA(coutAchat(a)) + '</div>' +
        '</button>'
      );
    }).join("");
    return renderAchatsEntete(niv) + carte + titreListe +
      '<div class="entry-list' + (lg ? " entry-list-lg" : "") + '" data-test="liste-achats-periode">' + rows + '</div>';
  }

  /* ---------- Sous-vue « Stock & réappro » ---------- */
  // Le stock est un état, pas un flux : le stock actuel par produit et les
  // alertes « Bientôt fini » restent toujours visibles. Pour le mois affiché
  // (mois civil en cours par défaut), le tableau donne par produit les entrées
  // (achats), les sorties (ventes « depuis le stock ») et le stock en fin de
  // mois = achats cumulés jusqu'à la fin du mois − ventes « depuis le stock »
  // cumulées jusqu'à la fin du mois (jamais négatif, comme le stock restant),
  // puis une ligne TOTAL de chaque colonne. Les commandes spéciales ne
  // décrémentent pas le stock (inchangé).

  function mouvementsStockProduit(p, range){
    var achatsP = state.achats.filter(function(a){ return a.produitId === p.id; });
    var ventesS = state.ventes.filter(function(v){ return v.produitId === p.id && v.typeVente !== "commande_speciale"; });
    var qte = function(x){ return x.quantite; };
    var entrees = sumBy(filterRange(achatsP, range), qte);
    var sorties = sumBy(filterRange(ventesS, range), qte);
    var cumulAchats = sumBy(achatsP.filter(function(a){ return !!a.date && a.date <= range.end; }), qte);
    var cumulVentes = sumBy(ventesS.filter(function(v){ return !!v.date && v.date <= range.end; }), qte);
    return {
      produit: p, entrees: entrees, sorties: sorties,
      stockFin: Math.max(0, cumulAchats - cumulVentes),
      valeurEntrees: sumBy(filterRange(achatsP, range), coutAchat)
    };
  }
  function mouvementsStock(range){
    var produits = state.config.produits.slice().sort(function(a,b){ return a.nom.localeCompare(b.nom); });
    return produits.map(function(p){ return mouvementsStockProduit(p, range); })
      .filter(function(m){ return m.entrees > 0 || m.sorties > 0 || m.stockFin > 0; });
  }
  function ensureStockMoisRef(){
    if(!ui.stockMoisRef) ui.stockMoisRef = todayStr();
  }

  function renderAchatsStock(){
    var produits = state.config.produits.slice().sort(function(a,b){ return a.nom.localeCompare(b.nom); });
    if(!produits.length){
      return emptyState("📦","Aucun produit en stock","Enregistrez un premier achat avec le bouton + : le stock de chaque produit apparaîtra ici.");
    }
    var stats = produits.map(computeStockProduit);
    var alertes = stats.filter(function(s){ return s.alerte; });
    var bandeau = alertes.length
      ? '<div class="stock-alerte-bandeau" data-test="bandeau-bientot-fini">⚠️ <b>Bientôt fini</b> — ' + alertes.map(function(s){
          return esc(s.produit.nom) + ' (' + formatQte(s.stockRestant) + ')';
        }).join(", ") + '&nbsp;: pensez à racheter.</div>'
      : '';

    ensureStockMoisRef();
    var range = getMonthRange(dateFromStr(ui.stockMoisRef));
    var moisEnCours = range.start === getMonthRange(new Date()).start;
    var mvts = mouvementsStock(range);
    var totEntrees = sumBy(mvts, function(m){ return m.entrees; });
    var totSorties = sumBy(mvts, function(m){ return m.sorties; });
    var totFin = sumBy(mvts, function(m){ return m.stockFin; });
    var entrees = function(n){ return n ? "+" + formatQte(n) : "0"; };
    var sorties = function(n){ return n ? "−" + formatQte(n) : "0"; };

    var table = "";
    if(mvts.length){
      table =
        '<div class="mvt-table" data-test="mvt-table">' +
          '<div class="mvt-row mvt-head"><div>Produit</div><div class="mvt-n">Entrées</div><div class="mvt-n">Sorties</div><div class="mvt-n" data-test="col-stock">' + (moisEnCours ? "Stock" : "Stock fin") + '</div></div>' +
          mvts.map(function(m){
            return '<div class="mvt-row" data-produit="' + esc(m.produit.nom) + '">' +
              '<div class="mvt-nom">' + esc(m.produit.nom) + '</div>' +
              '<div class="mvt-n in" data-col="entrees">' + entrees(m.entrees) + '</div>' +
              '<div class="mvt-n out" data-col="sorties">' + sorties(m.sorties) + '</div>' +
              '<div class="mvt-n" data-col="fin">' + formatQte(m.stockFin) + '</div>' +
            '</div>';
          }).join("") +
          '<div class="mvt-row mvt-total" data-test="mvt-total">' +
            '<div class="mvt-nom">Total</div>' +
            '<div class="mvt-n in" data-col="entrees">' + entrees(totEntrees) + '</div>' +
            '<div class="mvt-n out" data-col="sorties">' + sorties(totSorties) + '</div>' +
            '<div class="mvt-n fin" data-col="fin">' + formatQte(totFin) + '</div>' +
          '</div>' +
        '</div>';
    } else {
      table = '<div class="hint" style="margin-bottom:16px;" data-test="mvt-vide">Aucun mouvement de stock en ' + esc(moisLabelFor(dateFromStr(range.start))) + '.</div>';
    }
    table += '<div class="hint tight" style="margin:-8px 0 18px;">Sorties = ventes « depuis le stock ». Les commandes spéciales ne touchent pas le stock.</div>';

    return bandeau +
      '<div class="section-title">Mouvements du mois</div>' +
      renderNavPeriode("stock-nav", "mois", ui.stockMoisRef) +
      table +
      renderStockSection("Stock actuel (aujourd’hui)");
  }

  function renderDetailAchat(){
    var a = state.achats.filter(function(x){ return x.id === ui.modal.id; })[0];
    if(!a) return "";
    var rows =
      drow("Date", formatDateFr(a.date)) +
      drow("Produit", esc(a.produitNom)) +
      drow("Quantité", a.quantite + " paquet(s)") +
      drow("Prix d’achat unitaire", formatFCFA(a.prixAchatUnitaire)) +
      drow("Prix de vente estimé", formatFCFA(a.prixVenteUnitaireEstime)) +
      drow("Charges", formatFCFA(a.charges||0)) +
      drow("Total dépensé", formatFCFA(a.quantite*a.prixAchatUnitaire + (a.charges||0))) +
      drow("Payé avec", achatPayeParCaisse(a) ? "La caisse" : "Une autre source");
    if(!achatPayeParCaisse(a)){
      rows += '<div class="hint tight" style="margin-top:8px;">Compté dans les achats du mois, mais pas dans les sorties de caisse.</div>';
    }
    rows += renderModifieLe(a);
    return detailShell(rows, "achat", a.id);
  }

  /* ---------- F3 : Ventes ---------- */

  var VENTE_FIELDS = ["f-date","f-produitSel","f-produitNouveauNom","f-quantite","f-montant","f-typeVente","f-prixRevendeur"];

  function renderFormVente(modif){
    var d = ui.draft;
    var produitSel = d["f-produitSel"] || "";
    var isNew = produitSel === "__new__";
    var typeVente = d["f-typeVente"] || "stock";
    return (
      '<div>' +
        '<div class="field"><div class="label">Date de la vente <span class="req">*</span></div>' +
          '<input type="date" class="input" id="f-date" max="' + todayStr() + '" value="' + esc(d["f-date"] || todayStr()) + '" data-action-change="capture-vente">' +
          fieldErr("date") +
        '</div>' +
        '<div class="field"><div class="label">Produit vendu <span class="req">*</span></div>' +
          '<select class="select" id="f-produitSel" data-action-change="produit-vente-change">' + optionsProduits(produitSel, state.config.produits.length? "Choisir un produit" : "Aucun produit — créez-en un") + '</select>' +
          (isNew ? '<div class="inline-new"><input type="text" class="input" id="f-produitNouveauNom" placeholder="Nom du produit" value="' + esc(d["f-produitNouveauNom"]||"") + '" data-autofocus data-action-change="capture-vente"></div>' : '') +
          (state.config.produits.length ? '' : '<div class="field-note">Aucun achat enregistré pour l’instant — vous pouvez quand même noter le nom du produit vendu.</div>') +
          fieldErr("produit") +
        '</div>' +
        '<div class="field"><div class="label">Quantité vendue <span class="req">*</span></div>' +
          '<input type="number" inputmode="decimal" step="0.1" min="0" class="input" id="f-quantite" placeholder="Ex. 1 ou 0,5" value="' + esc(d["f-quantite"]||"") + '" data-action-change="capture-vente">' +
          fieldErr("quantite") +
        '</div>' +
        '<div class="field"><div class="label">Montant total encaissé (FCFA) <span class="req">*</span></div>' +
          '<input type="number" inputmode="numeric" step="1" min="0" class="input" id="f-montant" value="' + esc(d["f-montant"]||"") + '" data-action-change="capture-vente">' +
          fieldErr("montant") +
        '</div>' +
        '<div class="field"><div class="label">Type de vente <span class="req">*</span></div>' +
          '<div class="radio-row">' +
            '<button type="button" class="radio-opt' + (typeVente==="stock"?" active":"") + '" data-action="set-type-vente" data-val="stock">Depuis le stock</button>' +
            '<button type="button" class="radio-opt' + (typeVente==="commande_speciale"?" active":"") + '" data-action="set-type-vente" data-val="commande_speciale">Commande spéciale</button>' +
          '</div>' +
        '</div>' +
        (typeVente==="commande_speciale" ?
          '<div class="field"><div class="label">Prix payé au revendeur (FCFA) <span class="req">*</span></div>' +
            '<input type="number" inputmode="numeric" step="1" min="0" class="input" id="f-prixRevendeur" value="' + esc(d["f-prixRevendeur"]||"") + '" data-action-change="capture-vente">' +
            '<div class="field-note">La marge se calcule automatiquement (montant encaissé − prix payé au revendeur).</div>' +
            fieldErr("prixRevendeur") +
          '</div>' : '') +
        (modif ? renderNoteMoisPasse() : '') +
        (modif
          ? '<button type="button" class="btn btn-primary" data-action="enregistrer-modif-vente">Enregistrer les modifications</button>'
          : '<button type="button" class="btn btn-primary" data-action="enregistrer-vente">Enregistrer</button>') +
      '</div>'
    );
  }

  // Lecture + contrôles du formulaire de vente (saisie et modification).
  function lireFormulaireVente(){
    captureDraft(VENTE_FIELDS);
    var d = ui.draft;
    var errors = {};
    var date = d["f-date"] || todayStr();
    var produitSel = d["f-produitSel"];
    var produitNomNouveau = (d["f-produitNouveauNom"]||"").trim();
    var quantite = toNum(d["f-quantite"]);
    var montant = toNum(d["f-montant"]);
    var typeVente = d["f-typeVente"] || "stock";
    var prixRevendeur = toNum(d["f-prixRevendeur"]);

    if(!date) errors.date = "Choisissez une date.";
    if(!produitSel || (produitSel==="__new__" && !produitNomNouveau)) errors.produit = "Choisissez ou créez un produit.";
    if(!(quantite > 0)) errors.quantite = "Indiquez une quantité supérieure à 0.";
    if(!(montant >= 0) || d["f-montant"]==="") errors.montant = "Indiquez le montant encaissé.";
    if(typeVente === "commande_speciale" && (d["f-prixRevendeur"]==="" || !(prixRevendeur >= 0))) errors.prixRevendeur = "Indiquez le prix payé au revendeur.";

    return {
      errors: errors, date: date, produitSel: produitSel, produitNomNouveau: produitNomNouveau,
      quantite: quantite, montant: montant, typeVente: typeVente, prixRevendeur: prixRevendeur
    };
  }

  function enregistrerVente(){
    var f = lireFormulaireVente();
    if(Object.keys(f.errors).length){ ui.errors = f.errors; render(); return; }

    var produit = f.produitSel === "__new__" ? findOrCreateProduit(f.produitNomNouveau) : findProduitById(f.produitSel);

    state.ventes.push({
      id: uid("vente"), date: f.date,
      produitId: produit ? produit.id : null,
      produitNom: produit ? produit.nom : f.produitNomNouveau,
      quantite: f.quantite, montantEncaisse: f.montant, typeVente: f.typeVente,
      prixPayeRevendeur: f.typeVente==="commande_speciale" ? f.prixRevendeur : null,
      ts: Date.now()
    });
    saveState();
    closeModal();
  }

  /* ================= Sprint Revente-E : modifier un achat ou une vente ================= */
  // Règle retenue (piste d'audit, adaptée à un carnet personnel) : on CORRIGE
  // l'enregistrement au lieu de le supprimer puis le ressaisir, et on garde la
  // trace de la correction dans l'enregistrement lui-même :
  //  - modifieLe : horodatage (ms) de la dernière correction ;
  //  - versionsPrecedentes : les anciennes valeurs, une entrée par correction,
  //    la plus récente en dernier (jamais affichées en détail, conservées à
  //    l'export et à la restauration).
  // id, ts et date de saisie d'origine ne changent jamais. Un enregistrement
  // sans ces champs n'a simplement jamais été modifié (aucune migration).
  // Mêmes contrôles qu'à la saisie ; les mois passés ne sont pas verrouillés
  // (la suppression reste possible) — un message doux prévient seulement que
  // leurs chiffres et la caisse à date seront recalculés.

  function estFormulaireModification(){
    return !!ui.modal && (ui.modal.type === "edit-achat" || ui.modal.type === "edit-vente");
  }
  function trouverEnregistrement(kind, id){
    var liste = kind === "achat" ? state.achats : (kind === "vente" ? state.ventes : []);
    for(var i=0;i<liste.length;i++) if(liste[i] && liste[i].id === id) return liste[i];
    return null;
  }
  function valeurChamp(n){ return (n === null || n === undefined || n === "") ? "" : String(n); }
  // Produit à présélectionner : celui de l'enregistrement, sinon un produit du
  // même nom, sinon « + Nouveau produit… » avec le nom déjà rempli.
  function produitSelPourEdition(rec){
    if(rec.produitId && findProduitById(rec.produitId)) return rec.produitId;
    var nom = String(rec.produitNom || "").trim().toLowerCase();
    var memeNom = state.config.produits.filter(function(p){ return p.nom.toLowerCase() === nom; })[0];
    return memeNom ? memeNom.id : "__new__";
  }
  function brouillonDepuisAchat(a){
    var sel = produitSelPourEdition(a);
    return {
      "f-date": a.date || todayStr(),
      "f-produitSel": sel,
      "f-produitNouveauNom": sel === "__new__" ? (a.produitNom || "") : "",
      "f-quantite": valeurChamp(a.quantite),
      "f-prixAchat": valeurChamp(a.prixAchatUnitaire),
      "f-prixVente": valeurChamp(a.prixVenteUnitaireEstime),
      "f-charges": a.charges ? valeurChamp(a.charges) : "",
      "f-sourcePaiement": achatPayeParCaisse(a) ? "caisse" : "autre"
    };
  }
  function brouillonDepuisVente(v){
    var sel = produitSelPourEdition(v);
    var commande = estCommandeSpeciale(v);
    return {
      "f-date": v.date || todayStr(),
      "f-produitSel": sel,
      "f-produitNouveauNom": sel === "__new__" ? (v.produitNom || "") : "",
      "f-quantite": valeurChamp(v.quantite),
      "f-montant": valeurChamp(v.montantEncaisse),
      "f-typeVente": commande ? "commande_speciale" : "stock",
      "f-prixRevendeur": commande ? valeurChamp(v.prixPayeRevendeur) : ""
    };
  }
  // La modale ouverte devient le niveau « retour » de la suivante (pile) :
  // fermer ou revenir ramène à elle, à jour.
  function empilerModale(){
    if(!ui.modal) return;
    var extra = {};
    if(ui.modal.id !== undefined) extra.id = ui.modal.id;
    ui.modalReturnTo = { type: ui.modal.type, extra: extra, returnTo: ui.modalReturnTo || null };
  }
  function ouvrirModification(kind, id){
    var rec = trouverEnregistrement(kind, id);
    if(!rec || !ui.modal) return;
    empilerModale();
    ui.modal = { type: kind === "achat" ? "edit-achat" : "edit-vente", id: id };
    ui.draft = kind === "achat" ? brouillonDepuisAchat(rec) : brouillonDepuisVente(rec);
    ui.errors = {};
    render();
  }

  function renderModifieLe(rec){
    if(!rec || !rec.modifieLe) return "";
    var d = new Date(rec.modifieLe);
    if(isNaN(d.getTime())) return "";
    return '<div class="modifie-le" data-test="modifie-le">✏️ Modifié le ' + formatDateFr(dateKey(d)) + '</div>';
  }

  // Message doux (jamais bloquant) quand l'ancienne ou la nouvelle date tombe
  // dans un mois civil passé.
  function moisPassesConcernes(ancienne, nouvelle){
    var debutMoisCourant = getMonthRange(new Date()).start;
    var liste = [];
    [ancienne, nouvelle].forEach(function(ds){
      if(!ds || ds >= debutMoisCourant) return;
      var d = parseDateStr(ds);
      if(!d) return;
      var lib = moisLabelFor(d);
      if(liste.indexOf(lib) < 0) liste.push(lib);
    });
    return liste;
  }
  function messageCorrectionMoisPasse(){
    if(!estFormulaireModification()) return "";
    var rec = trouverEnregistrement(ui.modal.type === "edit-achat" ? "achat" : "vente", ui.modal.id);
    var liste = moisPassesConcernes(rec ? rec.date : null, ui.draft["f-date"] || todayStr());
    if(!liste.length) return "";
    var de = function(lib){ return /^[aeiouyàâéèêîïôû]/i.test(lib) ? "d’" + lib : "de " + lib; };
    return "Cette correction change aussi les chiffres " + liste.map(de).join(" et ") + " ; la caisse à date sera recalculée.";
  }
  function renderNoteMoisPasse(){
    var msg = messageCorrectionMoisPasse();
    return '<div class="note-douce" id="note-mois-passe" data-test="msg-mois-passe" role="status"' + (msg ? '' : ' hidden') + '>' + esc(msg) + '</div>';
  }
  // Mise à jour du seul message quand la date change (sans redessiner le
  // formulaire : le champ suivant garde le focus).
  function majNoteMoisPasse(){
    var el = byId("note-mois-passe");
    if(!el) return;
    var msg = messageCorrectionMoisPasse();
    el.textContent = msg;
    el.hidden = !msg;
  }

  function memeValeur(cle, a, b){
    if(cle === "charges"){ a = Number(a) || 0; b = Number(b) || 0; }
    var videA = (a === null || a === undefined), videB = (b === null || b === undefined);
    if(videA || videB) return videA && videB;
    return a === b;
  }
  // Copie des valeurs actuelles (sans l'historique lui-même).
  function instantane(rec){
    var copie = {};
    for(var k in rec){
      if(Object.prototype.hasOwnProperty.call(rec, k) && k !== "versionsPrecedentes") copie[k] = rec[k];
    }
    return copie;
  }
  // Applique une correction ; renvoie false si rien n'a réellement changé
  // (aucune trace ajoutée dans ce cas).
  function appliquerModification(rec, nouveau){
    var change = Object.keys(nouveau).some(function(k){ return !memeValeur(k, rec[k], nouveau[k]); });
    if(!change) return false;
    var historique = Array.isArray(rec.versionsPrecedentes) ? rec.versionsPrecedentes.slice()
      : (rec.versionsPrecedentes ? [rec.versionsPrecedentes] : []);
    historique.push(instantane(rec));
    Object.keys(nouveau).forEach(function(k){ rec[k] = nouveau[k]; });
    rec.modifieLe = Date.now();
    rec.versionsPrecedentes = historique;
    return true;
  }
  // L'achat est-il le plus récent de son produit ? (date d'achat, puis heure de
  // saisie, puis ordre d'enregistrement)
  function estAchatLePlusRecent(a){
    var plusRecent = null, rang = -1;
    state.achats.forEach(function(x, i){
      if(!x || x.produitId !== a.produitId) return;
      var plus = !plusRecent || x.date > plusRecent.date ||
        (x.date === plusRecent.date && ((x.ts||0) > (plusRecent.ts||0) || ((x.ts||0) === (plusRecent.ts||0) && i > rang)));
      if(plus){ plusRecent = x; rang = i; }
    });
    return plusRecent === a;
  }

  function enregistrerModifAchat(){
    var a = trouverEnregistrement("achat", ui.modal && ui.modal.id);
    if(!a){ closeModal(); return; }
    var f = lireFormulaireAchat();
    if(Object.keys(f.errors).length){ ui.errors = f.errors; render(); return; }
    var produit = f.produitSel === "__new__" ? findOrCreateProduit(f.produitNom) : findProduitById(f.produitSel);
    var modifie = appliquerModification(a, {
      date: f.date,
      produitId: produit ? produit.id : null,
      produitNom: produit ? produit.nom : f.produitNom,
      quantite: f.quantite, prixAchatUnitaire: f.prixAchat, prixVenteUnitaireEstime: f.prixVente,
      charges: f.charges, sourcePaiement: f.sourcePaiement
    });
    // Prix mémorisés du produit : seulement si cet achat est le plus récent
    // de ce produit (corriger un vieil achat ne change pas le pré-remplissage).
    if(modifie && produit && estAchatLePlusRecent(a)){
      produit.dernierPrixAchat = f.prixAchat;
      produit.dernierPrixVenteEstime = f.prixVente;
    }
    if(modifie) saveState();
    ui.errors = {};
    closeModal();
  }

  function enregistrerModifVente(){
    var v = trouverEnregistrement("vente", ui.modal && ui.modal.id);
    if(!v){ closeModal(); return; }
    var f = lireFormulaireVente();
    if(Object.keys(f.errors).length){ ui.errors = f.errors; render(); return; }
    var produit = f.produitSel === "__new__" ? findOrCreateProduit(f.produitNomNouveau) : findProduitById(f.produitSel);
    var modifie = appliquerModification(v, {
      date: f.date,
      produitId: produit ? produit.id : null,
      produitNom: produit ? produit.nom : f.produitNomNouveau,
      quantite: f.quantite, montantEncaisse: f.montant, typeVente: f.typeVente,
      // « Commande spéciale » → « Depuis le stock » : plus de prix revendeur
      // (l'ancienne valeur reste dans versionsPrecedentes).
      prixPayeRevendeur: f.typeVente === "commande_speciale" ? f.prixRevendeur : null
    });
    if(modifie) saveState();
    ui.errors = {};
    closeModal();
  }

  /* ---------- Vue « Ventes » ---------- */
  // Sprint Revente-F (2) : présentée comme les achats — Jour / Semaine / Mois
  // avec ‹ › bornée, carte du total, liste des ventes de la période. La
  // période est la même que celle de la vue Achats (on passe de l'une à
  // l'autre sur la même journée, semaine ou mois). Chaque vente compte comme
  // partout ailleurs (montantComptabiliseVente : une commande spéciale = sa
  // marge). Pas de charges sur une vente.
  function renderVentesDetails(){
    var niv = niveauAchats();
    var ventes = sortByDateDesc(filterRange(state.ventes, niv.range));
    var total = sumBy(ventes, montantComptabiliseVente);
    var qte = sumBy(ventes, function(v){ return v.quantite; });
    var nbCommandes = ventes.filter(estCommandeSpeciale).length;
    var carte =
      '<div class="dash-solde" style="margin-bottom:16px;">' +
        '<div class="ds-label">Total des ventes de la période</div>' +
        '<div class="ds-amount pos" data-test="total-ventes-periode">' + formatFCFA(total) + '</div>' +
        '<div class="solde-mini-stats">' +
          '<div class="sms-col"><div class="sms-label">Ventes</div><div class="sms-val" data-test="nb-ventes-periode">' + ventes.length + '</div></div>' +
          '<div class="sms-col"><div class="sms-label">Paquets</div><div class="sms-val" data-test="paquets-ventes-periode">' + formatQte(qte) + '</div></div>' +
        '</div>' +
        (nbCommandes ? '<div class="ds-note" data-test="note-commandes-speciales">' +
          (nbCommandes > 1 ? "Dont " + nbCommandes + " commandes spéciales" : "Dont 1 commande spéciale") +
          ' : seule la marge est comptée.</div>' : '') +
      '</div>';

    var titreListe = '<div class="section-title">' + (niv.type === "jour" ? "Ventes de la journée" : "Ventes de la période") + '</div>';
    if(!ventes.length){
      var vide = niv.type === "jour"
        ? emptyState("🛍️","Aucune vente aujourd’hui","Touchez le bouton + pour enregistrer une vente.")
        : emptyState("🛍️","Aucune vente sur cette période","Les ventes enregistrées sur cette période apparaîtront ici.");
      return renderAchatsEntete(niv) + carte + titreListe + vide;
    }
    var lg = niv.type === "jour";
    var rows = ventes.map(function(v){
      var badge = estCommandeSpeciale(v) ? '<span class="badge">Commande spéciale</span>' : "";
      return (
        '<button type="button" class="entry-card' + (lg ? " entry-card-lg" : "") + '" style="width:100%;' + (lg ? "" : " text-align:left;") + '" data-action="voir-vente" data-id="' + v.id + '">' +
          '<div class="entry-ico ico-vente">🛍️</div>' +
          '<div class="entry-main">' +
            '<div class="entry-title et-flex"><span class="et-nom">' + esc(v.produitNom) + '</span>' + badge + '</div>' +
            '<div class="entry-sub">' + formatDateFr(v.date) + ' · ' + formatQte(v.quantite) + ' vendu(s)' + sousTitreTransit(v) + '</div>' +
          '</div>' +
          '<div class="entry-amount pos">' + formatFCFA(montantComptabiliseVente(v)) + '</div>' +
        '</button>'
      );
    }).join("");
    return renderAchatsEntete(niv) + carte + titreListe +
      '<div class="entry-list' + (lg ? " entry-list-lg" : "") + '" data-test="liste-ventes-periode">' + rows + '</div>';
  }

  function renderDetailVente(){
    var v = state.ventes.filter(function(x){ return x.id === ui.modal.id; })[0];
    if(!v) return "";
    var rows =
      drow("Date", formatDateFr(v.date)) +
      drow("Produit", esc(v.produitNom)) +
      drow("Quantité", v.quantite + "") +
      drow("Montant encaissé", formatFCFA(v.montantEncaisse)) +
      drow("Type de vente", v.typeVente==="commande_speciale" ? "Commande spéciale" : "Depuis le stock");
    if(v.typeVente === "commande_speciale"){
      rows += drow("Prix payé au revendeur", formatFCFA(v.prixPayeRevendeur||0));
      rows += drow("Marge (comptée dans les ventes)", formatFCFA(montantComptabiliseVente(v)));
      rows += '<div class="hint tight" style="margin-top:8px;">Les ' + formatFCFA(v.prixPayeRevendeur||0) + ' payés au revendeur sont de l’argent en transit : ils viennent de la cliente et repartent chez le revendeur. Seule la marge entre dans vos ventes, votre bénéfice et votre caisse.</div>';
    }
    rows += renderModifieLe(v);
    return detailShell(rows, "vente", v.id);
  }

  /* ================= Autres charges (rubriques) ================= */

  function rubriquesActives(){
    return state.config.rubriquesCharges.filter(function(r){ return r.actif; });
  }
  function findRubriqueCharge(id){
    var list = state.config.rubriquesCharges;
    for(var i=0;i<list.length;i++) if(list[i].id === id) return list[i];
    return null;
  }

  function renderDetailChargesJour(){
    var today = todayStr();
    var range = { start: today, end: today };
    var hint = '<div class="hint tight" style="margin-bottom:14px;">Ces charges concernent l’activité dans son ensemble (loyer, publicité…), pas un achat ou une vente en particulier.</div>';
    var autres = filterRange(state.autresCharges, range).sort(function(a,b){ return (b.ts||0)-(a.ts||0); });
    var autresHtml = '<div class="reglages-section"><div class="rs-title">Charges communes du jour</div>' +
      (autres.length ? autres.map(function(c){
        return (
          '<button type="button" class="entry-card" data-action="voir-autre-charge" data-id="' + c.id + '" style="margin-bottom:8px;">' +
            '<div class="entry-ico">' + esc(c.rubriqueEmoji||"📝") + '</div>' +
            '<div class="entry-main"><div class="entry-title">' + esc(c.rubriqueNom) + '</div></div>' +
            '<div class="entry-amount">' + formatFCFA(c.montant) + '</div>' +
          '</button>'
        );
      }).join("") : '<div class="hint tight">Aucune charge commune ajoutée aujourd’hui.</div>') +
      '<button type="button" class="btn btn-secondary" style="margin-top:8px;" data-action="add-autre-charge">+ Ajouter une charge</button>' +
    '</div>';
    return hint + autresHtml;
  }

      return (
        '<button type="button" class="rub-tile' + (rubSel===r.id?" selected":"") + '" data-action="set-rubrique-charge" data-id="' + r.id + '">' +
          '<div class="rub-icon">' + esc(r.emoji||"📝") + '</div>' +
          '<div class="rub-nom">' + esc(r.nom) + '</div>' +

        '</div>' +
        '<div class="field"><div class="label">Montant (FCFA) <span class="req">*</span></div>' +

        '</div>' +

  function renderDetailAutreCharge(){
    var c = state.autresCharges.filter(function(x){ return x.id === ui.modal.id; })[0];
    if(!c) return "";
    var rows = drow("Date", formatDateFr(c.date)) + drow("Rubrique", esc(c.rubriqueEmoji||"") + " " + esc(c.rubriqueNom)) + drow("Montant", formatFCFA(c.montant));
    return detailShell(rows, "autre-charge", c.id);

  function renderConfirmSuppressionRubrique(){
    var r = findRubriqueCharge(ui.modal.id);
    if(!r) return "";
    return (
      '<div><p style="font-size:13.5px; margin:0 0 14px;">Supprimer la rubrique « ' + esc(r.nom) + ' » ? Les charges déjà enregistrées avec cette rubrique restent dans l’historique.</p>' +
        '<div class="btn-row">' +
          '<button type="button" class="btn btn-secondary" data-action="fermer-modal">Annuler</button>' +
          '<button type="button" class="btn btn-danger" data-action="confirmer-suppression-rubrique" data-id="' + r.id + '">Oui, supprimer</button>' +
        '</div>' +
      '</div>'
    );
  }
  function enregistrerAutreCharge(){
    captureDraft(["f-montantAutreCharge"]);
    var d = ui.draft;
    var errors = {};
    var rubriqueId = d["f-rubrique"];
    var montant = toNum(d["f-montantAutreCharge"]);
    var rubrique = rubriqueId ? findRubriqueCharge(rubriqueId) : null;
    if(!rubrique) errors.rubrique = "Choisissez une rubrique.";
    if(!(montant > 0) || d["f-montantAutreCharge"]==="") errors.montant = "Indiquez un montant supérieur à 0.";
    if(Object.keys(errors).length){ ui.errors = errors; render(); return; }
    state.autresCharges.push({
      id: uid("acharge"), date: todayStr(),
      rubriqueId: rubrique.id, rubriqueNom: rubrique.nom, rubriqueEmoji: rubrique.emoji,
      montant: montant, ts: Date.now()
    });
    saveState();
    closeModal();
  }

  /* ================= Modal : dispatcher ================= */

  function drow(k,v){ return '<div class="detail-row"><div class="dk">' + esc(k) + '</div><div class="dv">' + v + '</div></div>'; }

  function detailShell(rowsHtml, kind, id){
    var confirming = ui.modal.confirmDelete;
    // Sprint Revente-E : « ✏️ Modifier » à côté de « Supprimer » pour les
    // achats et les ventes (les charges communes restent en suppression seule).
    var modifiable = (kind === "achat" || kind === "vente");
    var boutons = modifiable
      ? '<div class="btn-row detail-actions">' +
          '<button type="button" class="btn btn-secondary" data-action="modifier-enregistrement" data-kind="' + kind + '" data-id="' + id + '">✏️ Modifier</button>' +
          '<button type="button" class="btn btn-danger" data-action="demander-suppression">🗑️ Supprimer</button>' +
        '</div>'
      : '<button type="button" class="btn btn-danger" style="margin-top:14px;" data-action="demander-suppression">🗑️ Supprimer</button>';
    return (
      '<div>' + rowsHtml +
      (confirming ?
        '<div class="confirm-box"><p>Supprimer cet enregistrement ? Cette action est définitive.</p>' +
          '<div class="btn-row">' +
            '<button type="button" class="btn btn-secondary" data-action="annuler-suppression">Annuler</button>' +
            '<button type="button" class="btn btn-danger" data-action="confirmer-suppression" data-kind="' + kind + '" data-id="' + id + '">Oui, supprimer</button>' +
          '</div></div>'
        :
        boutons
      ) +
      '</div>'
    );
  }

  function renderModal(){
    var m = ui.modal;
    var body = "";
    var title = "";
    switch(m.type){
      case "add-achat": title = "Nouvel achat"; body = renderFormAchat(false); break;
      case "add-vente": title = "Nouvelle vente"; body = renderFormVente(false); break;
      case "edit-achat": title = "Modifier l’achat"; body = renderFormAchat(true); break;
      case "edit-vente": title = "Modifier la vente"; body = renderFormVente(true); break;
      case "ce-mois": title = "Ce mois-ci · " + moisLabelMaj(new Date()); body = renderCeMois(); break;
      case "detail-achat": title = "Détail de l’achat"; body = renderDetailAchat(); break;
      case "detail-vente": title = "Détail de la vente"; body = renderDetailVente(); break;
      case "jour-achats": title = "Achats d’aujourd’hui"; body = renderJourAchatsModal(); break;
      case "jour-ventes": title = "Ventes d’aujourd’hui"; body = renderJourVentesModal(); break;
      case "detail-charges-jour": title = "Charges communes"; body = renderDetailChargesJour(); break;
      case "detail-caisse": title = "Caisse à date"; body = renderDetailCaisse(); break;
      case "add-autre-charge": title = "Nouvelle charge"; body = renderFormAutreCharge(); break;
      case "detail-autre-charge": title = "Détail de la charge"; body = renderDetailAutreCharge(); break;
      case "confirmer-suppression-rubrique": title = "Supprimer la rubrique"; body = renderConfirmSuppressionRubrique(); break;
      case "modifier-objectif": title = "Modifier l’objectif"; body = renderFormModifierObjectif(); break;
      case "confirmer-suppression-objectif": title = "Supprimer l’objectif"; body = renderConfirmSuppressionObjectif(); break;
      case "pin-setup": title = "Code PIN"; body = renderPinSetupModal(); break;
      case "pin-oublie": title = "Code oublié ?"; body = renderPinOublieModal(); break;
      default: body = "";
    }
    return (
      '<div class="modal-overlay" data-action="fermer-modal-overlay">' +
        '<div class="modal' + (m.type === "ce-mois" ? " mois-sheet" : "") + '" data-stop-close="1" data-modal="' + esc(m.type) + '">' +
          '<div class="modal-head">' +
            '<div class="modal-title">' + esc(title) + '</div>' +
            '<button type="button" class="modal-close" data-action="fermer-modal">✕</button>' +
          '</div>' +

        '</div>' +
      '</div>'

  /* ================= Mon état ================= */

  function ensureEtatRefs(){
    if(!ui.etatPeriode) ui.etatPeriode = "jour";
    if(!ui.etatSemaineRef) ui.etatSemaineRef = todayStr();
    if(!ui.etatMoisRef) ui.etatMoisRef = todayStr();
  }
  function shiftRef(refName, delta){
    if(refName === "semaine") ui.etatSemaineRef = decalerPeriode("semaine", ui.etatSemaineRef, delta);
    else if(refName === "mois") ui.etatMoisRef = decalerPeriode("mois", ui.etatMoisRef, delta);
  }

  function renderEtatBack(){
    return '<button type="button" class="btn btn-ghost" style="padding:8px 0; margin-bottom:6px; width:auto;" data-action="etat-back">‹ Retour</button>';
  }
  function renderEtatSemaineNav(){
    return renderNavPeriode("etat-nav", "semaine", ui.etatSemaineRef);
  }
  function renderEtatMoisNav(){
    return renderNavPeriode("etat-nav", "mois", ui.etatMoisRef);
  }

  var JOURS_NOMS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];

  function renderEtatListeJours(range, from){
    var jours = [];
    var d = dateFromStr(range.start);
    var end = dateFromStr(range.end);
    while(dateKey(d) <= dateKey(end)){
      jours.push(dateKey(d));
      d.setDate(d.getDate()+1);
    }
    var today = todayStr();
    var rows = jours.map(function(ds){
      var dd = dateFromStr(ds);
      var label = JOURS_NOMS[dd.getDay()].charAt(0).toUpperCase() + JOURS_NOMS[dd.getDay()].slice(1) + " " + formatDateFr(ds);
      if(ds > today){
        return '<div class="etat-stat-row" style="opacity:.4;"><div class="er-label">' + esc(label) + '</div><div class="er-val">—</div></div>';
      }
      var solde = soldeNetPeriode({ start:ds, end:ds });
      return (
        '<button type="button" class="entry-card" style="width:100%; text-align:left;" data-action="etat-select-jour" data-date="' + ds + '" data-from="' + from + '">' +
          '<div class="entry-main"><div class="entry-title">' + esc(label) + '</div></div>' +
          '<div class="entry-amount' + (solde<0?" neg":"") + '">' + formatFCFA(solde) + '</div>' +
        '</button>'
      );
    }).join("");
    return '<div class="entry-list">' + rows + '</div>';
  }

  function renderEtatListeSemaines(monthRange){
    var firstWeekStart = getWeekRange(dateFromStr(monthRange.start)).start;
    var lastWeekStart = getWeekRange(dateFromStr(monthRange.end)).start;
    var semaines = [];
    var cur = firstWeekStart;
    while(cur <= lastWeekStart){
      semaines.push(cur);
      var d = dateFromStr(cur); d.setDate(d.getDate()+7);
      cur = dateKey(d);
    }
    var today = todayStr();
    var rows = semaines.map(function(ws){
      var range = getWeekRange(dateFromStr(ws));
      var label = formatDateFr(range.start) + " – " + formatDateFr(range.end);
      if(range.start > today){
        return '<div class="etat-stat-row" style="opacity:.4;"><div class="er-label">' + esc(label) + '</div><div class="er-val">—</div></div>';
      }

  /* ================= « Mes habitudes » ================= */

  function ensureHabitudesRefs(){
    if(!ui.habitudesPeriode) ui.habitudesPeriode = "jour";
    if(!ui.habitudesSemaineRef) ui.habitudesSemaineRef = todayStr();
    if(!ui.habitudesMoisRef) ui.habitudesMoisRef = todayStr();
  }
  function shiftHabitudesRef(periode, delta){
    if(periode === "semaine") ui.habitudesSemaineRef = decalerPeriode("semaine", ui.habitudesSemaineRef, delta);
    else if(periode === "mois") ui.habitudesMoisRef = decalerPeriode("mois", ui.habitudesMoisRef, delta);
  }

  function groupSum(arr, labelFn, valFn){
    var map = {}, ordre = [];
    arr.forEach(function(x){
      var lbl = labelFn(x);
      if(lbl === null || lbl === undefined || lbl === "") return;
      if(!(lbl in map)){ map[lbl] = 0; ordre.push(lbl); }
      map[lbl] += Number(valFn(x)) || 0;
    });
    return ordre.map(function(k){ return { label:k, montant:map[k] }; }).sort(function(a,b){ return b.montant - a.montant; });
  }

  function renderBreakdownRows(titre, rows){
    if(!rows.length) return "";
    var body = rows.map(function(r){
      return '<div class="eb-row"><div class="eb-nom">' + esc(r.label) + '</div><div class="eb-val">' + formatFCFA(r.montant) + '</div></div>';
    }).join("");
    return '<div class="etat-breakdown"><div class="eb-title">' + esc(titre) + '</div>' + body + '</div>';
  }

  function produitsRangeStats(range){
    var produits = state.config.produits;
    var rows = produits.map(function(p){
      var ventesP = filterRange(state.ventes.filter(function(v){ return v.produitId === p.id; }), range);
      if(!ventesP.length) return null;
      var qte = sumBy(ventesP, function(v){ return v.quantite; });
      // Sprint Revente-D : chiffre d'affaires et bénéfice via la fonction de
      // comptabilisation (commande spéciale = marge seulement).
      var ca = sumBy(ventesP, montantComptabiliseVente);
      var coutMoyen = computeStockProduit(p).coutMoyen;
      var benefice = sumBy(ventesP, function(v){ return beneficeVente(v, coutMoyen); });
      return { nom: p.nom, qte: qte, ca: ca, benefice: benefice };
    }).filter(Boolean).sort(function(a,b){ return b.ca - a.ca; });
    return rows;
  }

  function renderTopProduitCard(range){
    var rows = produitsRangeStats(range);
    if(!rows.length) return "";
    var top = rows[0];
    return (
      '<div class="top-produit-card">' +
        '<div class="tp-emoji">🏆</div>' +
        '<div><div class="tp-nom">' + esc(top.nom) + '</div>' +
        '<div class="tp-sub">Meilleur produit · ' + top.qte + ' vendu(s) · ' + formatFCFA(top.ca) + ' de CA (bénéf. ' + formatFCFA(top.benefice) + ')</div></div>' +
      '</div>'
    );
  }

  function renderBreakdownProduits(range){
    var rows = produitsRangeStats(range);
    if(!rows.length) return "";
    var body = rows.map(function(r){
      return '<div class="eb-row"><div class="eb-nom">' + esc(r.nom) + ' <span class="eb-sub">(' + r.qte + ' vendu(s))</span></div>' +
        '<div class="eb-val">' + formatFCFA(r.ca) + ' <span class="eb-sub">(bénéf. ' + formatFCFA(r.benefice) + ')</span></div></div>';
    }).join("");
    var noteCommande = filterRange(state.ventes, range).some(estCommandeSpeciale)
      ? '<div class="hint tight" style="margin:-10px 0 18px;">Commandes spéciales : seule la marge est comptée dans le chiffre d’affaires.</div>' : '';
    return '<div class="etat-breakdown"><div class="eb-title">Par produit — quantités &amp; chiffre d’affaires</div>' + body + '</div>' + noteCommande;
  }

  function renderBreakdownAutresCharges(range){
    var items = filterRange(state.autresCharges, range);

    return renderBreakdownRows("Charges communes — par rubrique", groupSum(items, function(c){ return c.rubriqueNom + (c.rubriqueSupprimee ? " (rubrique supprimée)" : ""); }, function(c){ return c.montant; }));

    ensureHabitudesRefs();
    var periode = ui.habitudesPeriode;

  function enregistrerObjectif(){
    var d = ui.objDraft;
    if(!d) return;
    d.erreurs = {};
    var nom = (d.nom||"").trim() || "Épargne";
    var modele = findObjectifModele(d.modeleId);
    var emoji = modele ? modele.emoji : "💰";
    if(d.mode === "manuel"){
      var montant = toNum(d.montant);
      if(!(montant > 0)){
        d.erreurs.montant = "Indiquez un montant supérieur à 0.";
        render();
        return;
      }
      state.objectifEpargne = {
        id: uid("obj"), nom: nom, type: "manuel", emoji: emoji,
        montant: montant, dateCreation: todayStr()
      };
    } else {
      var pourcentage = toNum(d.pourcentage) || 10;
      state.objectifEpargne = {
        id: uid("obj"), nom: nom, type: "auto", emoji: emoji,
        pourcentage: pourcentage, dateCreation: todayStr()
      };
    }
    saveState();
    ui.objDraft = null;
    render();

  function roundRectPath(ctx, x, y, w, h, r){
    if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }
  function dessinerOverlayAbonnementExport(ctx, W, H){
    var texte = "Abonnez-vous pour plus de fonctionnalités";
    ctx.font = "800 30px -apple-system,Helvetica,Arial,sans-serif";
    var maxWidth = W*0.8 - 68;
    var mots = texte.split(" "), lignes = [], ligne = "";
    mots.forEach(function(mot){
      var essai = ligne ? ligne + " " + mot : mot;
      if(ctx.measureText(essai).width > maxWidth && ligne){ lignes.push(ligne); ligne = mot; }
      else { ligne = essai; }
    });
    if(ligne) lignes.push(ligne);

    var lineHeight = 40, padX = 34, padY = 24;
    var textWidth = 0;
    lignes.forEach(function(l){ textWidth = Math.max(textWidth, ctx.measureText(l).width); });
    var boxW = Math.min(W*0.8, textWidth + padX*2);
    var boxH = lignes.length*lineHeight + padY*2;
    var cx = W/2, cy = H*0.74;
    var x0 = cx - boxW/2, y0 = cy - boxH/2;

    ctx.save();
    ctx.fillStyle = "rgba(17,20,26,.85)";
    ctx.strokeStyle = "rgba(245,166,35,.6)";
    ctx.lineWidth = 2;
    roundRectPath(ctx, x0, y0, boxW, boxH, 22);
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = "#f5a623";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    lignes.forEach(function(l, i){
      ctx.fillText(l, cx, y0 + padY + lineHeight*i + lineHeight/2);
    });
    ctx.restore();
  }
  function construireCanvasExport(){
    var source = byId("telecharger-canvas");
    if(!source || !source.getContext) return null;
    var W = source.width, H = source.height;

    var out = document.createElement("canvas");
    out.width = W; out.height = H;
    var octx = out.getContext("2d");
    octx.drawImage(source, 0, 0);

    var blurred = document.createElement("canvas");
    blurred.width = W; blurred.height = H;
    var bctx = blurred.getContext("2d");
    if("filter" in bctx){
      bctx.filter = "blur(16px)";
      bctx.drawImage(source, 0, 0);
      bctx.filter = "none";
    } else {
      var small = document.createElement("canvas");
      var sw = Math.max(1, Math.round(W/12)), sh = Math.max(1, Math.round(H/12));
      small.width = sw; small.height = sh;
      small.getContext("2d").drawImage(source, 0, 0, sw, sh);
      bctx.imageSmoothingEnabled = true;
      bctx.drawImage(small, 0, 0, sw, sh, 0, 0, W, H);
    }

    var grad = bctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, "rgba(0,0,0,0)");
    grad.addColorStop(0.28, "rgba(0,0,0,0)");
    grad.addColorStop(0.36, "rgba(0,0,0,1)");
    grad.addColorStop(1, "rgba(0,0,0,1)");
    bctx.globalCompositeOperation = "destination-in";
    bctx.fillStyle = grad;
    bctx.fillRect(0, 0, W, H);
    bctx.globalCompositeOperation = "source-over";

    octx.drawImage(blurred, 0, 0);
    dessinerOverlayAbonnementExport(octx, W, H);

    return out;
  }

  function canvasVersBlob(callback){
    var canvas = construireCanvasExport();
    if(!canvas){ callback(null); return; }
    if(canvas.toBlob){ canvas.toBlob(callback, "image/png"); return; }
    try{
      var dataUrl = canvas.toDataURL("image/png");
      var bstr = atob(dataUrl.split(",")[1]), n = bstr.length, u8 = new Uint8Array(n);
      while(n--) u8[n] = bstr.charCodeAt(n);
      callback(new Blob([u8], { type:"image/png" }));
    }catch(e){ callback(null); }
  }
  function nomFichierTelecharger(){
    return "mondjai-revente-" + ui.telechargerPeriode + "-" + todayStr() + ".png";
  }
  function telechargerImage(){
    canvasVersBlob(function(blob){
      if(!blob) return;
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = nomFichierTelecharger();
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    });
  }
  function partagerImage(){
    canvasVersBlob(function(blob){
      if(!blob) return;
      var fichier;
      try{ fichier = new File([blob], nomFichierTelecharger(), { type:"image/png" }); }catch(e){ fichier = null; }
      if(fichier && navigator.share && navigator.canShare && navigator.canShare({ files:[fichier] })){
        navigator.share({ files:[fichier], title:"MonDjai/Revente" }).catch(function(){});
      } else {
        telechargerImage();
      }
    });
  }

  function afficherCacheActifApropos(){
    var el = byId("apropos-cache");
    if(!el) return;
    if(!("caches" in window)){ el.textContent = "Hors ligne : non disponible sur ce navigateur."; return; }
    caches.keys().then(function(keys){
      var miens = keys.filter(function(k){ return k.indexOf("mondjai-revente-") === 0; }).sort();
      var cible = byId("apropos-cache");
      if(!cible) return;
      cible.textContent = miens.length ? ("Hors ligne : prêt (" + miens.join(", ") + ")") : "Hors ligne : en préparation (ouvrez l’application une fois connectée).";
    }).catch(function(){
      var cible = byId("apropos-cache");
      if(cible) cible.textContent = "Hors ligne : état inconnu.";
    });
  }

  /* ================= Actions ================= */

  function openModal(type, extra){
    ui.modal = merge({ type:type }, extra || {});
    ui.draft = {};
    ui.errors = {};
    render();
  }
  function closeModal(){
    // Sprint Revente-E : les niveaux « retour » forment une pile (ex. liste du
    // jour → détail → modification ; « Ce mois-ci » → détail de la caisse).
    if(ui.modalReturnTo){
      var back = ui.modalReturnTo;
      ui.modalReturnTo = back.returnTo || null;
      openModal(back.type, back.extra);
      return;
    }
    ui.modal = null;
    ui.draft = {};
    ui.errors = {};
    render();
  }

  function handleClick(e){
    var el = e.target.closest("[data-action]");
    if(!el) return;
    var action = el.getAttribute("data-action");

    if(action === "fermer-modal-overlay"){
      if(e.target.closest("[data-stop-close]")) return;
      closeModal();
      return;
    }
    if(action === "fermer-modal"){ closeModal(); return; }

    switch(action){
      case "maj-recharger": rechargerPourMaj(false); return;
      // Sprint Revente-F : Réglages est un onglet de la barre du bas.
      case "ouvrir-reglages": ouvrirOngletReglages(); render(); return;
      // Sprint Revente-D : caisse
      // Sprint Revente-E : ouvert depuis « Ce mois-ci », le détail de la caisse
      // y ramène quand on le ferme (2 niveaux pour le bouton retour).
      case "voir-detail-caisse": {
        if(ui.modal && ui.modal.type === "ce-mois") empilerModale();
        openModal("detail-caisse");
        return;
      }
      case "voir-ce-mois": ui.modalReturnTo = null; openModal("ce-mois"); return;
      // Sprint Revente-E : modification d'un achat / d'une vente
      case "modifier-enregistrement": ouvrirModification(el.getAttribute("data-kind"), el.getAttribute("data-id")); return;
      case "enregistrer-modif-achat": enregistrerModifAchat(); return;
      case "enregistrer-modif-vente": enregistrerModifVente(); return;
      case "modifier-fonds-depuis-caisse": {
        ui.modal = null; ui.modalReturnTo = null; ui.draft = {}; ui.errors = {};
        ouvrirOngletReglages();
        ui.pendingAutofocus = false;
        render();
        var champFonds = byId("f-fondsDepart");
        if(champFonds){ try{ champFonds.scrollIntoView({ block:"center" }); }catch(eScroll){} }
        return;
      }
      case "enregistrer-fonds-depart": enregistrerFondsDepart(); return;
      case "set-source-paiement": {
        captureDraft(ACHAT_FIELDS);
        ui.draft["f-sourcePaiement"] = el.getAttribute("data-val") === "autre" ? "autre" : "caisse";
        render();
        return;
      }
      case "fermer-overlay": ui.overlay = null; ui.objDraft = null; render(); return;
      case "ouvrir-apropos": ui.overlay = "apropos"; render(); return;

      case "choisir-modele-objectif": {
