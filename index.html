<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#11141a" />
<title>MonDjai/Revente</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" href="icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<script>
  // Sprint Revente-F — thème posé AVANT le premier affichage (aucun éclair
  // sombre ou blanc au démarrage, au rechargement de mise à jour ni à l'écran
  // du code d'accès). Lit seulement le choix enregistré (state.config.theme :
  // 'clair' | 'auto' | 'sombre' ; absent = 'clair'). Aucun appel réseau.
  // Même méthode que MonDjai/Coiffure (Sprint 8D).
  (function(){
    var t = "clair", porte = true;
    try{
      var s = JSON.parse(localStorage.getItem("mondjai_revente_state_v1") || "null");
      var c = s && s.config ? s.config : null;
      var choix = c ? c.theme : null;
      if(choix === "sombre") t = "sombre";
      else if(choix === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) t = "sombre";
      // Écran de départ sans bandeau (code d'accès, code PIN) ?
      porte = !(c && c.codeAccesOk) || !!(c.pinActif && c.pinCode);
    }catch(e){}
    var html = document.documentElement;
    html.setAttribute("data-theme", t);
    var meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute("content", t === "sombre" ? "#11141a" : (porte ? "#eff1f4" : "#141922"));
  })();
</script>
<style>
  /* =====================================================================
     Sprint Revente-F — thème clair « bandeau MonDjai » (variante B validée
     le 17/10/2026, livrée dans Coiffure au Sprint 8D) et thème sombre (rendu
     du Sprint Revente-E conservé). UNE seule source de couleurs : les
     variables ci-dessous, en deux jeux de valeurs. :root = sombre (valeurs
     exactes de Revente-E) ; html[data-theme="clair"] = clair (contraste des
     textes ≥ 4,5:1). L'attribut data-theme est posé sur <html> avant le
     premier affichage par le petit script de <head> (aucun éclair).
     Noms de variables identiques à MonDjai/Coiffure (Sprint 8D).
     ===================================================================== */
  :root{
    --bg:#11141a;
    --card:#1b2029;
    --card-2:#20262f;
    --border:#2a303c;
    --text:#eef1f6;
    --text-dim:#b7bfcc;
    /* Ambre « texte » (liens, pourcentages, onglet actif, montants) et ambre
       « remplissage » (bouton « + », boutons principaux, interrupteurs,
       pastilles du PIN, coches), toujours avec --on-accent dessus. */
    --accent:#f5a623;
    --accent-fill:#f5a623;
    --accent-dark:#c9840f;
    --on-accent:#1b1200;
    --green:#34b37e;
    --red:#ff6b5e;
    --blue:#5b8def;
    --turquoise:#4fd1c5;
    --pink:#e8788c;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
    /* Sprint Revente-E : bordures fines et discrètes, léger dégradé + ombre
       douce, rayons harmonisés. */
    --line:rgba(255,255,255,.075);
    --card-grad:linear-gradient(180deg,#1f252f 0%,#1a1f28 100%);
    --shadow:inset 0 1px 0 rgba(255,255,255,.035), 0 8px 18px -10px rgba(0,0,0,.65);
    --shadow-sm:inset 0 1px 0 rgba(255,255,255,.03), 0 3px 8px -4px rgba(0,0,0,.5);
    --r-lg:18px;
    --r-md:14px;
    --r-sm:11px;
    --filet:linear-gradient(90deg, rgba(255,255,255,.13), rgba(255,255,255,0));

    /* Bandeau MonDjai (en-tête) : sombre dans les deux thèmes. */
    --bandeau:#141922;
    --bandeau-text:#eef1f6;
    --bandeau-text-dim:#b7bfcc;
    --bandeau-line:rgba(255,255,255,.075);
    --bandeau-card-grad:linear-gradient(180deg,#1f252f 0%,#1a1f28 100%);
    --bandeau-card-2:#20262f;
    --bandeau-shadow-sm:inset 0 1px 0 rgba(255,255,255,.03), 0 3px 8px -4px rgba(0,0,0,.5);
    --bandeau-filet:linear-gradient(90deg, rgba(255,255,255,.13), rgba(255,255,255,0));
    --header-bg:linear-gradient(180deg,#181d26,#12161d);
    --header-border:1px solid rgba(255,255,255,.075);
    --header-shadow:0 10px 18px -16px rgba(0,0,0,.9);

    /* Barre du bas, feuilles du bas, bannière de mise à jour */
    --tabbar-bg:linear-gradient(180deg,#171c24,#13171e);
    --tabbar-shadow:0 -10px 22px -16px rgba(0,0,0,.9);
    --tab-actif-bg:rgba(245,166,35,.17);
    --tab-actif-ring:rgba(245,166,35,.42);
    --overlay:rgba(5,7,10,.62);
    --modal-bg:linear-gradient(180deg,#171c24 0px,#11141a 160px);
    --modal-border:rgba(255,255,255,.1);
    --modal-shadow:0 -14px 34px rgba(0,0,0,.5);
    --modal-poignee:#3c4352;
    --maj-bg:#1f2632;
    --maj-shadow:0 8px 24px rgba(0,0,0,.45);

    /* Boutons et contrôles */
    --btn2-border:rgba(255,255,255,.1);
    --fab-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 10px 22px -6px rgba(245,166,35,.5);
    --seg-shadow:inset 0 1px 3px rgba(0,0,0,.35);
    --choice-sel-bg:linear-gradient(135deg,#241d10,#1c2029);
    --switch-knob:#fff;

    /* Cartes particulières */
    --dash-solde-bg:radial-gradient(120% 90% at 50% 0%, rgba(245,166,35,.07), rgba(245,166,35,0) 60%), linear-gradient(180deg,#1f252f 0%,#1a1f28 100%);
    --carte-bandeau-shadow:inset 0 1px 0 rgba(255,255,255,.035), 0 8px 18px -10px rgba(0,0,0,.65);
    --carte-bandeau-border:rgba(255,255,255,.075);
    --pointilles-border:rgba(255,255,255,.12);
    --pointilles-bg:rgba(255,255,255,.018);
    --vide-border:rgba(255,255,255,.1);
    --vide-bg:rgba(255,255,255,.012);
    --mois-btn-bg:linear-gradient(120deg, rgba(245,166,35,.22) 0%, rgba(245,166,35,.08) 48%, rgba(245,166,35,.03) 100%), #1b2029;
    --mois-btn-border:rgba(245,166,35,.6);
    --mois-btn-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 10px 22px -12px rgba(245,166,35,.55);
    --pastille-ring:#1d1f22;
    /* Revente : carte « Caisse à date » (Ce mois-ci) */
    --caisse-bg:radial-gradient(120% 120% at 0% 0%, rgba(245,166,35,.2), rgba(245,166,35,0) 60%), linear-gradient(135deg,#221c12,#1b2029);
    --caisse-border:rgba(245,166,35,.6);
    --caisse-neg-bg:radial-gradient(120% 120% at 0% 0%, rgba(255,107,94,.18), rgba(255,107,94,0) 60%), linear-gradient(135deg,#271716,#1b2029);
    --caisse-neg-border:rgba(255,107,94,.6);

    /* Sélections ambre (choix actif, rubrique, modèle, puce) et badges ambre ;
       bouton « danger » ; badge « Autre source » ; texte indicatif des champs. */
    --sel-bg-12:rgba(245,166,35,.12);
    --sel-bg-10:rgba(245,166,35,.1);
    --badge-ambre-bg:rgba(245,166,35,.14);
    --danger-bg:rgba(255,107,94,.1);
    --danger-border:rgba(255,107,94,.38);
    /* Sombre : 4,5:1 atteint avec un fond de badge un peu plus léger qu'en E (.15),
       comme pour le badge « Crédit » de Coiffure 8D. */
    --badge-autre-bg:rgba(232,120,140,.12);
    /* Sprint Revente-F : badge bleu « Commande spéciale » porté à 4,5:1 (il
       était à 3,9:1 en E) : bleu un peu plus clair, fond un peu plus léger. */
    --badge-bleu-bg:rgba(91,141,239,.12);
    --badge-bleu-texte:#7aa3f5;
    /* « Bientôt fini » dans le bandeau d'alerte du stock ; libellé et montant
       de la caisse quand elle est négative. */
    --alerte-texte:var(--accent);
    --caisse-neg-texte:var(--red);
    --placeholder:#8b93a1;

    /* Pastilles teintées des icônes (ambre = achats, vert = ventes,
       turquoise = bénéfice, bleu = épargne, rouge = sorties) */
    --t-ambre-bg:radial-gradient(circle at 30% 25%, rgba(245,166,35,.32), rgba(245,166,35,.08));
    --t-ambre-ring:inset 0 0 0 1px rgba(245,166,35,.26);
    --t-vert-bg:radial-gradient(circle at 30% 25%, rgba(52,179,126,.32), rgba(52,179,126,.08));
    --t-vert-ring:inset 0 0 0 1px rgba(52,179,126,.28);
    --t-turq-bg:radial-gradient(circle at 30% 25%, rgba(79,209,197,.28), rgba(79,209,197,.07));
    --t-turq-ring:inset 0 0 0 1px rgba(79,209,197,.24);
    --t-bleu-bg:radial-gradient(circle at 30% 25%, rgba(91,141,239,.32), rgba(91,141,239,.08));
    --t-bleu-ring:inset 0 0 0 1px rgba(91,141,239,.28);
    --t-rouge-bg:radial-gradient(circle at 30% 25%, rgba(255,107,94,.3), rgba(255,107,94,.08));
    --t-rouge-ring:inset 0 0 0 1px rgba(255,107,94,.26);
  }

  /* ---------- Thème clair : corps clair, cartes blanches, bandeau sombre ---------- */
  html[data-theme="clair"]{
    --bg:#eff1f4;
    --card:#ffffff;
    --card-2:#f1f3f6;
    --border:#d9dde4;
    --text:#151a22;          /* 17,5:1 sur blanc */
    --text-dim:#5a6372;      /* 6,1:1 */
    --accent:#9a5a00;        /* ambre « texte » : 5,5:1 */
    --accent-fill:#f5a623;   /* ambre « remplissage » : inchangé */
    --accent-dark:#c9840f;
    --on-accent:#1b1200;
    --green:#137a52;         /* 5,3:1 */
    --red:#c4382c;           /* 5,3:1 */
    --blue:#2b5bc0;          /* 6,3:1 */
    --turquoise:#0b766e;
    --pink:#b03d5a;          /* 5,7:1 */
    --line:#e3e6eb;
    --card-grad:linear-gradient(180deg,#ffffff 0%,#fcfcfd 100%);
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 10px 22px -14px rgba(16,24,40,.28);
    --shadow-sm:0 1px 2px rgba(16,24,40,.07);
    --filet:linear-gradient(90deg, rgba(21,26,34,.16), rgba(21,26,34,0));

    --bandeau-card-grad:linear-gradient(180deg,#232a35 0%,#1c222c 100%);
    --bandeau-shadow-sm:inset 0 1px 0 rgba(255,255,255,.04), 0 3px 8px -4px rgba(0,0,0,.5);
    --bandeau-filet:linear-gradient(90deg, rgba(255,255,255,.16), rgba(255,255,255,0));
    --header-bg:#141922;
    --header-border:none;
    --header-shadow:none;

    --tabbar-bg:#ffffff;
    --tabbar-shadow:0 -8px 20px -16px rgba(16,24,40,.35);
    --tab-actif-bg:rgba(245,166,35,.22);
    --tab-actif-ring:rgba(201,132,15,.45);
    --overlay:rgba(16,20,28,.45);
    --modal-bg:#ffffff;
    --modal-border:#e3e6eb;
    --modal-shadow:0 -14px 34px rgba(16,24,40,.18);
    --modal-poignee:#d0d4db;
    --maj-bg:#ffffff;
    --maj-shadow:0 8px 24px rgba(16,24,40,.18);

    --btn2-border:#d9dde4;
    --fab-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 10px 20px -8px rgba(201,132,15,.55);
    --seg-shadow:inset 0 1px 2px rgba(16,24,40,.08);
    --choice-sel-bg:#fff8ec;

    --dash-solde-bg:radial-gradient(120% 90% at 50% 0%, rgba(245,166,35,.10), rgba(245,166,35,0) 60%), #ffffff;
    --carte-bandeau-shadow:0 14px 28px -16px rgba(16,24,40,.45);
    --carte-bandeau-border:#ffffff;
    --pointilles-border:#c9ced7;
    --pointilles-bg:#fafbfc;
    --vide-border:#cfd4dc;
    --vide-bg:#fafbfc;
    --mois-btn-bg:linear-gradient(120deg, rgba(245,166,35,.22) 0%, rgba(245,166,35,.08) 48%, rgba(245,166,35,.03) 100%), #ffffff;
    --mois-btn-border:rgba(201,132,15,.6);
    --mois-btn-shadow:0 10px 22px -14px rgba(201,132,15,.6);
    --pastille-ring:#ffffff;
    --caisse-bg:radial-gradient(120% 120% at 0% 0%, rgba(245,166,35,.22), rgba(245,166,35,0) 60%), linear-gradient(135deg,#fff6e6,#ffffff);
    --caisse-border:rgba(201,132,15,.6);
    --caisse-neg-bg:radial-gradient(120% 120% at 0% 0%, rgba(255,107,94,.18), rgba(255,107,94,0) 60%), linear-gradient(135deg,#fdeeec,#ffffff);
    --caisse-neg-border:rgba(196,56,44,.5);

    --sel-bg-12:#fff5e3;
    --sel-bg-10:#fff5e3;
    --badge-ambre-bg:#fff1d9;
    --danger-bg:#fdf2f0;
    --danger-border:rgba(196,56,44,.38);
    --badge-autre-bg:rgba(232,120,140,.15);
    --badge-bleu-bg:rgba(91,141,239,.15);
    --badge-bleu-texte:var(--blue);
    --alerte-texte:#8c5100;     /* 5,2:1 sur le fond ambre du bandeau d'alerte */
    --caisse-neg-texte:#b02c20; /* 4,9:1 sur le fond rosé de la caisse négative */
    --placeholder:#5f6776;

    --t-ambre-bg:radial-gradient(circle at 30% 25%, rgba(245,166,35,.42), rgba(245,166,35,.14));
    --t-ambre-ring:inset 0 0 0 1px rgba(201,132,15,.30);
    --t-vert-bg:radial-gradient(circle at 30% 25%, rgba(52,179,126,.36), rgba(52,179,126,.12));
    --t-vert-ring:inset 0 0 0 1px rgba(19,122,82,.24);
    --t-turq-bg:radial-gradient(circle at 30% 25%, rgba(79,209,197,.38), rgba(79,209,197,.12));
    --t-turq-ring:inset 0 0 0 1px rgba(11,118,110,.22);
    --t-bleu-bg:radial-gradient(circle at 30% 25%, rgba(91,141,239,.34), rgba(91,141,239,.12));
    --t-bleu-ring:inset 0 0 0 1px rgba(43,91,192,.22);
    --t-rouge-bg:radial-gradient(circle at 30% 25%, rgba(255,107,94,.34), rgba(255,107,94,.12));
    --t-rouge-ring:inset 0 0 0 1px rgba(196,56,44,.22);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    height:100%; overscroll-behavior-y:none; color-scheme:dark;}
  /* Dates, listes et champs natifs lisibles dans le thème choisi. */
  html[data-theme="clair"], html[data-theme="clair"] body{color-scheme:light;}
  /* Sprint Revente-E : chiffres à chasse fixe sur tous les montants (ils
     s'alignent et ne « dansent » pas). Pas sur le texte courant : dans la
     police système Android, l'option élargit aussi les traits d'union
     (« mois - ci »). */
  .db-amount, .mt-val, .cb-amount, .entry-amount, .entry-sub, .ds-amount, .sms-val, .er-val, .eb-val, .cr-amount,
  .cd-v, .sv, .mvt-n, .dv, .oc-montant, .oc-sub, .es-val, .en-label, .periode-titre, .tp-sub, input[type=number], input[type=date],
  .modifie-le, .zone-titre, .about-line b{font-variant-numeric:tabular-nums;}
  #app{min-height:100%; display:flex; flex-direction:column;
    /* Sprint Revente-E : le léger glissement des transitions d'écran ne doit
       jamais créer de défilement passager (clip ≠ hidden : l'en-tête reste
       collant et la page défile normalement). */
    overflow:clip;}
  a{color:inherit;}
  button{font-family:inherit; color:inherit;}

  /* ---------- Header ---------- */
  .header{
    /* Sprint Revente-F : l'en-tête garde l'identité MonDjai (bandeau sombre)
       dans les deux thèmes — ses éléments lisent les couleurs du bandeau. */
    --text:var(--bandeau-text); --text-dim:var(--bandeau-text-dim); --line:var(--bandeau-line);
    --card-grad:var(--bandeau-card-grad); --card-2:var(--bandeau-card-2); --shadow-sm:var(--bandeau-shadow-sm);
    color:var(--text);
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:calc(15px + var(--safe-top)) 16px 13px;
    background:var(--header-bg);
    border-bottom:var(--header-border);
    box-shadow:var(--header-shadow);
    position:sticky; top:0; z-index:5;
  }
  .brand{display:flex; align-items:center; gap:9px; min-width:0;}
  .brand-emoji{font-size:22px; flex:none;}
  .brand-text{display:flex; flex-direction:column; line-height:1.18; min-width:0;}
  .brand-title{font-size:15px; font-weight:800; letter-spacing:.005em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .brand-sub{font-size:10.5px; color:var(--text-dim); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .icon-btn{
    background:var(--card-grad); border:1px solid var(--line); color:var(--text);
    width:38px; height:38px; border-radius:12px; font-size:17px; box-shadow:var(--shadow-sm);
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .icon-btn:active{background:var(--card-2);}
  /* Petits écrans (360 px) : le nom de l'application reste entier. */
  @media (max-width:380px){
    .header{padding-left:14px; padding-right:14px; gap:6px;}
    .brand{gap:7px;}
    .brand-emoji{font-size:20px;}
    .brand-title{font-size:14px;}
    .header-icons{gap:5px;}
  }
  .icon-btn.epargne-shortcut{
    width:auto; padding:0 10px; gap:5px; flex-direction:row; font-size:15px; font-weight:800;
  }
  .icon-btn.epargne-shortcut .es-emoji{font-size:15px;}
  .icon-btn.epargne-shortcut .es-val{font-size:11px; font-weight:800; color:var(--text); white-space:nowrap;}

  /* ---------- Main ---------- */
  .main{flex:1; padding:14px 16px calc(24px + var(--safe-bottom)); display:flex; flex-direction:column;}
  .main.with-tabbar{padding-bottom: calc(96px + var(--safe-bottom));}

  /* Sprint Revente-E : titres de section suivis d'un fin filet */
  .section-title{display:flex; align-items:center; gap:10px; font-size:12.5px; font-weight:800; color:var(--text-dim); text-transform:uppercase;
    letter-spacing:.06em; margin:4px 0 10px;}
  .section-title::after{content:""; flex:1 1 auto; min-width:16px; height:1px;
    background:var(--filet);}
  .hint{font-size:12.5px; color:var(--text-dim); line-height:1.5;}
  .hint.tight{margin-top:4px;}

  /* ---------- Onboarding / full pages (no tabbar) ---------- */
  .onb{flex:1; display:flex; flex-direction:column; padding:calc(20px + var(--safe-top)) 20px calc(28px + var(--safe-bottom)); min-height:100%;}
  .onb-head{margin-bottom:18px;}
  .onb-emoji{font-size:40px;}
  .onb-title{font-size:22px; font-weight:800; margin:10px 0 6px;}
  .onb-desc{font-size:14px; color:var(--text-dim); line-height:1.5;}
  .onb-body{flex:1; display:flex; flex-direction:column; justify-content:center;}

  .choice-grid{display:flex; flex-direction:column; gap:12px;}
  .choice-card{
    display:flex; align-items:center; gap:14px;
    background:var(--card); border:1.5px solid var(--border); border-radius:16px;
    padding:16px 14px; text-align:left;
  }
  .choice-card.selected{border-color:var(--accent-fill); background:var(--choice-sel-bg);}
  .choice-card .emoji{font-size:30px; width:40px; text-align:center; flex:none;}
  .choice-card .cc-text{flex:1; min-width:0;}
  .choice-card .cc-title{font-size:15.5px; font-weight:700;}
  .choice-card .cc-desc{font-size:12.5px; color:var(--text-dim); margin-top:2px; line-height:1.4;}
  .choice-card .cc-check{
    width:24px; height:24px; border-radius:8px; border:1.5px solid var(--border);
    display:flex; align-items:center; justify-content:center; flex:none; font-size:14px;
    color:transparent; background:var(--card-2);
  }
  .choice-card.selected .cc-check{background:var(--accent-fill); border-color:var(--accent-fill); color:var(--on-accent);}

  .error-text{color:var(--red); font-size:12.5px; margin-top:10px; line-height:1.4;}

  .btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    border:none; border-radius:14px; padding:14px 16px; font-size:15px; font-weight:700;
    width:100%;
  }
  .btn-primary{background:linear-gradient(135deg,#f7b443,var(--accent-dark)); color:var(--on-accent);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 10px 20px -12px rgba(245,166,35,.75);}
  .btn-secondary{background:var(--card-grad); color:var(--text); border:1px solid var(--btn2-border); box-shadow:var(--shadow-sm);}
  .btn-ghost{background:transparent; color:var(--accent); border:none; padding:10px;}
  .btn-danger{background:var(--danger-bg); color:var(--red); border:1px solid var(--danger-border);}
  .btn:active{opacity:.88;}
  .btn:disabled{opacity:.4; pointer-events:none;}
  .btn-row{display:flex; gap:10px; margin-top:14px;}
  .btn-row .btn{width:auto; flex:1;}

  /* ---------- Tab bar ---------- */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:6;
    display:flex; background:var(--tabbar-bg); border-top:1px solid var(--line);
    box-shadow:var(--tabbar-shadow);
    padding:7px 4px calc(8px + var(--safe-bottom));
  }
  .tab{
    flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:transparent; border:none; color:var(--text-dim); padding:2px 1px; border-radius:12px;
  }
  /* Sprint Revente-E : l'onglet actif est marqué par une pastille ambre. */
  .tab .tab-emoji{font-size:19px; line-height:1; width:54px; max-width:100%; height:30px; border-radius:999px;
    display:flex; align-items:center; justify-content:center;}
  .tab .tab-label{font-size:10.5px; font-weight:600; white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis;}
  /* Sprint Revente-C : 5 onglets — libellés un peu plus serrés sur les petits écrans */
  @media (max-width:380px){ .tab .tab-label{font-size:9.8px; letter-spacing:-.01em;} }
  .tab.active{color:var(--accent);}
  .tab.active .tab-emoji{background:var(--tab-actif-bg); box-shadow:inset 0 0 0 1px var(--tab-actif-ring);}
  .tab.active .tab-label{font-weight:800;}

  /* ---------- List cards ---------- */
  .entry-list{display:flex; flex-direction:column; gap:10px; margin-top:4px;}
  .entry-card{
    background:var(--card-grad); border:1px solid var(--line); border-radius:var(--r-md); box-shadow:var(--shadow);
    padding:13px 14px; display:flex; align-items:center; gap:12px; text-align:left; color:var(--text);
  }
  .entry-card:active{background:var(--card-2);}
  .entry-ico{
    width:38px; height:38px; border-radius:12px; flex:none;
    display:flex; align-items:center; justify-content:center; font-size:18px;
    background:radial-gradient(circle at 30% 25%, rgba(245,166,35,.26), rgba(245,166,35,.08));
    box-shadow:inset 0 0 0 1px rgba(245,166,35,.2); color:var(--accent);
  }
  .entry-ico.ico-vente{background:radial-gradient(circle at 30% 25%, rgba(52,179,126,.28), rgba(52,179,126,.08)); box-shadow:inset 0 0 0 1px rgba(52,179,126,.24);}
  .entry-main{flex:1; min-width:0;}
  .entry-title{font-size:14.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  /* Sprint Revente-E : un nom de produit long est coupé, jamais le badge qui le suit. */
  .entry-title.et-flex{display:flex; align-items:center; min-width:0;}
  .entry-title .et-nom{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .entry-title .badge{flex:none;}
  .entry-sub{font-size:12px; color:var(--text-dim); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .entry-amount{font-size:14.5px; font-weight:800; color:var(--accent); flex:none; white-space:nowrap;}
  .entry-amount.neg{color:var(--red);}
  .entry-amount.pos{color:var(--green);}

  /* ---------- Cartes agrandies Achats / Ventes ---------- */
  .entry-list-lg{flex:1;}
  .entry-card-lg{
    flex:1; min-height:108px; flex-direction:column; justify-content:center;
    align-items:center; text-align:center; gap:8px; padding:22px 16px;
  }
  .entry-card-lg .entry-ico{width:50px; height:50px; font-size:23px;}
  .entry-card-lg .entry-main{width:100%;}
  .entry-card-lg .entry-title{white-space:normal; font-size:16px;}
  .entry-card-lg .entry-title.et-flex{justify-content:center; flex-wrap:wrap; row-gap:4px;}
  .entry-card-lg .entry-title .et-nom{white-space:normal;}
  .entry-card-lg .entry-sub{white-space:normal; margin-top:3px;}
  .entry-card-lg .entry-amount{font-size:21px; margin-top:2px;}
  .badge{
    display:inline-block; vertical-align:1px; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:999px;
    background:var(--badge-bleu-bg); color:var(--badge-bleu-texte); margin-left:6px;
  }

  /* Sprint Revente-E : états vides plus soignés (pastille, cadre en pointillés discret) */
  .empty-state{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:28px 16px; color:var(--text-dim); gap:8px;
    border:1px dashed var(--vide-border); border-radius:var(--r-lg); background:var(--vide-bg);
  }
  .empty-state .es-emoji{width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:29px; margin-bottom:4px;
    background:radial-gradient(circle at 30% 25%, rgba(245,166,35,.24), rgba(245,166,35,.05));
    box-shadow:inset 0 0 0 1px rgba(245,166,35,.22);}
  .empty-state .es-title{font-size:14.5px; font-weight:800; color:var(--text);}
  .empty-state .es-desc{font-size:12.5px; max-width:260px; line-height:1.5;}

  .fab{
    position:fixed; right:18px; bottom:calc(92px + var(--safe-bottom)); z-index:7;
    width:56px; height:56px; border-radius:18px; border:none;
    background:linear-gradient(135deg,#f7b443,var(--accent-dark));
    color:var(--on-accent); font-size:26px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    box-shadow:var(--fab-shadow);
  }
  .fab:active{transform:scale(.96);}

  /* ---------- Forms ---------- */
  .field{margin-bottom:16px;}
  .field .label{display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:var(--text-dim); margin-bottom:7px;}
  .field .label .req{color:var(--accent);}
  .input, .select, .textarea{
    width:100%; background:var(--card-2); border:1px solid var(--border); color:var(--text);
    border-radius:12px; padding:12px 13px; font-size:15px; appearance:none;
  }
  .select{background-image:linear-gradient(45deg, transparent 50%, var(--text-dim) 50%), linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
    background-position: calc(100% - 20px) 21px, calc(100% - 15px) 21px; background-size:5px 5px, 5px 5px; background-repeat:no-repeat;
    padding-right:36px;}
  .input:focus, .select:focus, .textarea:focus{outline:2px solid var(--accent); outline-offset:0;}
  /* Texte indicatif des champs lisible (≥ 4,5:1 sur le fond du champ). */
  .input::placeholder{color:var(--placeholder); opacity:1;}
  .field-error{color:var(--red); font-size:12px; margin-top:6px;}
  .field-note{color:var(--text-dim); font-size:11.5px; margin-top:6px; line-height:1.4;}
  .inline-new{margin-top:10px; display:flex; gap:8px;}
  .inline-new .input{flex:1;}
  .inline-new .btn{width:auto; padding:10px 14px; font-size:13px;}

  .radio-row{display:flex; gap:10px;}
  .radio-opt{
    flex:1; text-align:center; background:var(--card-2); border:1px solid var(--border); color:var(--text-dim);
    border-radius:12px; padding:12px 8px; font-size:13px; font-weight:700;
  }
  .radio-opt.active{border-color:rgba(245,166,35,.85); color:var(--accent); background:var(--sel-bg-12);
    box-shadow:inset 0 0 0 1px rgba(245,166,35,.35);}

  .chip-wrap{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    background:var(--card-2); border:1.5px solid var(--border); color:var(--text-dim);
    border-radius:999px; padding:9px 14px; font-size:13px; font-weight:600;
  }
  .chip.active{border-color:var(--accent-fill); color:var(--accent); background:var(--sel-bg-10);}
  .chip.dashed{border-style:dashed;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:var(--overlay); z-index:20;
    display:flex; align-items:flex-end;
  }
  /* Sprint Revente-E : feuille du bas avec une poignée grise */
  .modal{
    width:100%; max-height:88vh; overflow-y:auto; background:var(--modal-bg);
    border-radius:22px 22px 0 0; border-top:1px solid var(--modal-border);
    box-shadow:var(--modal-shadow);
    padding:10px 18px calc(20px + var(--safe-bottom));
  }
  .modal::before{content:""; display:block; width:40px; height:4px; border-radius:999px; background:var(--modal-poignee); margin:0 auto 12px;}
  .modal-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px;}
  .modal-title{font-size:17px; font-weight:800; min-width:0;}
  .modal-close{background:var(--card-grad); border:1px solid var(--line); color:var(--text-dim); flex:none;
    width:32px; height:32px; border-radius:10px; font-size:15px; display:flex; align-items:center; justify-content:center;}

  .detail-row{display:flex; justify-content:space-between; gap:14px; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px;}
  .detail-row:last-of-type{border-bottom:none;}
  .detail-row .dk{color:var(--text-dim);}
  .detail-row .dv{font-weight:700; text-align:right;}

  .confirm-box{background:rgba(255,107,94,.08); border:1px solid rgba(255,107,94,.3); border-radius:14px; padding:14px; margin-top:14px;}
  .confirm-box p{margin:0 0 12px; font-size:13.5px; color:var(--text);}

  /* ---------- Réglages / À propos ---------- */
  .reglages-section{margin-bottom:22px;}
  .reglages-section .rs-title{display:flex; align-items:center; gap:10px; font-size:12.5px; font-weight:800; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px;}
  .reglages-section .rs-title::after{content:""; flex:1 1 auto; min-width:16px; height:1px;
    background:var(--filet);}
  .profil-row{
    display:flex; align-items:center; gap:12px; background:var(--card-grad); border:1px solid var(--line); box-shadow:var(--shadow);
    border-radius:var(--r-md); padding:13px 14px; margin-bottom:10px;
  }
  .profil-row.soon{opacity:1;}
  .profil-row .pr-emoji{font-size:22px; width:30px; text-align:center; flex:none;}
  .profil-row .pr-text{flex:1;}
  .profil-row .pr-title{font-size:14.5px; font-weight:700; display:flex; align-items:center; gap:8px;}
  .profil-row .pr-desc{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
  .badge-soon{
    display:inline-block; font-size:10px; font-weight:800; padding:2px 8px; border-radius:999px;
    background:var(--badge-ambre-bg); color:var(--accent); text-transform:uppercase; letter-spacing:.03em;
  }
  .switch{
    width:46px; height:28px; border-radius:999px; background:var(--card-2); border:1px solid var(--border);
    position:relative; flex:none;
  }
  .switch.on{background:var(--accent-fill); border-color:var(--accent-fill);}
  .switch .knob{position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%; background:var(--switch-knob); transition:left .15s;}
  html[data-theme="clair"] .switch:not(.on) .knob{box-shadow:0 1px 2px rgba(16,24,40,.25);}
  .switch.on .knob{left:20px; background:var(--on-accent);}

  .about-line{font-size:14px; color:var(--text-dim); line-height:1.6; margin-bottom:10px;}
  .mission{font-size:15.5px; font-weight:700; color:var(--text); margin:18px 0 8px;}

  /* ---------- Aujourd'hui ---------- */
  .dash-solde{
    background:var(--dash-solde-bg);
    border:1px solid var(--line); box-shadow:var(--shadow);
    border-radius:var(--r-lg); padding:18px 18px; text-align:center; margin-bottom:14px;
  }
  .dash-solde .ds-label{font-size:11.5px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em;}
  .dash-solde .ds-amount{font-size:31px; font-weight:800; margin-top:6px; letter-spacing:-.01em;}
  .dash-solde .ds-amount.neg{color:var(--red);}
  .dash-solde .ds-amount.pos{color:var(--green);}
  .dash-solde .ds-note{font-size:12px; color:var(--text-dim); margin-top:10px; line-height:1.4;}
  .dash-perte{
    margin-top:12px; background:rgba(255,107,94,.12); border:1px solid rgba(255,107,94,.35);
    border-radius:12px; padding:9px 12px; font-size:12.5px; color:var(--red); font-weight:600; line-height:1.4;
  }
  .solde-mini-stats{display:flex; margin-top:14px; padding-top:13px; border-top:1px solid var(--line);}
  .solde-mini-stats .sms-col{flex:1; text-align:center;}
  .solde-mini-stats .sms-col + .sms-col{border-left:1px solid var(--line);}
  .solde-mini-stats .sms-label{font-size:11.5px; color:var(--text-dim);}
  .solde-mini-stats .sms-val{font-size:15px; font-weight:800; margin-top:4px;}
  .solde-mini-stats .sms-val.neg{color:var(--red);}
  .dash-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px;}
  .dash-block{background:var(--card-grad); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:var(--r-lg);
    padding:22px 12px; text-align:center; color:var(--text); appearance:none; -webkit-appearance:none; font:inherit;}
  .dash-block .db-emoji{font-size:30px;}
  .dash-block .db-label{font-size:11px; color:var(--text-dim); margin-top:6px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;}
  .dash-block .db-amount{font-size:24px; font-weight:800; margin-top:10px; letter-spacing:-.01em;}
  .dash-block .db-amount.pos{color:var(--green);}
  .dash-block.charges .db-amount{color:var(--red);}
  .dash-block.info{border-style:dashed; border-color:var(--pointilles-border); background:var(--pointilles-bg); box-shadow:none;}
  .charges-card-wrap{margin-top:26px;}
  /* Sprint Revente-E : icônes dans des pastilles teintées (ambre = achats,
     vert = ventes, turquoise = bénéfice, bleu = épargne, rouge = sorties). */
  .db-ico{width:52px; height:52px; border-radius:50%; margin:0 auto; display:flex; align-items:center; justify-content:center; line-height:1;}
  .t-ambre{background:var(--t-ambre-bg); box-shadow:var(--t-ambre-ring);}
  .t-vert{background:var(--t-vert-bg); box-shadow:var(--t-vert-ring);}
  .t-turq{background:var(--t-turq-bg); box-shadow:var(--t-turq-ring);}
  .t-bleu{background:var(--t-bleu-bg); box-shadow:var(--t-bleu-ring);}
  .t-rouge{background:var(--t-rouge-bg); box-shadow:var(--t-rouge-ring);}
  /* Sprint Revente-C : écran Aujourd'hui plein écran — la grille s'étire entre
     l'en-tête et la barre du bas (--tabbar-h, mesurée après chaque rendu), sans
     espace vide en dessous. Pas de bouton flottant « + » sur cet écran. */
  /* Sprint Revente-E : la zone « Ce mois-ci » n'est plus affichée en
     permanence — un bouton en bas l'ouvre dans une feuille du bas. Les 4 blocs
     du jour reprennent la hauteur libérée ; le bas du bouton « Ce mois-ci »
     touche la barre du bas. Tailles indexées sur la hauteur d'écran pour tenir
     aussi en 360×640 sans défilement. */
  .main.ecran-aujourdhui{padding-top:12px; padding-bottom:var(--tabbar-h, 74px); gap:10px;}
  .main.ecran-aujourdhui .zone-titre{margin:0;}
  .main.ecran-aujourdhui .dash-grid{flex:1 1 auto; grid-template-rows:1fr 1fr; gap:10px; margin-bottom:0; min-height:0;}
  .main.ecran-aujourdhui .dash-block{display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:8px; min-height:80px;}
  .main.ecran-aujourdhui .dash-block .db-ico{width:clamp(40px, 7.2vh, 62px); height:clamp(40px, 7.2vh, 62px); font-size:clamp(20px, 3.5vh, 30px);}
  .main.ecran-aujourdhui .dash-block .db-amount{font-size:clamp(18px, 3.5vh, 30px); margin-top:clamp(6px, 1.4vh, 14px); line-height:1.15;}
  .main.ecran-aujourdhui .dash-block .db-label{font-size:10.5px; margin-top:clamp(2px, .5vh, 5px);}
  .main.ecran-aujourdhui .charges-card-wrap{margin-top:0;}
  .main.ecran-aujourdhui .charges-row{padding:9px 14px;}
  .main.ecran-aujourdhui .caisse-zone, .main.ecran-aujourdhui .caisse-zone:last-child{margin-bottom:0;}

  /* ---------- Sprint Revente-E : bouton « Ce mois-ci » (accent ambre, plus haut que Charges communes) ---------- */
  .mois-btn{position:relative; flex:none; width:100%; display:flex; align-items:center; gap:12px; text-align:left;
    padding:12px 14px 12px 12px; border-radius:var(--r-lg); color:var(--text); font:inherit; appearance:none; -webkit-appearance:none;
    background:var(--mois-btn-bg);
    border:1px solid var(--mois-btn-border);
    box-shadow:var(--mois-btn-shadow);}
  .mois-btn .cm-ico{position:relative; flex:none; width:44px; height:44px; border-radius:14px; display:flex; align-items:center; justify-content:center;
    font-size:22px; line-height:1; background:radial-gradient(circle at 30% 25%, rgba(245,166,35,.42), rgba(245,166,35,.14));
    box-shadow:inset 0 0 0 1px rgba(245,166,35,.45);}
  .mois-btn .cm-main{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px;}
  .mois-btn .cm-titre{font-size:clamp(14px, 4.1vw, 16px); font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .mois-btn .cm-titre .cm-mois{color:var(--accent);}
  .mois-btn .cm-sous{font-size:12px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  /* Sprint Revente-F (2) — bouton « + » aussi sur Aujourd'hui (saisie rapide
     d'une vente). Comme chez Coiffure, il se pose dans un couloir laissé
     libre à droite du dernier élément (le bouton « Ce mois-ci »), juste
     au-dessus de la barre du bas et centré sur ce bouton : il ne masque
     jamais un texte ni un montant. Le chevron › laisse sa place au « + ». */
  .main.ecran-aujourdhui .mois-btn{padding-right:68px;}
  .fab.fab-aujourdhui{bottom:calc(var(--tabbar-h, 74px) + 7px);}
  body.maj-visible .fab.fab-aujourdhui{bottom:calc(var(--tabbar-h, 74px) + 62px + 7px);}
  /* Caisse à date négative : petite pastille rouge (le message doux reste dans le contenu). */
  .mois-btn .cm-pastille{position:absolute; top:-4px; right:-4px; width:13px; height:13px; border-radius:50%;
    background:var(--red); box-shadow:0 0 0 2.5px var(--pastille-ring);}

  /* ---------- Contenu de « Ce mois-ci » (feuille du bas) ---------- */
  .mois-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .mois-tile{position:relative; background:var(--pointilles-bg); border:1px dashed var(--pointilles-border); border-radius:var(--r-md); padding:12px 13px;
    display:flex; flex-direction:column; justify-content:center; align-items:flex-start; min-height:78px; min-width:0;
    text-align:left; color:var(--text); font:inherit; appearance:none; -webkit-appearance:none;}
  .mois-tile.mois-tile-btn{border-style:solid; border-color:var(--line); background:var(--card-grad); box-shadow:var(--shadow);}
  .mois-tile.mois-tile-btn:active{background:var(--card-2);}
  .mois-tile .mt-chev{position:absolute; top:9px; right:11px; font-size:17px; line-height:1; color:var(--text-dim);}
  .mois-tile .mt-label{font-size:10.5px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
  .mois-tile .mt-val{font-size:21px; font-weight:800; margin-top:5px; white-space:nowrap; line-height:1.15; letter-spacing:-.01em;}
  .mois-tile .mt-val.pos{color:var(--green);}
  .mois-tile .mt-val.neg{color:var(--red);}
  .mois-tile .mt-note{font-size:10.5px; color:var(--text-dim); margin-top:3px; white-space:nowrap;}
  .caisse-bloc{margin-top:12px; width:100%; display:flex; align-items:center; gap:14px; text-align:left;
    background:var(--caisse-bg);
    border:1px solid var(--caisse-border); border-radius:var(--r-lg); box-shadow:var(--shadow);
    padding:14px 16px; color:var(--text); font:inherit; appearance:none; -webkit-appearance:none; flex:none;}
  .caisse-bloc:active{opacity:.92;}
  .caisse-bloc.caisse-neg{border-color:var(--caisse-neg-border);
    background:var(--caisse-neg-bg);}
  .caisse-bloc .cb-emoji{flex:none; width:50px; height:50px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:25px; line-height:1;}
  .caisse-bloc .cb-main{flex:1; min-width:0;}
  .caisse-bloc .cb-label{font-size:11.5px; font-weight:800; color:var(--accent); text-transform:uppercase; letter-spacing:.06em;}
  .caisse-bloc.caisse-neg .cb-label{color:var(--caisse-neg-texte);}
  .caisse-bloc .cb-amount{font-size:32px; font-weight:800; line-height:1.12; white-space:nowrap; letter-spacing:-.01em; margin-top:2px;}
  .caisse-bloc .cb-amount.neg{color:var(--caisse-neg-texte);}
  .caisse-bloc .cb-chev{font-size:24px; color:var(--accent); flex:none;}
  .caisse-negative{font-size:12px; font-weight:600; color:var(--caisse-neg-texte); margin-top:4px; line-height:1.35;}
  .mois-aide{font-size:12px; color:var(--text-dim); text-align:center; margin-top:12px;}
  /* Petits écrans (ex. 360×640) : marges resserrées pour que l'écran
     Aujourd'hui tienne sans défilement. */
  @media (max-height:700px){
    .main.ecran-aujourdhui{padding-top:9px; gap:8px;}
    .main.ecran-aujourdhui .dash-grid{gap:8px;}
    .main.ecran-aujourdhui .dash-block{padding:4px 8px;}
    .main.ecran-aujourdhui .charges-row{padding:8px 14px;}
    .mois-btn{padding:9px 12px 9px 10px; gap:10px;}
    .mois-btn .cm-ico{width:38px; height:38px; font-size:19px; border-radius:12px;}
    .mois-btn .cm-sous{font-size:11.5px;}
    .fab.fab-aujourdhui{bottom:calc(var(--tabbar-h, 74px) + 1px);}
    body.maj-visible .fab.fab-aujourdhui{bottom:calc(var(--tabbar-h, 74px) + 62px + 1px);}
    .mois-tile{min-height:70px; padding:10px 12px;}
    .caisse-bloc{padding:12px 14px;}
  }
  .caisse-detail{background:var(--card-grad); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:var(--r-md); padding:4px 14px;}
  .cd-row{display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px;}
  .cd-row:last-child{border-bottom:none;}
  .cd-row .cd-k{color:var(--text-dim);}
  .cd-row .cd-v{font-weight:700; text-align:right; white-space:nowrap;}
  .cd-row.cd-pos .cd-v{color:var(--green);}
  .cd-row.cd-neg .cd-v{color:var(--red);}
  .cd-row.cd-sub{padding:6px 0 6px 14px; font-size:12.5px; border-bottom-style:dashed;}
  .cd-row.cd-sub .cd-k::before{content:"· ";}
  .cd-row.cd-sub .cd-v{font-weight:600; color:var(--text-dim);}
  .cd-row.cd-total{padding:13px 0 11px; border-top:1.5px solid var(--accent); border-bottom:none;}
  .cd-row.cd-total .cd-k{color:var(--text); font-weight:800; text-transform:uppercase; font-size:12.5px; letter-spacing:.04em;}
  .cd-row.cd-total .cd-v{font-size:22px; font-weight:800; color:var(--accent);}
  .cd-row.cd-total.cd-total-neg .cd-v{color:var(--red);}
  /* Onglets Achats et Ventes : la fin de la page s'arrête au-dessus du bouton
     « + », qui ne masque jamais un montant ni un champ. */
  .main.ecran-achatvente{padding-bottom:calc(164px + var(--safe-bottom));}
  .charges-row{
    display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    background:var(--card-grad); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:var(--r-md);
    padding:12px 14px; appearance:none; -webkit-appearance:none; font:inherit; color:var(--text);
  }
  .charges-row .cr-emoji{flex:none; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; line-height:1;}
  .charges-row .cr-label{flex:1; min-width:0; font-size:11.5px; font-weight:700; color:var(--text-dim);
    text-transform:uppercase; letter-spacing:.05em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .charges-row .cr-amount{font-size:16px; font-weight:800; color:var(--red); flex:none; white-space:nowrap;}
  .charges-row .cr-chev{flex:none; font-size:18px; line-height:1; color:var(--text-dim);}
  .charges-row.charges-row-vide{border-style:dashed; border-color:var(--pointilles-border); background:var(--pointilles-bg); box-shadow:none;}
  .charges-row.charges-row-vide .cr-label{color:var(--text-dim);}

  .caisse-zone{margin-bottom:22px;}
  .caisse-zone:last-child{margin-bottom:6px;}

  /* ---------- F4 : Suivi de stock ---------- */
  .stock-card{background:var(--card-grad); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:var(--r-md); padding:13px 14px; margin-bottom:10px;}
  .stock-card .sc-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px;}
  .stock-card .sc-nom{font-size:14.5px; font-weight:800; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .stock-card .sc-alerte{flex:none; font-size:10.5px; font-weight:800; color:var(--accent); background:var(--badge-ambre-bg);
    box-shadow:inset 0 0 0 1px rgba(245,166,35,.3); padding:3px 9px; border-radius:999px;}
  .stock-card .sc-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px 12px; font-size:12.5px;}
  .stock-card .sc-grid .sk{color:var(--text-dim);}
  .stock-card .sc-grid .sv{font-weight:700; text-align:right;}
  /* Sprint Revente-E : « Me prévenir quand il reste [ 3 ] paquet(s) » */
  .stock-card .sc-seuil{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:10px; padding-top:10px; border-top:1px solid var(--line);}
  .stock-card .sc-seuil-txt{font-size:12px; color:var(--text-dim); min-width:0;}
  .stock-card .sc-seuil-val{display:flex; align-items:center; gap:7px; flex:none; font-size:12px; color:var(--text-dim);}
  .stock-card .sc-seuil input{width:56px; background:var(--card-2); border:1px solid var(--border); color:var(--text);
    border-radius:9px; padding:6px 6px; font-size:14px; font-weight:700; text-align:center; font-variant-numeric:tabular-nums;}

  /* ---------- Mon état ---------- */
  /* Sprint Revente-E : Jour / Semaine / Mois en contrôle segmenté (pastille ambre teintée) */
  .etat-tabs{display:flex; gap:4px; margin-bottom:14px; padding:4px; background:var(--card); border:1px solid var(--line); border-radius:var(--r-md);}
  .etat-tab{flex:1; text-align:center; background:transparent; border:none; color:var(--text-dim);
    border-radius:10px; padding:9px 6px; font-size:13px; font-weight:700;}
  .etat-tab.active{color:var(--accent); background:rgba(245,166,35,.15); box-shadow:inset 0 0 0 1px rgba(245,166,35,.5);}
  .etat-nav{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px;}
  .etat-nav .en-btn{background:var(--card-grad); border:1px solid var(--line); box-shadow:var(--shadow-sm); color:var(--text); width:38px; height:38px;
    border-radius:12px; font-size:18px; display:flex; align-items:center; justify-content:center; flex:none;}
  .etat-nav .en-btn:disabled{opacity:.3; box-shadow:none;}
  .etat-nav .en-label{font-size:14px; font-weight:800; text-align:center; flex:1;}
  .etat-stats{display:flex; flex-direction:column; gap:8px; margin-bottom:16px;}
  .etat-stat-row{display:flex; justify-content:space-between; align-items:center; background:var(--card-grad); border:1px solid var(--line);
    border-radius:12px; padding:11px 14px;}
  .etat-stat-row .er-label{font-size:13px; color:var(--text-dim);}
  .etat-stat-row .er-val{font-size:15px; font-weight:800;}
  .etat-stat-row .er-val.neg{color:var(--red);}
  .etat-breakdown{margin-top:6px; margin-bottom:18px;}
  .etat-breakdown .eb-title{font-size:12.5px; font-weight:700; color:var(--text-dim); margin-bottom:8px;}
  .eb-row{display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .eb-row:last-child{border-bottom:none;}
  .eb-row .eb-nom{color:var(--text); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .eb-row .eb-val{font-weight:700; white-space:nowrap;}
  .eb-row .eb-sub{color:var(--text-dim); font-weight:600; font-size:11.5px;}
  .top-produit-card{background:radial-gradient(120% 120% at 0% 0%, rgba(245,166,35,.1), rgba(245,166,35,0) 55%), var(--card-grad);
    border:1px solid var(--line); box-shadow:var(--shadow); border-radius:var(--r-lg); padding:16px; margin-bottom:16px;
    display:flex; align-items:center; gap:12px;}
  .top-produit-card .tp-emoji{font-size:24px; flex:none; width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 30% 25%, rgba(245,166,35,.32), rgba(245,166,35,.08)); box-shadow:inset 0 0 0 1px rgba(245,166,35,.26);}
  .top-produit-card .tp-nom{font-size:15px; font-weight:800;}
  .top-produit-card .tp-sub{font-size:12px; color:var(--text-dim); margin-top:2px;}

  /* ---------- Header : plusieurs icônes ---------- */
  .header-icons{display:flex; align-items:center; gap:6px; flex:none;}

  /* ---------- Code d'accès / PIN ---------- */
  .code-acces-onb .onb-body{align-items:center; text-align:center;}
  .code-acces-onb .onb-title, .code-acces-onb .onb-desc{width:100%;}
  .code-acces-lock{font-size:52px; margin-bottom:4px;}
  .code-acces-field{width:100%; margin-top:22px; margin-bottom:0;}
  .code-acces-input{
    text-align:center; letter-spacing:.2em; text-transform:uppercase;
    font-size:19px; font-weight:800; border:2px solid var(--accent-fill);
    background:rgba(245,166,35,.07);
  }
  .code-acces-input:focus{outline:2px solid var(--accent-fill); outline-offset:1px;}
  .code-acces-mention{
    margin-top:16px; font-size:11px; color:var(--text-dim); text-align:center; line-height:1.5;
  }
  .pin-dots{display:flex; justify-content:center; gap:14px; margin:18px 0 22px;}
  .pin-dot{width:16px; height:16px; border-radius:50%; border:1.5px solid var(--border); background:var(--card-2);}
  .pin-dot.filled{background:var(--accent-fill); border-color:var(--accent-fill);}
  .pin-dot.filled.err{background:var(--red); border-color:var(--red);}
  .pin-keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; max-width:280px; margin:0 auto;}
  .pin-key{
    background:var(--card); border:1px solid var(--border); color:var(--text);
    border-radius:16px; font-size:20px; font-weight:700; padding:16px 0;
  }
  .pin-key:active{background:var(--card-2);}
  .pin-key-empty{background:transparent; border:none;}

  /* ---------- Objectif d'épargne ---------- */
  .objectif-rappel{
    background:rgba(91,141,239,.1); border:1px solid rgba(91,141,239,.3); border-radius:14px;
    padding:12px 14px; font-size:12.5px; color:var(--text); line-height:1.5; margin-bottom:16px;
  }
  .objectif-card{background:var(--card-grad); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:var(--r-lg); padding:16px; margin-bottom:12px;}
  .objectif-card .oc-head{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .objectif-card .oc-emoji{font-size:22px;}
  .objectif-card .oc-nom{font-size:15px; font-weight:800; flex:1;}
  .objectif-card .oc-montant{font-size:22px; font-weight:800; color:var(--accent);}
  .objectif-card .oc-sub{font-size:12px; color:var(--text-dim); margin-top:2px;}
  .objectif-card .oc-actions{display:flex; gap:8px; margin-top:12px;}
  .objectif-card .oc-actions .btn{font-size:12.5px; padding:10px;}
  .objectif-slot-vide{
    background:var(--card-2); border:1.5px dashed var(--border); border-radius:16px; padding:16px;
    margin-bottom:12px; text-align:center; position:relative; overflow:hidden;
  }
  .objectif-slot-vide .osv-ghost-icons{font-size:26px; letter-spacing:12px; opacity:.35; filter:blur(0.5px);}
  .objectif-slot-vide .osv-badge{
    display:inline-block; margin-top:10px; font-size:11.5px; font-weight:800; color:var(--accent);
    background:var(--badge-ambre-bg); border:1px solid rgba(245,166,35,.4); border-radius:999px; padding:5px 12px;
  }

  /* ---------- étape « Vous mettez de côté pour quoi ? » (modèles) ---------- */
  .modele-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px;}
  .modele-tile{
    background:var(--card-grad); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:var(--r-lg); padding:18px 10px;
    text-align:center; appearance:none; -webkit-appearance:none; font:inherit; color:var(--text);
  }
  .modele-tile.active{border-color:rgba(245,166,35,.85); background:var(--sel-bg-10); box-shadow:inset 0 0 0 1px rgba(245,166,35,.35);}
  .modele-tile .mt-emoji{font-size:30px; margin-bottom:8px;}
  .modele-tile .mt-nom{font-size:14px; font-weight:800;}
  .modele-tile .mt-desc{font-size:11px; color:var(--text-dim); margin-top:4px; line-height:1.3;}

  /* ---------- Télécharger ---------- */
  .partager-canvas-wrap{background:var(--card-grad); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:var(--r-lg); padding:10px; margin-bottom:16px; overflow:hidden;}
  .partager-canvas-wrap canvas{width:100%; height:auto; display:block; border-radius:10px;}
  .partager-canvas-wrap canvas.tc-blur-layer{width:calc(100% - 20px);}
  /* Sprint Revente-F : calque flou posé exactement sur l'aperçu et rogné à ses
     bords (en clair, le flou débordait en traînée grise sur le cadre blanc). */
  .tc-blur-layer{
    position:absolute; left:10px; top:10px;
    filter:blur(16px); clip-path:inset(0 round 10px);
    -webkit-mask-image:linear-gradient(to bottom, transparent 0%, transparent 28%, black 36%, black 100%);
    mask-image:linear-gradient(to bottom, transparent 0%, transparent 28%, black 36%, black 100%);
  }
  .partager-overlay-abo{
    position:absolute; left:50%; top:74%; transform:translate(-50%,-50%);
    background:rgba(17,20,26,.75); border:1px solid rgba(245,166,35,.5); color:var(--accent-fill);
    font-size:14px; font-weight:800; text-align:center; padding:12px 20px; border-radius:14px;
    max-width:80%; line-height:1.4;
  }

  /* ---------- Autres charges (rubriques) ---------- */
  .rub-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .rub-tile{
    display:flex; flex-direction:column; align-items:center; gap:6px; background:var(--card-2);
    border:1.5px solid var(--border); border-radius:14px; padding:12px 6px; text-align:center;
  }
  .rub-tile.selected{border-color:var(--accent-fill); background:var(--sel-bg-10);}
  .rub-tile .rub-icon{font-size:20px;}
  .rub-tile .rub-nom{font-size:11px; font-weight:600; line-height:1.25;}
  .rub-manage-row{
    display:flex; align-items:center; gap:12px; background:var(--card-grad); border:1px solid var(--line); box-shadow:var(--shadow-sm);
    border-radius:var(--r-md); padding:11px 14px; margin-bottom:8px;
  }
  .rub-manage-row .rm-emoji{font-size:18px; width:26px; text-align:center; flex:none;}
  .rub-manage-row .rm-nom{flex:1; font-size:13.5px; font-weight:600;}
  .rub-manage-row .rm-del{background:none; border:none; color:var(--text-dim); font-size:15px; padding:4px;}

  /* ---------- Écrans secondaires (Télécharger) : marges ---------- */
  .overlay-back{padding:calc(8px + var(--safe-top)) 8px 0;}
  .overlay-back .btn-ghost{width:auto; padding:10px 8px;}
  .overlay-body{padding:4px 16px calc(28px + var(--safe-bottom));}

  /* ---------- Sprint Revente-C : onglet Achats (sous-vues) ---------- */
  .seg{display:flex; gap:4px; background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); padding:4px; margin-bottom:14px;
    box-shadow:var(--seg-shadow);}
  .seg-btn{flex:1; background:transparent; border:none; color:var(--text-dim); border-radius:11px; padding:10px 6px; font-size:13px; font-weight:700;}
  .seg-btn.active{background:linear-gradient(135deg,#f7b443,var(--accent-dark)); color:var(--on-accent); font-weight:800;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.28), 0 4px 12px -6px rgba(245,166,35,.8);}
  /* Sprint Revente-E : sous-vue de l'onglet Achats (garde la chaîne flex pour les cartes agrandies) */
  .sous-vue{display:flex; flex-direction:column; flex:1 1 auto; min-height:0;}
  .periode-titre{font-size:13px; font-weight:700; color:var(--text); margin:0 0 10px;}
  .stock-alerte-bandeau{background:linear-gradient(135deg, rgba(245,166,35,.14), rgba(245,166,35,.05)); border:1px solid rgba(245,166,35,.38); color:var(--text);
    border-radius:var(--r-md); padding:11px 14px; font-size:12.5px; line-height:1.45; margin-bottom:14px;}
  .stock-alerte-bandeau b{color:var(--alerte-texte);}
  .mvt-table{background:var(--card-grad); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:var(--r-md); padding:2px 14px 0; margin-bottom:16px; overflow:hidden;}
  .mvt-row{display:grid; grid-template-columns:minmax(0,1fr) 58px 58px 62px; gap:6px; padding:10px 0;
    border-bottom:1px solid var(--line); font-size:13px; align-items:center;}
  .mvt-row:last-child{border-bottom:none;}
  .mvt-row.mvt-head{font-size:10px; font-weight:800; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; padding:11px 0 9px;}
  .mvt-row .mvt-nom{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600;}
  .mvt-row .mvt-n{text-align:right; font-weight:700; white-space:nowrap;}
  .mvt-row .mvt-n.in{color:var(--green);}
  .mvt-row .mvt-n.out{color:var(--red);}
  /* Sprint Revente-E : ligne TOTAL bien lisible (filet ambre, fond teinté) */
  .mvt-row.mvt-total{font-weight:800; margin:0 -14px; padding:12px 14px 13px; border-top:1.5px solid rgba(245,166,35,.6);
    background:linear-gradient(180deg, rgba(245,166,35,.11), rgba(245,166,35,.04)); font-size:14.5px;}
  .mvt-row.mvt-total .mvt-nom{font-weight:800; font-size:12px; color:var(--accent); text-transform:uppercase; letter-spacing:.07em;}
  .mvt-row.mvt-total .mvt-n{font-weight:800;}
  .mvt-row.mvt-total .mvt-n.fin{color:var(--text);}
  .entry-amount.mvt{font-size:12.5px; color:var(--text);}
  .entry-amount.mvt .in{color:var(--green);}
  .entry-amount.mvt .out{color:var(--red);}

  /* ---------- Sprint Revente-C : bannière « nouvelle version » (non bloquante) ---------- */
  #maj-banner{
    position:fixed; left:12px; right:12px; bottom:calc(12px + var(--safe-bottom)); z-index:40;
    display:flex; align-items:center; gap:10px; background:var(--maj-bg); border:1px solid rgba(245,166,35,.45);
    border-radius:14px; padding:10px 10px 10px 14px; box-shadow:var(--maj-shadow);
    font-size:13px; color:var(--text);
  }
  body.avec-tabbar #maj-banner{bottom:calc(var(--tabbar-h, 74px) + 8px);}
  body.modale-ouverte #maj-banner{bottom:calc(12px + var(--safe-bottom));}
  #maj-banner .mb-text{flex:1; line-height:1.35;}
  #maj-banner .mb-btn{flex:none; border:none; border-radius:10px; padding:9px 12px; font-size:13px; font-weight:800;
    background:linear-gradient(135deg,var(--accent-fill),var(--accent-dark)); color:var(--on-accent);}
  body.maj-visible .fab{bottom:calc(92px + 62px + var(--safe-bottom));}
  body.maj-visible .modal{padding-bottom:calc(20px + 72px + var(--safe-bottom));}
  body.maj-visible .main.with-tabbar{padding-bottom:calc(96px + 62px + var(--safe-bottom));}
  body.maj-visible .main.ecran-aujourdhui{padding-bottom:calc(var(--tabbar-h, 74px) + 62px);}
  .badge.badge-autre{background:var(--badge-autre-bg); color:var(--pink);}
  body.maj-visible .main.ecran-achatvente{padding-bottom:calc(164px + 62px + var(--safe-bottom));}
  body.maj-visible .onb, body.maj-visible .overlay-body{padding-bottom:calc(28px + 72px + var(--safe-bottom));}

  /* ---------- Sprint Revente-E : modifier un achat / une vente ---------- */
  .detail-actions{margin-top:16px;}
  .detail-actions .btn{padding:13px 10px;}
  .modifie-le{display:flex; align-items:center; gap:6px; margin-top:12px; font-size:12px; color:var(--text-dim);}
  .note-douce{background:rgba(91,141,239,.1); border:1px solid rgba(91,141,239,.32); color:var(--text);
    border-radius:12px; padding:10px 12px; font-size:12.5px; line-height:1.45; margin:0 0 14px;}
  .note-douce[hidden]{display:none;}

  /* ---------- Sprint Revente-F : Réglages › Affichage (choix du thème, comme Coiffure 8D) ---------- */
  .radio-row.choix-theme{gap:8px;}
  .choix-theme .radio-opt{display:flex; flex-direction:column; align-items:center; gap:2px; padding:10px 4px; min-width:0;}
  .choix-theme .ct-emoji{font-size:18px; line-height:1.2;}
  .choix-theme .ct-nom{font-size:13px; font-weight:800;}
  .choix-theme .ct-sous{font-size:11px; font-weight:600; line-height:1.25;}

  /* ---------- Sprint Revente-F : bandeau MonDjai sur Aujourd'hui ----------
     Le titre et le haut des deux premières tuiles se posent sur le bandeau
     MonDjai (sombre). Thème clair : le bandeau descend derrière le titre et
     ~60 px dans les tuiles du haut (hauteur mesurée après chaque rendu et
     redimensionnement : --bandeau-h), bas arrondi à 26 px. */
  .main.ecran-aujourdhui > .section-title{color:var(--bandeau-text-dim);}
  .main.ecran-aujourdhui > .section-title::after{background:var(--bandeau-filet);}
  .main.ecran-aujourdhui > .dash-grid > .dash-block:not(.info){box-shadow:var(--carte-bandeau-shadow); border-color:var(--carte-bandeau-border);}
  html[data-theme="clair"] .main.ecran-aujourdhui{position:relative; isolation:isolate;}
  html[data-theme="clair"] .main.ecran-aujourdhui::before{content:""; position:absolute; z-index:-1; left:0; right:0; top:0;
    height:var(--bandeau-h, 110px); background:var(--bandeau); border-radius:0 0 26px 26px; pointer-events:none;}

  /* ---------- Sprint Revente-F : onglet Réglages ---------- */
  .main.ecran-reglages > .section-title:first-child{margin-bottom:18px;}

  /* ---------- Sprint Revente-F : onglet Achat/Vente (Achats · Ventes · Stock) ---------- */
  .seg.seg-3 .seg-btn{padding:10px 2px; min-width:0; white-space:nowrap;}
  .seg-btn .sb-emoji{margin-right:4px;}
  @media (max-width:380px){ .seg.seg-3 .seg-btn{font-size:12.5px;} .seg-btn .sb-emoji{margin-right:3px;} }

  /* ---------- Sprint Revente-E : retour visuel au toucher (léger enfoncement) ---------- */
  .btn, .entry-card, .dash-block, .charges-row, .mois-btn, .mois-tile-btn, .caisse-bloc, .seg-btn, .etat-tab, .en-btn,
  .icon-btn, .radio-opt, .chip, .rub-tile, .modele-tile, .choice-card, .pin-key, .modal-close, .tab .tab-emoji, .fab{
    transition:transform .12s ease, background-color .15s ease, opacity .15s ease;
  }
  .btn:active, .entry-card:active, button.dash-block:active, .charges-row:active, .mois-btn:active, .mois-tile-btn:active,
  .caisse-bloc:active, .seg-btn:active, .etat-tab:active, .en-btn:active, .icon-btn:active, .radio-opt:active, .chip:active,
  .rub-tile:active, .modele-tile:active, .choice-card:active, .pin-key:active, .modal-close:active{transform:scale(.97);}
  .tab:active .tab-emoji{transform:scale(.92);}

  /* ---------- Sprint Revente-E : transitions courtes ---------- */
  /* Ajoutées par le script UNIQUEMENT lors d'un vrai changement d'écran,
     d'onglet, d'écran secondaire ou de feuille du bas (jamais à chaque
     redessin : toucher un bouton dans un formulaire ne rejoue rien). */
  @keyframes mdjEcranIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
  @keyframes mdjFondIn{from{opacity:0;} to{opacity:1;}}
  @keyframes mdjFeuilleIn{from{opacity:.5; transform:translateY(56px);} to{opacity:1; transform:none;}}
  @keyframes mdjContenuIn{from{opacity:0; transform:translateY(5px);} to{opacity:1; transform:none;}}
  .anim-ecran{animation:mdjEcranIn .18s ease-out;}
  .modal-overlay.anim-in{animation:mdjFondIn .18s ease-out;}
  .modal-overlay.anim-in .modal{animation:mdjFeuilleIn .2s cubic-bezier(.2,.8,.25,1);}
  .modal.anim-swap{animation:mdjContenuIn .16s ease-out;}

  /* Mouvement réduit demandé par le téléphone : aucune animation ni transition. */
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{animation:none !important; transition:none !important;}
    .btn:active, .entry-card:active, button.dash-block:active, .charges-row:active, .mois-btn:active, .mois-tile-btn:active,
    .caisse-bloc:active, .seg-btn:active, .etat-tab:active, .en-btn:active, .icon-btn:active, .radio-opt:active, .chip:active,
    .rub-tile:active, .modele-tile:active, .choice-card:active, .pin-key:active, .modal-close:active, .fab:active,
    .tab:active .tab-emoji{transform:none !important; opacity:.8;}
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  "use strict";

  // MonDjai/Revente — Sprint Revente-B. Troisième application indépendante de
  // la famille MonDjai, après MonDjai/Coiffure. Fork de la structure « profil
  // unique » de MonDjai/Coiffure (Sprint 7bis) : porte d'entrée par code
  // d'accès, navigation, Réglages, Objectif d'épargne, Télécharger (avec le
  // flou réellement calculé sur les pixels exportés, voir construireCanvasExport
  // ci-dessous). Toute la logique Achats/Ventes/Stock & réassort est reprise
  // à l'identique de MonDjai/Salon F Sprint 4C (F2/F3/F4).
  //
  // Décisions actées avant le Sprint Revente-A (cahier des charges v1, section 11) :
  //  - Écran Aujourd'hui : blocs cliquables (Achats/Ventes/Épargne), le bloc
  //    Bénéfice reste informatif, non cliquable.
  //  - Base de calcul de l'épargne automatique : le Bénéfice réalisé (la
  //    vraie marge), jamais les Ventes encaissées (chiffre d'affaires brut).
  //  - 4 modèles d'objectif d'épargne propres à Revente (OBJECTIF_MODELES).
  //  - Nom retenu : « MonDjai/Revente » (nom court « Revente »).
  //  - Pas de migration guidée depuis Salon F pour ce sprint : Revente
  //    démarre sans données (l'utilisatrice reste libre de restaurer, plus
  //    tard, une sauvegarde JSON Salon F si le besoin s'en fait sentir — le
  //    format achats[]/ventes[]/config.produits est compatible).
  //
  // Sprint Revente-B (par-dessus la structure livrée au Sprint Revente-A) :
  //  - Accès mensuel : bornes calendaires (mois civil), sur le modèle exact de
  //    MonDjai/Coiffure Sprint 5B. Le mois d'installation reste le mois d'essai
  //    gratuit avec le code d'accès initial (HKETCK, inchangé) : avant le 15 du
  //    mois d'installation → essai jusqu'à la fin de ce même mois civil ; à
  //    partir du 15 → essai jusqu'à la fin du mois civil suivant. Ensuite, à
  //    chaque fin de mois civil, le code de réabonnement du mois en cours est
  //    demandé (fonction de calcul déterministe locale, aucun appel réseau).
  //  - Secret de calcul du code mensuel propre à Revente (SECRET_MENSUEL_REVENTE),
  //    distinct de ceux de Coiffure et de Salon F : les codes des trois
  //    applications ne sont jamais interchangeables.
  //  - Réglages → Sauvegarde : au moment de l'export, proposition du dossier de
  //    destination via l'API File System Access (showSaveFilePicker) quand le
  //    navigateur la supporte ; repli automatique et silencieux sur le
  //    téléchargement dans le dossier par défaut sinon (notamment
  //    Safari/iPhone) — aucune perte de fonctionnalité ni de donnée.
  //  - Aucun appel réseau n'est introduit par ces changements ; tout le calcul
  //    (code du mois, bornes calendaires) reste entièrement local.
  //
  // Sprint Revente-C (remarques terrain du 15/10/2026) :
  //  - Correctif : MOIS_NOMS / moisLabelFor manquaient (omis au fork depuis
  //    Coiffure) → ReferenceError sur tous les onglets « Mois ». Les bornes de
  //    navigation précédent/suivant sont désormais comparées sur le début de
  //    période (plus de bouton « précédent » actif qui ne mène nulle part).
  //  - Mes habitudes devient le 5e onglet de la barre du bas (l'icône 📈 de
  //    l'en-tête et l'écran superposé « habitudes » sont supprimés).
  //  - Onglet Achats : deux sous-vues « Détails achats » et « Stock & réappro »,
  //    chacune en Jour / Semaine / Mois sur le modèle de Mon état.
  //  - Écran Aujourd'hui : les blocs occupent toute la hauteur disponible.
  //  - Bouton retour du téléphone : history.pushState + popstate, la navigation
  //    reste dans l'application jusqu'à l'écran Aujourd'hui.
  //  - Mise à jour automatique : vérification à chaque ouverture et à chaque
  //    retour au premier plan, rechargement unique et sans risque quand une
  //    nouvelle version prend le contrôle (sinon bannière douce).
  //  - Données : clé mondjai_revente_state_v1 inchangée, aucun champ ajouté ni
  //    supprimé — un état Sprint B se charge tel quel.
  //
  // Sprint Revente-D (caisse physique, zone « Ce mois-ci », commande spéciale) :
  //  - Fonction unique montantComptabiliseVente() : vente depuis le stock =
  //    montant encaissé ; commande spéciale = montant encaissé − prix payé au
  //    revendeur (seule la marge entre dans la comptabilité, le prix payé au
  //    revendeur est de l'argent « en transit »). Elle remplace le montant
  //    encaissé brut partout où des ventes sont additionnées ou affichées en
  //    liste (Aujourd'hui, Ce mois-ci, caisse, Mon état, Mes habitudes,
  //    Télécharger). Les données enregistrées ne changent pas.
  //  - « Ventes du mois » est un chiffre d'activité, jamais diminué par les
  //    achats ; l'argent physique est une autre grandeur : « Caisse à date » =
  //    fonds de départ + ventes comptabilisées − sorties de caisse, cumulés
  //    depuis le début (report d'un mois à l'autre automatique).
  //  - Sorties de caisse = achats payés avec la caisse + charges communes +
  //    épargne mise de côté (sur le bénéfice réalisé, depuis la création de
  //    l'objectif — comme la carte de l'objectif).
  //  - Données : deux champs ajoutés, migration non destructive dans
  //    normaliserEtatImporte — achats[].sourcePaiement ("caisse" | "autre",
  //    "caisse" par défaut) et config.fondsDepartCaisse (0 par défaut). Un état
  //    ou une sauvegarde Sprint C se charge sans perte.
  //
  // Sprint Revente-E (remarques d'Hamadou du 16/10/2026, après test du D) :
  //  - Aujourd'hui : la zone « Ce mois-ci » n'est plus affichée en permanence.
  //    Un bouton ambre « 📅 Ce mois-ci · <Mois année> » (pastille rouge si la
  //    caisse est négative) l'ouvre dans une feuille du bas, contenu inchangé ;
  //    les 4 blocs du jour reprennent la hauteur libérée. Calculs du Sprint D
  //    inchangés (montantComptabiliseVente, caisse à date, sorties de caisse).
  //  - Achats › Détails achats : plus de listes de semaines ni de jours (le
  //    drill-down d'Achats disparaît) ; Jour / Semaine / Mois + ‹ › conservés.
  //  - Achats › Stock & réappro : tableau Produit / Entrées / Sorties / Stock du
  //    mois civil (‹ › pour revoir un mois passé), avec une ligne TOTAL.
  //  - Vocabulaire : « Me prévenir quand il reste … paquet(s) », « Bientôt
  //    fini », « pensez à racheter » (le champ de données reste seuilReassort).
  //  - Modifier un achat ou une vente (piste d'audit adaptée à un carnet
  //    personnel) : on corrige l'enregistrement au lieu de le supprimer puis le
  //    ressaisir, en gardant la trace — champs ajoutés à l'enregistrement
  //    modifié : modifieLe (horodatage) et versionsPrecedentes (anciennes
  //    valeurs, la plus récente en dernier). id, ts et date de saisie
  //    conservés. Aucune migration nécessaire : champ absent = jamais modifié.
  //  - Finitions visuelles (cartes, pastilles, chiffres à chasse fixe,
  //    transitions courtes seulement lors d'un vrai changement d'écran, de
  //    feuille ou d'onglet ; rien si « mouvement réduit » est demandé).
  //
  // Sprint Revente-F (observations d'Hamadou du 18/10/2026, après le E) :
  //  - Thème clair « bandeau MonDjai » par défaut, calqué sur MonDjai/Coiffure
  //    (Sprint 8D) : mêmes variables CSS en deux jeux (sombre = rendu du E),
  //    script dans <head> qui pose data-theme avant le premier affichage,
  //    Réglages › Affichage : Clair (par défaut) / Automatique / Sombre
  //    (config.theme, absent = clair : rien n'est réécrit au chargement).
  //  - Mêmes rubriques que les autres applications : la barre du bas devient
  //    Aujourd'hui · Achat/Vente · Mon état · Mes habitudes · Réglages.
  //    Achats et Ventes sont réunis dans « Achat/Vente » (Achats · Ventes ·
  //    Stock, contenus inchangés) ; Réglages passe dans la barre du bas et
  //    Télécharger prend sa place en haut. Pas de section « Installer
  //    l'application » (propre à Coiffure).
  //  - Aucun calcul ne change.
  //
  // Sprint Revente-F2 (retours d'Hamadou du 18/10/2026 sur le F) :
  //  - Bouton « + » aussi sur Aujourd'hui : saisie rapide d'une vente.
  //  - Achat/Vente › Ventes présentée comme les achats : Jour / Semaine / Mois
  //    (même période que la vue Achats), carte du total, liste de la période.
  //    Pas de charges sur une vente.

  var STORAGE_KEY = "mondjai_revente_state_v1";

  // Version affichée dans Réglages → À propos, pour vérifier d'un coup d'œil
  // quelle version tourne sur un téléphone. Le numéro de cache doit être le
  // même que VERSION_CACHE dans sw.js.
  var VERSION_APP = "Revente-F2 · cache 7";

  /* ================= Helpers ================= */

  function uid(prefix){
    return prefix + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8);
  }
  function pad2(n){ return n < 10 ? "0"+n : ""+n; }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
  }
  function formatDateFr(s){
    if(!s) return "";
    var parts = s.split("-");
    if(parts.length !== 3) return s;
    return parts[2] + "/" + parts[1] + "/" + parts[0];
  }
  function formatFCFA(n){
    var num = Math.round(Number(n) || 0);
    var neg = num < 0;
    num = Math.abs(num);
    var s = String(num).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    // Sprint Revente-E : vrai signe moins (U+2212) — avec les chiffres à chasse
    // fixe, le trait d'union « - » s'élargit et se détache du nombre.
    return (neg ? "−" : "") + s + " F";
  }
  function toNum(v){
    var n = parseFloat(String(v === undefined || v === null ? "" : v).replace(",", "."));
    return isNaN(n) ? 0 : n;
  }
  function esc(s){
    return String(s === undefined || s === null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function byId(id){ return document.getElementById(id); }

  /* ================= Données par défaut ================= */

  function seedRubriquesChargesDefaut(){
    return RUBRIQUES_CHARGES_DEFAUT.map(function(r){
      return { id:r.id, nom:r.nom, emoji:r.emoji, actif:r.actif, perso:false };
    });
  }
  var RUBRIQUES_CHARGES_DEFAUT = [
    { id:"loyer", nom:"Loyer / local de stockage", emoji:"🏠", actif:true },
    { id:"transport_general", nom:"Transport / déplacement", emoji:"🚚", actif:true },
    { id:"publicite", nom:"Publicité", emoji:"📣", actif:true },
    { id:"emballage", nom:"Emballage / conditionnement", emoji:"📦", actif:false },
    { id:"communication", nom:"Crédit téléphone / communication", emoji:"📱", actif:false },
    { id:"autre", nom:"Autre", emoji:"📝", actif:true }
  ];

  function defaultState(){
    return {
      version: 1,
      config: {
        produits: [],                 // { id, nom, dernierPrixAchat, dernierPrixVenteEstime, seuilReassort }
        rubriquesCharges: seedRubriquesChargesDefaut(),
        codeAccesOk: false,
        derniereValidationAcces: null,
        moisAccesValide: null,        // { mois, annee } — dernier mois civil couvert par l'accès (essai ou code mensuel)
        pinActif: false,
        pinCode: null,
        fondsDepartCaisse: 0          // Sprint Revente-D : argent déjà en caisse au départ (facultatif)
      },
      achats: [],                     // { …, sourcePaiement:"caisse"|"autre" } (Sprint Revente-D)
      ventes: [],
      autresCharges: [],
      objectifEpargne: null,          // { id, nom, emoji, type:'auto'|'manuel', pourcentage/montant, dateCreation }
      objectifsVerrouilles: [],       // emplacements grisés en annonce (jamais affichés en détail)
      meta: { creation: todayStr(), derniereSauvegarde: null }
    };
  }

  function merge(base, extra){
    var out = {};
    for(var k in base) out[k] = base[k];
    if(extra) for(var k2 in extra) if(extra[k2] !== undefined) out[k2] = extra[k2];
    return out;
  }

  var state;

  // Fusion défensive d'un état chargé (localStorage) ou importé (JSON) avec
  // l'état par défaut. Accepte aussi, en repli, une sauvegarde faite depuis
  // MonDjai/Salon F (mêmes champs achats/ventes/config.produits de base) —
  // toute donnée propre aux autres profils (prestations coiffure/pédicure)
  // est simplement ignorée, sans faire échouer tout l'import.
  function normaliserEtatImporte(parsed){
    var base = defaultState();
    if(!parsed || typeof parsed !== "object") return base;
    var out = merge(base, parsed);
    out.config = merge(base.config, parsed.config || {});
    if(!Array.isArray(out.config.produits)) out.config.produits = [];
    if(!Array.isArray(out.config.rubriquesCharges) || !out.config.rubriquesCharges.length) out.config.rubriquesCharges = base.config.rubriquesCharges;
    if(!Array.isArray(out.achats)) out.achats = [];
    if(!Array.isArray(out.ventes)) out.ventes = [];
    if(!Array.isArray(out.autresCharges)) out.autresCharges = [];
    if(!Array.isArray(out.objectifsVerrouilles)) out.objectifsVerrouilles = [];
    if(out.objectifEpargne && typeof out.objectifEpargne !== "object") out.objectifEpargne = null;
    out.meta = merge(base.meta, parsed.meta || {});
    migrerValidationAcces(out);
    migrerAccesCalendaire(out);
    migrerCaisse(out);
    return out;
  }

  // Sprint Revente-D — migration non destructive (rien n'est supprimé ni
  // réécrit, seuls des champs manquants sont ajoutés) :
  //  - un achat sans `sourcePaiement` (enregistré avant le Sprint D) devient
  //    « payé avec la caisse », le cas de loin le plus courant ;
  //  - `config.fondsDepartCaisse` absent ou illisible → 0.
  function migrerCaisse(out){
    out.achats = out.achats.map(function(a){
      if(!a || typeof a !== "object") return a;
      if(a.sourcePaiement === "caisse" || a.sourcePaiement === "autre") return a;
      return merge(a, { sourcePaiement: "caisse" });
    });
    var f = Number(out.config.fondsDepartCaisse);
    out.config.fondsDepartCaisse = (isFinite(f) && f > 0) ? f : 0;
  }

  // Amendement Sprint Revente-B (repris tel quel de Coiffure Sprint 4C/5B) : un
  // état déjà validé (codeAccesOk vrai) mais sans horodatage de dernière
  // validation vient forcément d'un état Sprint Revente-A — on lui accorde un
  // horodatage "maintenant" plutôt que de considérer l'accès expiré dès la
  // mise à jour de l'application.
  function migrerValidationAcces(out){
    if(out.config.codeAccesOk && !out.config.derniereValidationAcces){
      out.config.derniereValidationAcces = Date.now();
    }
  }

  // Sprint Revente-B : un état déjà validé (codeAccesOk vrai) qui n'a pas
  // encore de `moisAccesValide` vient forcément du Sprint Revente-A (accès
  // initial simple, sans accès mensuel calendaire). On calcule le mois d'essai
  // qui aurait dû s'appliquer à partir de la date d'installation réelle
  // (`meta.creation`, fixée dès le tout premier lancement et jamais réécrite) ;
  // si une validation plus récente existe déjà, on ne fait jamais reculer
  // l'accès déjà acquis — on couvre au moins son mois. Une migration technique
  // ne doit jamais bloquer immédiatement une utilisatrice déjà à jour.
  function migrerAccesCalendaire(out){
    if(!out.config.codeAccesOk) return;
    if(out.config.moisAccesValide) return;
    var installation = parseDateStr(out.meta.creation) || new Date();
    var couverture = finEssaiPourInstallation(installation);
    if(out.config.derniereValidationAcces){
      var dv = new Date(out.config.derniereValidationAcces);
      var moisValidation = { mois: dv.getMonth()+1, annee: dv.getFullYear() };
      if(compareMoisAnnee(moisValidation, couverture) > 0) couverture = moisValidation;
    }
    out.config.moisAccesValide = couverture;
  }

  function loadState(){
    var raw;
    try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){ raw = null; }
    if(!raw) return defaultState();
    var parsed;
    try{ parsed = JSON.parse(raw); }catch(e){ return defaultState(); }
    return normaliserEtatImporte(parsed);
  }
  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ /* stockage indisponible : on continue quand même */ }
  }

  /* ================= Sauvegarde / restauration JSON ================= */
  // Sprint Revente-B (repris à l'identique de Coiffure Sprint 5B, F11) : quand
  // le navigateur propose l'API File System Access (Chrome/Edge/Android), on
  // laisse l'utilisatrice choisir le dossier de destination. Sinon (notamment
  // Safari/iPhone), repli automatique et silencieux sur le téléchargement dans
  // le dossier par défaut — comportement du Sprint Revente-A, inchangé. Aucun
  // appel réseau dans les deux cas.

  function exporterJson(){
    var filename = "mondjai-revente-" + todayStr() + ".json";
    var contenu = JSON.stringify(state, null, 2);
    if(typeof window.showSaveFilePicker === "function"){
      exporterJsonAvecChoixDossier(contenu, filename);
    } else {
      exporterJsonTelechargementDirect(contenu, filename);
    }
  }
  function marquerSauvegardeReussie(message){
    state.meta.derniereSauvegarde = todayStr();
    saveState();
    ui.backupMsg = message;
    render();
  }
  function exporterJsonTelechargementDirect(contenu, filename){
    try{
      var blob = new Blob([contenu], { type:"application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      marquerSauvegardeReussie("Sauvegarde téléchargée.");
    }catch(e){
      ui.backupMsg = "Impossible de générer le fichier sur cet appareil.";
      render();
    }
  }
  function exporterJsonAvecChoixDossier(contenu, filename){
    window.showSaveFilePicker({
      suggestedName: filename,
      types: [{ description: "Sauvegarde MonDjai/Revente", accept: { "application/json": [".json"] } }]
    }).then(function(handle){
      return handle.createWritable().then(function(writable){
        return writable.write(contenu).then(function(){ return writable.close(); });
      });
